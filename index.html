<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0D7377" />
  <meta name="description" content="Respiratory Assessment Mastery App for 3rd Year BS Nursing Students. Developed by JEMUEL C. MARI, MAN, RN, LPT — Tarlac State University." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>🫁 Respiratory Assessment Mastery</title>
  <style>
    :root {
      --primary: #0D7377;
      --primary-dark: #095456;
      --secondary: #1E88E5;
      --accent: #E53935;
      --success: #43A047;
      --warning: #FB8C00;
      --dark: #263238;
      --light: #ECEFF1;
      --white: #FFFFFF;
      --gray: #607D8B;
      --radius: 12px;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
      --font-head: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--light);
      color: var(--dark);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 700; line-height: 1.3; }
    h1 { font-size: 2rem; }
    h2 { font-size: 1.6rem; color: var(--primary); margin-bottom: 0.5rem; }
    h3 { font-size: 1.25rem; color: var(--secondary); margin: 1rem 0 0.5rem; }
    h4 { font-size: 1.1rem; color: var(--dark); margin: 0.75rem 0 0.4rem; }
    p { margin-bottom: 0.75rem; }
    a { color: var(--secondary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .app-container { display: flex; min-height: 100vh; }
    .sidebar {
      width: 280px;
      background: var(--primary);
      color: var(--white);
      padding: 1.5rem 1rem;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      overflow-y: auto;
      z-index: 100;
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      display: flex; align-items: center; gap: 0.75rem;
      padding-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.2);
      margin-bottom: 1rem;
    }
    .sidebar-header .logo { font-size: 2rem; }
    .sidebar-header h1 { font-size: 1.1rem; color: var(--white); }
    .sidebar-header small { display: block; font-size: 0.7rem; opacity: 0.8; font-weight: 400; }
    .nav-section { margin-bottom: 1.25rem; }
    .nav-section-title {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;
      opacity: 0.7; margin-bottom: 0.5rem; padding-left: 0.5rem;
    }
    .nav-item {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.6rem 0.75rem; border-radius: 8px;
      color: rgba(255,255,255,0.9); cursor: pointer;
      font-size: 0.9rem; transition: background 0.2s;
      border: none; background: none; width: 100%; text-align: left;
      font-family: var(--font-body);
    }
    .nav-item:hover { background: rgba(255,255,255,0.1); }
    .nav-item.active { background: rgba(255,255,255,0.2); font-weight: 600; }
    .nav-item.completed::after { content: '✅'; margin-left: auto; font-size: 0.8rem; }
    .nav-item .icon { font-size: 1.1rem; width: 1.5rem; text-align: center; }
    .sidebar-footer {
      margin-top: auto;
      padding: 1rem 0.5rem;
      border-top: 1px solid rgba(255,255,255,0.2);
      font-size: 0.72rem;
      line-height: 1.5;
      color: rgba(255,255,255,0.9);
    }
    .sidebar-footer .dev-label {
      font-size: 0.62rem; text-transform: uppercase; letter-spacing: 1px;
      opacity: 0.7; margin-bottom: 0.3rem;
    }
    .sidebar-footer .dev-name {
      font-weight: 700; color: #FFFFFF; font-size: 0.78rem;
    }
    .main-content {
      margin-left: 280px;
      flex: 1;
      padding: 2rem;
      max-width: 1000px;
    }
    .menu-toggle {
      display: none;
      position: fixed; top: 1rem; left: 1rem; z-index: 200;
      background: var(--primary); color: var(--white);
      border: none; border-radius: 50%; width: 48px; height: 48px;
      font-size: 1.5rem; cursor: pointer; box-shadow: var(--shadow-lg);
    }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; padding: 1rem; padding-top: 4rem; }
      .menu-toggle { display: flex; align-items: center; justify-content: center; }
      h1 { font-size: 1.5rem; }
      h2 { font-size: 1.3rem; }
    }
    .card {
      background: var(--white); border-radius: var(--radius);
      padding: 1.5rem; box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 1.5rem; border-radius: 8px;
      border: none; cursor: pointer; font-family: var(--font-head);
      font-weight: 600; font-size: 0.95rem; transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: var(--white); }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-secondary { background: var(--secondary); color: var(--white); }
    .btn-secondary:hover { background: #1565C0; }
    .btn-accent { background: var(--accent); color: var(--white); }
    .btn-success { background: var(--success); color: var(--white); }
    .btn-outline {
      background: transparent; color: var(--primary);
      border: 2px solid var(--primary);
    }
    .btn-outline:hover { background: var(--primary); color: var(--white); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.85rem; }
    .btn-block { width: 100%; justify-content: center; }
    .progress-bar {
      height: 12px; background: #CFD8DC; border-radius: 6px;
      overflow: hidden; margin: 0.5rem 0;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--success), var(--primary));
      border-radius: 6px; transition: width 0.5s ease;
    }
    .badge-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem; margin: 1rem 0;
    }
    .badge {
      background: var(--light); border-radius: 8px; padding: 0.75rem;
      text-align: center; border: 2px solid transparent; transition: all 0.3s;
    }
    .badge.unlocked { background: #E8F5E9; border-color: var(--success); }
    .badge.locked { opacity: 0.5; }
    .badge .badge-icon { font-size: 1.8rem; display: block; }
    .badge .badge-name { font-size: 0.75rem; font-weight: 600; margin-top: 0.25rem; }
    .table-wrap { overflow-x: auto; margin: 1rem 0; }
    table {
      width: 100%; border-collapse: collapse; font-size: 0.9rem;
      background: var(--white); border-radius: 8px; overflow: hidden;
    }
    th {
      background: var(--primary); color: var(--white);
      padding: 0.75rem; text-align: left; font-family: var(--font-head);
      font-size: 0.85rem;
    }
    td { padding: 0.65rem 0.75rem; border-bottom: 1px solid #E0E0E0; }
    tr:nth-child(even) { background: #F5F7F8; }
    tr:hover { background: #E0F2F1; }
    .callout {
      padding: 1rem 1.25rem; border-radius: 8px; margin: 1rem 0;
      border-left: 4px solid;
    }
    .callout-warning { background: #FFF3E0; border-color: var(--warning); }
    .callout-danger { background: #FFEBEE; border-color: var(--accent); }
    .callout-success { background: #E8F5E9; border-color: var(--success); }
    .callout-info { background: #E3F2FD; border-color: var(--secondary); }
    .callout strong { font-family: var(--font-head); }
    .accordion-item {
      border: 1px solid #CFD8DC; border-radius: 8px;
      margin-bottom: 0.5rem; overflow: hidden; background: var(--white);
    }
    .accordion-header {
      padding: 0.85rem 1rem; cursor: pointer; display: flex;
      justify-content: space-between; align-items: center;
      font-weight: 600; background: var(--light); transition: background 0.2s;
      border: none; width: 100%; text-align: left; font-family: var(--font-head);
      font-size: 0.95rem; color: var(--dark);
    }
    .accordion-header:hover { background: #CFD8DC; }
    .accordion-header .arrow { transition: transform 0.3s; }
    .accordion-item.open .accordion-header .arrow { transform: rotate(180deg); }
    .accordion-body {
      max-height: 0; overflow: hidden; transition: max-height 0.3s ease;
      padding: 0 1rem;
    }
    .accordion-item.open .accordion-body { max-height: 3000px; padding: 1rem; }
    .flashcard-container {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem; margin: 1rem 0;
    }
    .flashcard {
      perspective: 1000px; height: 140px; cursor: pointer;
    }
    .flashcard-inner {
      position: relative; width: 100%; height: 100%;
      transition: transform 0.6s; transform-style: preserve-3d;
    }
    .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem; text-align: center; font-size: 0.9rem;
      box-shadow: var(--shadow);
    }
    .flashcard-front { background: var(--white); border: 2px solid var(--primary); }
    .flashcard-back { background: var(--primary); color: var(--white); transform: rotateY(180deg); }
    .quiz-question { margin-bottom: 1.5rem; }
    .quiz-question .q-text { font-weight: 600; margin-bottom: 0.75rem; }
    .quiz-options { display: flex; flex-direction: column; gap: 0.5rem; }
    .quiz-option {
      padding: 0.75rem 1rem; border: 2px solid #CFD8DC; border-radius: 8px;
      cursor: pointer; background: var(--white); transition: all 0.2s;
      font-family: var(--font-body); font-size: 0.9rem; text-align: left;
    }
    .quiz-option:hover { border-color: var(--secondary); background: #E3F2FD; }
    .quiz-option.selected { border-color: var(--secondary); background: #E3F2FD; }
    .quiz-option.correct { border-color: var(--success); background: #E8F5E9; }
    .quiz-option.incorrect { border-color: var(--accent); background: #FFEBEE; }
    .quiz-feedback {
      margin-top: 0.75rem; padding: 0.75rem; border-radius: 8px;
      font-size: 0.9rem; display: none;
    }
    .quiz-feedback.show { display: block; }
    .quiz-feedback.correct { background: #E8F5E9; border-left: 4px solid var(--success); }
    .quiz-feedback.incorrect { background: #FFEBEE; border-left: 4px solid var(--accent); }
    .dashboard-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem; margin: 1rem 0;
    }
    .stat-card {
      background: var(--white); border-radius: var(--radius);
      padding: 1.25rem; box-shadow: var(--shadow); text-align: center;
    }
    .stat-card .stat-value { font-size: 2rem; font-weight: 700; color: var(--primary); }
    .stat-card .stat-label { font-size: 0.85rem; color: var(--gray); }
    .certificate {
      background: linear-gradient(135deg, #FFF8E1, #FFFFFF);
      border: 8px double var(--primary); border-radius: var(--radius);
      padding: 2rem; text-align: center; max-width: 700px; margin: 1rem auto;
    }
    .certificate h2 { color: var(--primary); font-size: 1.8rem; }
    .certificate .name {
      font-size: 2rem; font-family: var(--font-head); color: var(--dark);
      border-bottom: 2px solid var(--primary); display: inline-block;
      padding: 0 2rem 0.5rem; margin: 1rem 0;
    }
    .certificate .score { font-size: 1.5rem; color: var(--success); font-weight: 700; }
    .developer-card {
      background: linear-gradient(135deg, #E0F2F1, #E3F2FD);
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: 1.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .developer-card .dev-label {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--gray); font-weight: 600; margin-bottom: 0.5rem;
    }
    .developer-card .dev-name {
      font-family: var(--font-head); font-weight: 700; font-size: 1.15rem;
      color: var(--primary); margin-bottom: 0.5rem;
    }
    .developer-card .dev-info {
      font-size: 0.85rem; color: var(--dark); line-height: 1.7;
    }
    .developer-card .dev-info strong { color: var(--dark); }
    .loader {
      display: flex; align-items: center; justify-content: center;
      padding: 3rem; font-size: 1.2rem; color: var(--gray);
    }
    .loader::after {
      content: ''; width: 24px; height: 24px; margin-left: 0.75rem;
      border: 3px solid var(--light); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: var(--dark); color: var(--white);
      padding: 0.85rem 1.25rem; border-radius: 8px;
      box-shadow: var(--shadow-lg); z-index: 999;
      transform: translateY(200%); transition: transform 0.3s;
      max-width: 320px; font-size: 0.9rem;
    }
    .toast.show { transform: translateY(0); }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--accent); }
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .mb-1 { margin-bottom: 0.5rem; }
    .mb-2 { margin-bottom: 1rem; }
    .flex { display: flex; }
    .gap-1 { gap: 0.5rem; }
    .flex-wrap { flex-wrap: wrap; }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }
  </style>
</head>
<body>

<button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>

<div class="app-container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="logo">🫁</span>
      <div>
        <h1>Respiratory Mastery</h1>
        <small>NCM 101B Lab</small>
      </div>
    </div>

    <nav id="navMenu">
      <div class="nav-section">
        <div class="nav-section-title">Main</div>
        <button class="nav-item active" data-view="home">
          <span class="icon">🏠</span> Dashboard
        </button>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Learning Units</div>
        <button class="nav-item" data-view="unit1"><span class="icon">📚</span> 1. Normal Baseline</button>
        <button class="nav-item" data-view="unit2"><span class="icon">👁️</span> 2. Inspection</button>
        <button class="nav-item" data-view="unit3"><span class="icon">✋</span> 3. Palpation</button>
        <button class="nav-item" data-view="unit4"><span class="icon">👂</span> 4. Percussion</button>
        <button class="nav-item" data-view="unit5"><span class="icon">🩺</span> 5. Auscultation</button>
        <button class="nav-item" data-view="unit6"><span class="icon">🔍</span> 6. Disease Patterns</button>
        <button class="nav-item" data-view="unit7"><span class="icon">💉</span> 7. Interventions</button>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Mastery</div>
        <button class="nav-item" data-view="games"><span class="icon">🎮</span> Mastery Games</button>
        <button class="nav-item" data-view="exam"><span class="icon">📝</span> Capstone Exam</button>
        <button class="nav-item" data-view="certificate"><span class="icon">🏆</span> Certificate</button>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Reference</div>
        <button class="nav-item" data-view="matrix"><span class="icon">📊</span> DDx Matrix</button>
        <button class="nav-item" data-view="decision"><span class="icon">🌳</span> Decision Tree</button>
        <button class="nav-item" data-view="redflags"><span class="icon">🚨</span> Red Flags</button>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="dev-label">Developed by</div>
      <div class="dev-name">JEMUEL C. MARI, MAN, RN, LPT</div>
      <div>Clinical Instructor</div>
      <div>Teacher II — DepEd</div>
      <div>Tarlac State University</div>
      <div>College of Science — Nursing Dept.</div>
    </div>
  </aside>

  <main class="main-content" id="mainContent">
    <div class="loader">Loading module...</div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const APP = {
  version: '1.0.0',
  storageKey: 'respMastery_v1',
  state: {
    currentView: 'home',
    progress: {},
    badges: {},
    quizAttempts: {},
    games: {},
  },
};

function loadState() {
  try {
    const saved = localStorage.getItem(APP.storageKey);
    if (saved) APP.state = { ...APP.state, ...JSON.parse(saved) };
  } catch (e) { console.warn('State load failed', e); }
}
function saveState() {
  try { localStorage.setItem(APP.storageKey, JSON.stringify(APP.state)); }
  catch (e) { console.warn('State save failed', e); }
}
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}
function navigate(view) {
  APP.state.currentView = view;
  saveState();
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.view === view);
  });
  renderView(view);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  document.getElementById('sidebar').classList.remove('open');
}

function renderView(view) {
  const main = document.getElementById('mainContent');
  main.innerHTML = '<div class="loader">Loading...</div>';
  setTimeout(() => {
    switch (view) {
      case 'home': return renderHome(main);
      case 'unit1': return renderUnit1(main);
      case 'unit2': return renderUnit2(main);
      case 'unit3': return renderUnit3(main);
      case 'unit4': return renderUnit4(main);
      case 'unit5': return renderUnit5(main);
      case 'unit6': return renderUnit6(main);
      case 'unit7': return renderUnit7(main);
      case 'games': return renderGames(main);
      case 'exam': return renderExam(main);
      case 'certificate': return renderCertificate(main);
      case 'matrix': return renderMatrix(main);
      case 'decision': return renderDecision(main);
      case 'redflags': return renderRedFlags(main);
      default: return renderHome(main);
    }
  }, 100);
}

function getProgressPercent() {
  const units = ['unit1','unit2','unit3','unit4','unit5','unit6','unit7'];
  const done = units.filter(u => APP.state.progress[u]?.completed).length;
  return Math.round((done / units.length) * 100);
}
function isUnitComplete(id) { return !!APP.state.progress[id]?.completed; }
function completeUnit(id, score) {
  APP.state.progress[id] = { completed: true, score, date: new Date().toISOString() };
  if (!APP.state.quizAttempts[id]) APP.state.quizAttempts[id] = [];
  APP.state.quizAttempts[id].push(score);
  updateBadges();
  saveState();
}
function updateBadges() {
  const p = APP.state.progress;
  APP.state.badges = {
    baseline: !!p.unit1?.completed,
    patternSpotter: !!(p.unit2?.completed && p.unit3?.completed && p.unit4?.completed && p.unit5?.completed),
    diseaseDetective: !!p.unit6?.completed,
    interventionExpert: !!p.unit7?.completed,
    respiratoryMaster: getProgressPercent() === 100,
  };
}

function renderHome(main) {
  const pct = getProgressPercent();
  const b = APP.state.badges;
  main.innerHTML = `
    <div class="card">
      <h1>🫁 Respiratory Assessment Mastery</h1>
      <p style="color:var(--gray);margin-bottom:1rem;">NCM 101B Lab — Pattern Recognition for 3rd Year BS Nursing</p>
      <div class="callout callout-info">
        <strong>Expert nurses do not diagnose based on one abnormal finding.</strong> They correlate subjective symptoms, inspection, palpation, percussion, auscultation, and oxygenation status to identify the probable underlying condition.
      </div>
    </div>

    <div class="card">
      <h2>Your Progress</h2>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <p class="text-center" style="font-weight:700;color:var(--primary);">${pct}% Complete</p>
      <div class="badge-grid">
        ${badgeHTML('🥉','Baseline Builder', b.baseline)}
        ${badgeHTML('🥈','Pattern Spotter', b.patternSpotter)}
        ${badgeHTML('🥇','Disease Detective', b.diseaseDetective)}
        ${badgeHTML('💎','Intervention Expert', b.interventionExpert)}
        ${badgeHTML('🏆','Respiratory Master', b.respiratoryMaster)}
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="stat-card">
        <div class="stat-value">${Object.keys(APP.state.progress).length}/7</div>
        <div class="stat-label">Units Completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${averageScore()}%</div>
        <div class="stat-label">Average Quiz Score</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${totalAttempts()}</div>
        <div class="stat-label">Total Quiz Attempts</div>
      </div>
    </div>

    <div class="card">
      <h2>Quick Actions</h2>
      <div class="flex flex-wrap gap-1">
        <button class="btn btn-primary" onclick="navigate('${nextUnit()}')">📚 Continue Learning</button>
        <button class="btn btn-secondary" onclick="navigate('games')">🎮 Mastery Games</button>
        <button class="btn btn-accent" onclick="navigate('exam')">📝 Capstone Exam</button>
        <button class="btn btn-outline" onclick="navigate('matrix')">📊 Quick Reference</button>
      </div>
    </div>

    <div class="developer-card">
      <div class="dev-label">Developed by</div>

function matrixTable() {
  const rows = [
    ['Normal','Normal','Resonant','Vesicular','Healthy'],
    ['Pneumonia','↑','Dull','Crackles','Consolidation'],
    ['Pleural Effusion','↓','Dull','Absent','Fluid'],
    ['Hemothorax','↓','Dull','Absent','Blood + Trauma'],
    ['Pneumothorax','↓','Hyperresonant','Absent','Air'],
    ['Atelectasis','↓','Dull','Diminished','Post-op'],
    ['Pulmonary Edema','Normal','Normal/Dull','Crackles','Pink Frothy Sputum'],
    ['Asthma','Normal','Hyperresonant','Wheezes','Prolonged Expiration'],
    ['Emphysema','↓','Hyperresonant','Diminished','Barrel Chest'],
    ['Chronic Bronchitis','Normal','Resonant','Rhonchi/Wheezes','Productive Cough'],
    ['Tuberculosis','↑','Dull','Crackles','Hemoptysis'],
    ['Pulmonary Embolism','Usually Normal','Usually Normal','Usually Normal','Sudden Dyspnea'],

  return `<table>

}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initQuiz(unitId) {
  const container = document.getElementById('quizBody-' + unitId);

  const qs = unitId === 'exam' ? APP._examQ : QUIZZES[unitId];
  container.innerHTML = qs.map((q, i) => `

      <div class="quiz-options">

function selectOption(btn) {
  const siblings = btn.parentElement.querySelectorAll('.quiz-option');
  siblings.forEach(s => s.classList.remove('selected'));
  btn.classList.add('selected');
}
function submitQuiz(unitId) {
  const qs = unitId === 'exam' ? APP._examQ : QUIZZES[unitId];
  if (!qs) return;
  let correct = 0;
  qs.forEach((q, i) => {
    const questionEl = document.querySelector(`.quiz-question[data-q="${i}"]`);
    const selected = questionEl.querySelector('.quiz-option.selected');
    const feedback = questionEl.querySelector('.quiz-feedback');
    if (selected) {
      const choice = selected.textContent.trim();
      const isCorrect = choice === q.answer;
      if (isCorrect) correct++;
      selected.classList.add(isCorrect ? 'correct' : 'incorrect');
      feedback.className = 'quiz-feedback show ' + (isCorrect ? 'correct' : 'incorrect');
      feedback.innerHTML = isCorrect
        ? '✅ Correct!'
        : `❌ Incorrect. Correct answer: <strong>${q.answer}</strong>`;
    } else {
      feedback.className = 'quiz-feedback show incorrect';
      feedback.innerHTML = `⚠️ No answer selected. Correct answer: <strong>${q.answer}</strong>`;
    }
  });
  const pct = Math.round((correct/qs.length)*100);
  const pass = pct >= 90;
  const resultEl = document.getElementById('quizResult-' + unitId);
  resultEl.innerHTML = `
    <div class="callout ${pass ? 'callout-success' : 'callout-warning'}">
      <strong>Score: ${correct}/${qs.length} (${pct}%)</strong><br>
      ${pass ? '✅ Mastery achieved!' : '⚠️ You need 90% to master this unit. Review and try again.'}
    </div>
    <button class="btn btn-outline mt-1" onclick="retryQuiz('${unitId}')">🔄 Retry Quiz</button>
  `;
  if (pass && unitId !== 'exam') {
    completeUnit(unitId, pct);
    toast('✅ Unit mastered!', 'success');
  }
  if (pass && unitId === 'exam') {
    if (!APP.state.quizAttempts.exam) APP.state.quizAttempts.exam = [];
    APP.state.quizAttempts.exam.push(pct);
    saveState();
    toast('🏆 Capstone Exam passed!', 'success');
  }
}
function retryQuiz(unitId) {
  if (unitId === 'exam') return renderExam(document.getElementById('mainContent'));
  initQuiz(unitId);
  document.getElementById('quizResult-' + unitId).innerHTML = '';
}
