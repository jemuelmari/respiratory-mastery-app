<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0D7377" />
  <title>🫁 Respiratory Mastery v4.0</title>
  <style>
    :root {
      --primary: #0D7377; --primary-dark: #095456; --primary-light: #E0F2F1;
      --secondary: #1E88E5; --secondary-light: #E3F2FD;
      --accent: #E53935; --accent-light: #FFEBEE;
      --success: #43A047; --success-light: #E8F5E9;
      --warning: #FB8C00; --warning-light: #FFF3E0;
      --purple: #8E24AA; --purple-light: #F3E5F5;
      --dark: #0F2027; --dark-2: #203A43; --light: #F7F9FC; --white: #FFFFFF;
      --gray: #718096; --gray-light: #E2E8F0; --border: #CBD5E0;
      --radius: 16px; --radius-sm: 10px; --radius-lg: 24px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow: 0 8px 24px rgba(0,0,0,0.08);
      --shadow-lg: 0 20px 48px rgba(0,0,0,0.15);
      --font-head: 'Inter', -apple-system, sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
      --sidebar-w: 280px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: var(--font-body); background: var(--light); color: var(--dark); line-height: 1.6; font-size: 15px; }
    h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 700; line-height: 1.25; }
    h1 { font-size: 1.85rem; font-weight: 800; }
    h2 { font-size: 1.4rem; font-weight: 700; }
    h3 { font-size: 1.1rem; font-weight: 700; }
    p { margin-bottom: 0.6rem; }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; }
    a { color: var(--secondary); text-decoration: none; }
    .app-container { display: flex; min-height: 100vh; }
    .sidebar { width: var(--sidebar-w); background: linear-gradient(180deg, var(--dark) 0%, var(--dark-2) 100%); color: var(--white); padding: 1.5rem 1rem; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 100; display: flex; flex-direction: column; }
    .sidebar-header { display: flex; align-items: center; gap: 0.85rem; padding: 0.5rem 0.5rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 1.25rem; }
    .sidebar-header .logo-wrap { width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; flex-shrink: 0; }
    .sidebar-header h1 { font-size: 1.05rem; color: var(--white); }
    .sidebar-header small { display: block; font-size: 0.7rem; color: rgba(255,255,255,0.6); margin-top: 0.15rem; }
    .student-card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 1rem; margin-bottom: 1.25rem; }
    .student-card .avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-weight: 800; font-size: 1.2rem; color: var(--white); margin-bottom: 0.65rem; }
    .student-card .name { font-family: var(--font-head); font-weight: 700; font-size: 0.95rem; color: var(--white); margin-bottom: 0.2rem; }
    .student-card .meta { font-size: 0.72rem; color: rgba(255,255,255,0.65); line-height: 1.5; margin-bottom: 0.75rem; }
    .student-card .chip-actions { display: flex; gap: 0.4rem; }
    .student-card .chip-btn { flex: 1; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.15); color: var(--white); padding: 0.45rem 0.5rem; border-radius: 8px; font-size: 0.72rem; font-family: var(--font-head); font-weight: 600; transition: 0.15s; }
    .student-card .chip-btn:hover { background: rgba(255,255,255,0.2); }
    .student-card .chip-btn.danger { background: rgba(229,57,53,0.25); border-color: rgba(229,57,53,0.4); }
    .nav-section { margin-bottom: 1.25rem; }
    .nav-section-title { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1.2px; color: rgba(255,255,255,0.4); margin-bottom: 0.5rem; padding: 0 0.65rem; font-weight: 700; }
    .nav-item { display: flex; align-items: center; gap: 0.7rem; padding: 0.7rem 0.85rem; border-radius: 10px; color: rgba(255,255,255,0.75); cursor: pointer; font-size: 0.88rem; transition: 0.15s; border: none; background: none; width: 100%; text-align: left; font-family: var(--font-body); font-weight: 500; margin-bottom: 0.15rem; }
    .nav-item:hover { background: rgba(255,255,255,0.08); color: var(--white); }
    .nav-item.active { background: linear-gradient(90deg, rgba(13,115,119,0.5), rgba(30,136,229,0.2)); color: var(--white); font-weight: 600; box-shadow: inset 3px 0 0 var(--primary); }
    .nav-item .icon { font-size: 1.05rem; width: 1.5rem; text-align: center; display: flex; align-items: center; justify-content: center; }
    .nav-item.logout { color: #FFCDD2; }
    .sidebar-footer { margin-top: auto; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.08); font-size: 0.72rem; line-height: 1.55; color: rgba(255,255,255,0.55); }
    .sidebar-footer .dev-name { font-weight: 700; color: var(--white); font-size: 0.78rem; }
    .sidebar-footer .version-tag { display: inline-block; margin-top: 0.5rem; padding: 0.2rem 0.55rem; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: var(--white); border-radius: 999px; font-size: 0.65rem; font-weight: 700; }
    .main-content { margin-left: var(--sidebar-w); flex: 1; padding: 2rem 2.5rem 4rem; max-width: 1100px; }
    .menu-toggle { display: none; position: fixed; top: 1rem; left: 1rem; z-index: 200; background: var(--dark); color: var(--white); border: none; border-radius: 12px; width: 46px; height: 46px; font-size: 1.4rem; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; }
    @media (max-width: 900px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.35s; }
      .sidebar.open { transform: translateX(0); }
      .sidebar.open + .sidebar-overlay { display: block; }
      .main-content { margin-left: 0; padding: 1.25rem; padding-top: 4.5rem; }
      .menu-toggle { display: flex; align-items: center; justify-content: center; }
      h1 { font-size: 1.5rem; } h2 { font-size: 1.2rem; }
    }
    .hero { background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: var(--radius-lg); padding: 2rem 2.25rem; color: var(--white); margin-bottom: 1.5rem; }
    .hero-greeting { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.85; margin-bottom: 0.4rem; font-weight: 600; }
    .hero h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .hero-subtitle { font-size: 0.9rem; opacity: 0.9; margin-bottom: 1.25rem; max-width: 500px; }
    .hero-stats { display: flex; gap: 2rem; flex-wrap: wrap; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.2); }
    .hero-stat .stat-value { font-family: var(--font-head); font-weight: 800; font-size: 1.5rem; line-height: 1; }
    .hero-stat .stat-label { font-size: 0.72rem; opacity: 0.8; margin-top: 0.25rem; text-transform: uppercase; }
    .card { background: var(--white); border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow-sm); border: 1px solid rgba(0,0,0,0.04); margin-bottom: 1.25rem; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
    .card-title { font-size: 1.05rem; font-weight: 700; color: var(--dark); }
    .card-subtitle { font-size: 0.82rem; color: var(--gray); margin-top: 0.2rem; }
