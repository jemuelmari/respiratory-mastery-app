<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0D7377" />
<title>Gradebook — Respiratory Mastery v4.0</title>
<style>
:root{--primary:#0D7377;--primary-dark:#095456;--primary-light:#E0F2F1;--secondary:#1E88E5;--secondary-light:#E3F2FD;--accent:#E53935;--accent-light:#FFEBEE;--success:#43A047;--success-light:#E8F5E9;--warning:#FB8C00;--warning-light:#FFF3E0;--purple:#8E24AA;--purple-light:#F3E5F5;--dark:#1A2027;--dark-2:#2D3748;--light:#F7F9FB;--white:#FFFFFF;--gray:#718096;--gray-light:#E2E8F0;--border:#CBD5E0;--radius:12px;--radius-sm:8px;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow:0 4px 16px rgba(0,0,0,.08);--shadow-lg:0 12px 32px rgba(0,0,0,.12);--font-head:'Inter','Montserrat',sans-serif;--font-body:'Inter','Open Sans',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}

.container{max-width:1500px;margin:0 auto}
.toolbar{background:var(--white);border-radius:var(--radius);padding:1.1rem 1.35rem;box-shadow:var(--shadow-sm);border:1px solid var(--gray-light);margin-bottom:1.25rem;display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;align-items:center}

.toolbar-left h1{font-size:1.15rem;color:var(--dark);line-height:1.2}
.toolbar-left small{display:block;font-size:.75rem;color:var(--gray);font-weight:400;margin-top:.15rem}
.toolbar-right{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.55rem 1rem;border-radius:var(--radius-sm);border:none;cursor:pointer;font-family:var(--font-head);font-weight:600;font-size:.82rem;transition:all .15s;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--primary);color:var(--white)}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn-secondary{background:var(--secondary);color:var(--white)}

.btn-ghost:hover{background:var(--gray-light);color:var(--dark)}
.btn-success{background:var(--success);color:var(--white)}
.btn-sm{padding:.4rem .75rem;font-size:.78rem}

.filter-select{padding:.5rem .7rem;border:1.5px solid var(--gray-light);border-radius:var(--radius-sm);font-size:.82rem;font-family:var(--font-head);font-weight:600;background:#fff;cursor:pointer;color:var(--dark)}
.filter-select:focus{outline:none;border-color:var(--primary)}
.info-banner{background:var(--white);border-radius:var(--radius);padding:1.15rem 1.35rem;box-shadow:var(--shadow-sm);border:1px solid var(--gray-light);border-left:5px solid var(--primary);margin-bottom:1.25rem}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.85rem}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.85rem;margin-bottom:1.25rem}
.stat-pill{background:var(--white);border-radius:var(--radius);padding:1rem 1.15rem;border:1px solid var(--gray-light);box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.stat-pill::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--primary)}

.stat-pill .stat-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.6px;color:var(--gray);font-weight:700;margin-bottom:.3rem}
.stat-pill .stat-value{font-size:1.6rem;font-weight:800;color:var(--dark);font-family:var(--font-head);line-height:1}

.sheet{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:2rem 1.5rem 1.5rem;margin-bottom:1.5rem;overflow-x:auto;border:1px solid var(--gray-light);position:relative}
.sheet-header{text-align:center;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:2px solid var(--primary)}

table.gradebook{width:100%;border-collapse:collapse;font-size:.78rem}
table.gradebook th,table.gradebook td{border:1px solid var(--border);padding:.5rem .4rem;text-align:center;vertical-align:middle}

table.gradebook tbody td.name-cell{text-align:left;font-weight:700;white-space:nowrap;min-width:170px;padding-left:.75rem;font-size:.82rem;color:var(--dark)}

table.gradebook td.num{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}

td.score-fail{background:var(--accent-light);color:#B71C1C}

td.exam-pass{background:#C8E6C9;color:#1B5E20;font-weight:800}

.legend{display:flex;flex-wrap:wrap;gap:1.25rem;font-size:.75rem;margin-top:1.25rem;padding-top:1rem;border-top:1px dashed var(--border);color:var(--gray)}
.legend-item{display:flex;align-items:center;gap:.4rem}
.legend-swatch{width:14px;height:14px;border-radius:4px;border:1px solid var(--border)}
.swatch-pass{background:#C8E6C9}.swatch-warn{background:#FFE0B2}.swatch-fail{background:#FFCDD2}.swatch-empty{background:#FAFBFC}.swatch-exam{background:#E1BEE7}
.signature-block{display:grid;grid-template-columns:1fr 1fr;gap:3rem;margin-top:2.5rem;padding-top:1.5rem;border-top:2px solid var(--primary)}
.signature-line{border-top:1px solid var(--dark);padding-top:.4rem;text-align:center;font-size:.82rem;margin-top:3rem}
.signature-line strong{display:block;font-family:var(--font-head);margin-bottom:.15rem}
.signature-line small{color:var(--gray);font-size:.72rem}
.developer-footer{text-align:center;margin-top:2rem;padding:1.25rem;border-top:1px dashed var(--border);font-size:.75rem;color:var(--gray)}
.developer-footer .dev-label{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:.25rem}
.developer-footer .dev-name{font-family:var(--font-head);font-weight:700;font-size:.9rem;color:var(--primary);margin:.35rem 0}
.empty-state{text-align:center;padding:4rem 1.5rem;color:var(--gray)}
.empty-state .icon{font-size:4rem;margin-bottom:1rem;opacity:.4}
.empty-state h2{color:var(--dark);font-size:1.15rem;margin-bottom:.5rem}
.empty-state p{font-size:.88rem;max-width:400px;margin:0 auto 1.5rem}
.loader{display:flex;align-items:center;justify-content:center;padding:4rem;font-size:1rem;color:var(--gray);flex-direction:column;gap:1rem}
.spinner{width:40px;height:40px;border:4px solid var(--gray-light);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--dark);color:var(--white);padding:.85rem 1.25rem;border-radius:10px;box-shadow:var(--shadow-lg);z-index:999;transform:translateY(200%);transition:transform .3s;max-width:380px;font-size:.85rem;font-weight:500;display:flex;align-items:center;gap:.5rem}
.toast.show{transform:translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--accent)}
.toast.warning{background:var(--warning)}
.modal-overlay{position:fixed;inset:0;background:rgba(26,32,39,.6);display:none;align-items:center;justify-content:center;z-index:1000;padding:1rem;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--white);border-radius:var(--radius);max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:0;box-shadow:var(--shadow-lg)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:1.15rem 1.4rem;border-bottom:1px solid var(--gray-light);position:sticky;top:0;background:var(--white);z-index:3;border-radius:var(--radius) var(--radius) 0 0}
.modal-header h2{font-size:1.05rem;color:var(--dark)}
.modal-close{background:var(--light);border:none;font-size:1.1rem;cursor:pointer;color:var(--gray);line-height:1;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--accent-light);color:var(--accent)}
.modal-body{padding:1.4rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-weight:600;margin-bottom:.3rem;font-size:.8rem;font-family:var(--font-head);color:var(--dark-2)}
.form-group input,.form-group select{width:100%;padding:.6rem .85rem;border:1.5px solid var(--gray-light);border-radius:var(--radius-sm);font-size:.9rem}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,115,119,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.callout{padding:.85rem 1.1rem;border-radius:var(--radius-sm);margin:.85rem 0;border-left:4px solid;font-size:.85rem}
.callout-info{background:var(--secondary-light);border-color:var(--secondary)}
.callout-success{background:var(--success-light);border-color:var(--success)}
.callout-warning{background:var(--warning-light);border-color:var(--warning)}
.callout-danger{background:var(--accent-light);border-color:var(--accent)}
.callout strong{font-family:var(--font-head);font-weight:700}
.hidden{display:none!important}
.flex{display:flex}.items-center{align-items:center}.gap-1{gap:.5rem}.mt-1{margin-top:.5rem}.mt-2{margin-top:1rem}.text-center{text-align:center}.text-gray{color:var(--gray)}
code{background:var(--light);padding:.15rem .4rem;border-radius:4px;font-family:'Courier New',monospace;font-size:.85em;color:var(--primary-dark);font-weight:600}
@media print{@page{size:legal landscape;margin:.5cm}body{background:white;padding:0;font-size:9pt}.toolbar,.no-print,.info-banner,.stats-row,.legend,.developer-footer{display:none!important}.sheet{box-shadow:none;border:none;border-radius:0;padding:0;margin:0;page-break-inside:avoid}.sheet-header{margin-bottom:.5rem;padding-bottom:.5rem}.sheet-header h1{font-size:11pt}.sheet-header h2{font-size:9pt}table.gradebook{font-size:7.5pt}table.gradebook th,table.gradebook td{padding:.2rem .15rem;border-color:#999}table.gradebook thead th{background:#0D7377!important;color:white!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}table.gradebook thead th.sub{background:#095456!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}table.gradebook thead th.exam-header{background:#8E24AA!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}td.score-pass,td.final-pass,td.exam-pass{-webkit-print-color-adjust:exact;print-color-adjust:exact}td.score-warn,td.final-warn{-webkit-print-color-adjust:exact;print-color-adjust:exact}td.score-fail,td.final-fail,td.exam-fail{-webkit-print-color-adjust:exact;print-color-adjust:exact}.signature-block{margin-top:1rem;padding-top:.75rem;page-break-inside:avoid}.signature-line{margin-top:1.5rem}}
@media(max-width:768px){body{padding:.75rem}.toolbar{flex-direction:column;align-items:stretch}.toolbar-left,.toolbar-right{justify-content:center}.signature-block{grid-template-columns:1fr;gap:1.5rem}.sheet{padding:1rem .75rem}}
</style>

<body>

<div class="container" id="app">
  <div class="loader"><div class="spinner"></div><div>Loading gradebook...</div></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Modal</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxaWw4MgJOFrG1TmnmqgMI0ttpKq_U0x-SBop_PDs-AwcY7ehBreUW7sDaCcfMEFpQq/exec';
var SCHOOL_YEARS = ['2025-2026','2026-2027','2027-2028','2028-2029','2029-2030','2030-2031','2031-2032','2032-2033'];
var SEMESTERS = ['1st Semester', '2nd Semester'];
var CURRENT_SY = '2026-2027';
var CURRENT_SEM = '1st Semester';

var GB = {
  localKey: 'respMastery_instructor_v2',
  state: {
    students: [],
    settings: {
      courseName: 'NCM 101B Lab — Respiratory Assessment',
      instructorName: 'JEMUEL C. MARI, MAN, RN, LPT',
      passingScore: 75,
      masteryThreshold: 90,
      examPassingScore: 15,
      unitsCompletedWeight: 20,
      unitQuizWeight: 40,
      gamesWeight: 20,
      capstoneWeight: 20
    },
    filters: { schoolYear: CURRENT_SY, semester: CURRENT_SEM },
    lastSync: null
  }
};

var UNIT_KEYS = ['unit1','unit2','unit3','unit4','unit5','unit6','unit7'];
var UNIT_NAMES = { unit1: 'U1 Baseline', unit2: 'U2 Inspection', unit3: 'U3 Palpation', unit4: 'U4 Percussion', unit5: 'U5 Auscultation', unit6: 'U6 Diseases', unit7: 'U7 Interventions' };
var GAME_KEYS = ['blitz','tree','sound','redflag','matrix'];
var GAME_NAMES = { blitz: 'Blitz', tree: 'Tree', sound: 'Sound', redflag: 'Red Flag', matrix: 'Matrix' };

function showLoading(msg) { document.getElementById('app').innerHTML = '<div class="loader"><div class="spinner"></div><div>' + (msg || 'Loading...') + '</div></div>'; }
function showError(msg) { document.getElementById('app').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><h2>Could not load gradebook</h2><p>' + msg + '</p><button class="btn btn-primary" onclick="init()">🔄 Retry</button></div>'; }
function toast(msg, type) { type = type || ''; var el = document.getElementById('toast'); el.textContent = msg; el.className = 'toast show ' + type; clearTimeout(el._t); el._t = setTimeout(function() { el.classList.remove('show'); }, 3000); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }

async function fetchAllStudents() {
  var res = await fetch(BACKEND_URL + '?action=listAllMaster');
  return await res.json();
}

async function syncFromBackend() {
  showLoading('Syncing from Google Sheets (StudentMaster)...');
  try {
    var result = await fetchAllStudents();
    if (!result.success) throw new Error(result.error || 'Sync failed');
    GB.state.students = result.records || [];
    GB.state.lastSync = new Date().toISOString();
    localStorage.setItem(GB.localKey, JSON.stringify(GB.state));
    render();
    toast('✅ Sync complete — ' + GB.state.students.length + ' students loaded.', 'success');
  } catch (err) {
    console.error(err);
    showError(err.message);
  }
}

function getUnitBestScore(s, unit) {
  var val = s[unit] || s['u' + unit.replace('unit','')] || null;
  if (val === '' || val === null || val === undefined) return null;
  return parseFloat(val) || 0;
}
function getGameBestScore(s, game) {
  var val = s[game] || null;
  if (val === '' || val === null || val === undefined) return null;
  return parseFloat(val) || 0;
}
function getUnitAvg(s) { return parseFloat(s.unitAvg) || 0; }
function getGamesAvg(s) {
  var scores = GAME_KEYS.map(function(g) { return getGameBestScore(s, g); }).filter(function(x) { return x !== null; });
  if (!scores.length) return null;
  return Math.round(scores.reduce(function(a, b) { return a + b; }, 0) / scores.length);
}
function getExamScore(s) { return s.examPercentage !== null && s.examPercentage !== '' ? parseInt(s.examPercentage) : null; }
function getExamRaw(s) { return s.examScore !== null && s.examScore !== '' ? { score: parseInt(s.examScore), total: parseInt(s.examTotal) || 30 } : null; }
function getCompletionPercent(s) { return parseFloat(s.unitsCompleted) || 0; }
function isExamPassed(s) { return s.examPassed === 'PASSED' || s.examPassed === true; }
function hasExam(s) { return s.examTakenAt || (s.examPercentage !== null && s.examPercentage !== ''); }

function computeWeightedFinal(s, settings) {
  var unitAvg = parseFloat(s.unitAvg) || 0;
  if (unitAvg <= 1 && unitAvg > 0) unitAvg = Math.round(unitAvg * 100);
  
  var completion = parseFloat(s.unitsCompleted) || 0;
  if (completion <= 1 && completion > 0) completion = Math.round(completion * 100);
  
  var exam = null;
  if (s.examScore !== null && s.examScore !== '' && s.examScore !== undefined) {
    var sc = parseFloat(s.examScore) || 0;
    var tot = parseFloat(s.examTotal) || 30;
    if (tot > 0) exam = Math.round((sc / tot) * 100);
  }
  
  var gameAvg = null;
  var gameScores = [];
  ['blitz','tree','sound','redFlag','matrix'].forEach(function(g) {
    var v = parseFloat(s[g]);
    if (!isNaN(v) && s[g] !== '' && s[g] !== null) {
      gameScores.push(v <= 1 && v > 0 ? Math.round(v * 100) : Math.round(v));
    }
  });
  if (gameScores.length) {
    gameAvg = Math.round(gameScores.reduce(function(a,b){return a+b;},0) / gameScores.length);
  }
  
  if (unitAvg === 0 && gameAvg === null && exam === null && completion === 0) return null;
  
  var total = 0, weightSum = 0;
  if (completion > 0) { total += completion * (settings.unitsCompletedWeight / 100); weightSum += settings.unitsCompletedWeight; }
  if (unitAvg > 0) { total += unitAvg * (settings.unitQuizWeight / 100); weightSum += settings.unitQuizWeight; }
  if (gameAvg !== null) { total += gameAvg * (settings.gamesWeight / 100); weightSum += settings.gamesWeight; }
  if (exam !== null) { total += exam * (settings.capstoneWeight / 100); weightSum += settings.capstoneWeight; }
  
  if (weightSum === 0) return null;
  return Math.round((total / weightSum) * 100);
}

var TRANSMUTATION = [{ min: 97, max: 100, grade: 1.00 },{ min: 94, max: 96, grade: 1.25 },{ min: 91, max: 93, grade: 1.50 },{ min: 88, max: 90, grade: 1.75 },{ min: 85, max: 87, grade: 2.00 },{ min: 82, max: 84, grade: 2.25 },{ min: 79, max: 81, grade: 2.50 },{ min: 76, max: 78, grade: 2.75 },{ min: 75, max: 75, grade: 3.00 },{ min: 0, max: 74, grade: 5.00 }];
function transmute(p) { if (p === null || p === undefined) return null; var row = TRANSMUTATION.find(function(r) { return p >= r.min && p <= r.max; }); return row ? row.grade : 5.00; }
function formatGrade(g) { return (g === null || g === undefined) ? '—' : g.toFixed(2); }
function getRemarks(g) { if (g === null || g === undefined) return '—'; if (g === 1.00) return 'Excellent'; if (g <= 1.50) return 'Very Good'; if (g <= 2.00) return 'Good'; if (g <= 2.50) return 'Satisfactory'; if (g <= 3.00) return 'Passed'; return 'Failed'; }
function getRemarksClass(g) { return (g === null || g === undefined) ? '' : (g <= 3.00 ? 'remarks-pass' : 'remarks-fail'); }
function scoreClass(val, passThreshold) { passThreshold = passThreshold || 90; if (val === null || val === undefined) return 'score-empty'; if (val >= passThreshold) return 'score-pass'; if (val >= 75) return 'score-warn'; return 'score-fail'; }
function finalGradeClass(g) { if (g === null || g === undefined) return ''; if (g <= 2.00) return 'final-pass'; if (g <= 3.00) return 'final-warn'; return 'final-fail'; }
function cell(val) { return (val === null || val === undefined) ? '<span style="color:#B0BEC5;">—</span>' : val; }

function filterStudents(students, f) {
  return students.filter(function(s) {
    var sy = String(s.schoolYear || '').trim();
    var sem = String(s.semester || '').trim();
    if (f.schoolYear && sy && sy !== '—' && sy !== f.schoolYear) return false;
    if (f.semester && sem && sem !== '—' && sem !== f.semester) return false;
    return true;
  });
}
function onFilterChange() { GB.state.filters.schoolYear = document.getElementById('filterSY').value; GB.state.filters.semester = document.getElementById('filterSem').value; localStorage.setItem(GB.localKey, JSON.stringify(GB.state)); render(); }
function infoItem(label, value) { return '<div class="info-item"><div class="info-label">' + label + '</div><div class="info-value">' + value + '</div></div>'; }

function render() {
  var app = document.getElementById('app');
  var allStudents = GB.state.students;
  var students = filterStudents(allStudents, GB.state.filters);

  if (!students.length) {
    app.innerHTML = renderToolbar() + '<div class="empty-state"><div class="icon">📋</div><h2>No students for ' + GB.state.filters.schoolYear + ' — ' + GB.state.filters.semester + '</h2><p>Try another School Year / Semester, or click "Sync from Sheet".</p><button class="btn btn-primary" onclick="syncFromBackend()">🔄 Sync from Sheet</button></div>' + renderDeveloperFooter();
    return;
  }

  app.innerHTML = renderToolbar() +
    '<div class="info-banner no-print"><div class="info-grid">' +
    infoItem('Course', GB.state.settings.courseName) + infoItem('Instructor', GB.state.settings.instructorName) +
    infoItem('School Year', GB.state.filters.schoolYear) + infoItem('Semester', GB.state.filters.semester) +
    infoItem('Students in View', students.length) + infoItem('Generated', new Date().toLocaleDateString()) + '</div></div>' +
    '<div class="sheet" id="sheet"><div class="sheet-header"><h1>' + GB.state.settings.courseName + '</h1><h2>Class Record — Respiratory Assessment Mastery</h2><p>School Year ' + GB.state.filters.schoolYear + ' &nbsp;|&nbsp; ' + GB.state.filters.semester + ' &nbsp;|&nbsp; Instructor: ' + GB.state.settings.instructorName + '</p><p>' + new Date().toLocaleDateString() + '</p><span class="version-tag">App Version 4.0</span></div>' +
    renderTable(students) + renderLegend() + renderSignatureBlock() + '</div>' +
    renderStatsSummary(students) + renderDeveloperFooter();
}

function renderToolbar() {
  var lastSync = GB.state.lastSync;
  var curSY = GB.state.filters.schoolYear;
  var curSem = GB.state.filters.semester;
  return '<div class="toolbar no-print"><div class="toolbar-left"><div class="logo">📊</div><div><h1>Class Record — Gradebook</h1><small>' + GB.state.settings.courseName + ' — v4.0</small></div></div><div class="toolbar-right">' +
    '<select id="filterSY" onchange="onFilterChange()" class="filter-select">' + SCHOOL_YEARS.map(function(sy) { return '<option value="' + sy + '"' + (sy === curSY ? ' selected' : '') + '>' + sy + '</option>'; }).join('') + '</select>' +
    '<select id="filterSem" onchange="onFilterChange()" class="filter-select">' + SEMESTERS.map(function(sm) { return '<option value="' + sm + '"' + (sm === curSem ? ' selected' : '') + '>' + sm + '</option>'; }).join('') + '</select>' +
    '<button class="btn btn-outline btn-sm" onclick="window.location.href=\'instructor-dashboard.html\'">👨‍🏫 Dashboard</button>' +
    '<button class="btn btn-outline btn-sm" onclick="syncFromBackend()">🔄 Sync' + (lastSync ? ' (' + new Date(lastSync).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) + ')' : '') + '</button>' +
    '<button class="btn btn-primary btn-sm" onclick="window.print()">🖨️ Print</button></div></div>';
}

function renderTable(students) {
  var html = '<table class="gradebook"><thead><tr>';
  html += '<th rowspan="2" style="min-width:170px;">STUDENT NAME</th>';
  html += '<th rowspan="2" style="min-width:95px;">STUDENT NO.</th>';
  html += '<th rowspan="2" style="min-width:60px;">SECTION</th>';
  html += '<th rowspan="2" style="min-width:60px;">GROUP</th>';
  html += '<th rowspan="2" style="min-width:80px;">SCHOOL YEAR</th>';
  html += '<th rowspan="2" style="min-width:90px;">SEMESTER</th>';
  html += '<th colspan="' + UNIT_KEYS.length + '">UNIT QUIZ SCORES (Best)</th>';
  html += '<th rowspan="2" style="min-width:55px;">UNIT<br>AVG</th>';
  html += '<th colspan="' + GAME_KEYS.length + '">MASTERY GAMES</th>';
  html += '<th rowspan="2" style="min-width:55px;">GAMES<br>AVG</th>';
  html += '<th colspan="2" class="exam-header">CAPSTONE EXAM</th>';
  html += '<th rowspan="2" style="min-width:60px;">UNITS<br>COMPL.</th>';
  html += '<th rowspan="2" style="min-width:60px;">RAW<br>%</th>';
  html += '<th rowspan="2" style="min-width:60px;">FINAL<br>GRADE</th>';
  html += '<th rowspan="2" style="min-width:95px;">REMARKS</th>';
  html += '<th rowspan="2" style="min-width:120px;">VALIDATION</th>';
  html += '</tr><tr>';
  UNIT_KEYS.forEach(function(u) { html += '<th class="sub" style="min-width:50px;">' + UNIT_NAMES[u] + '</th>'; });
  GAME_KEYS.forEach(function(g) { html += '<th class="sub" style="min-width:50px;">' + GAME_NAMES[g] + '</th>'; });
  html += '<th class="sub exam-header" style="min-width:55px;">SCORE</th>';
  html += '<th class="sub exam-header" style="min-width:70px;">RESULT</th>';
  html += '</tr></thead><tbody>';
  students.forEach(function(s) { html += renderStudentRow(s); });
  html += renderClassAverageRow(students);
  html += '</tbody></table>';
  return html;
}

function renderStudentRow(s) {
  var w = GB.state.settings;
  
  var studentName = s.fullName || s.name || 'Unknown Student';
  
  var unitScores = UNIT_KEYS.map(function(u) { 
    var val = s[u] || s['u' + u.replace('unit','')] || null;
    if (val === '' || val === null || val === undefined) return null;
    var num = parseFloat(val);
    return (num <= 1 && num > 0) ? Math.round(num * 100) : Math.round(num);
  });
  
  var gameScores = GAME_KEYS.map(function(g) { 
    var val = s[g] || null;
    if (val === '' || val === null || val === undefined) return null;
    var num = parseFloat(val);
    return (num <= 1 && num > 0) ? Math.round(num * 100) : Math.round(num);
  });
  
  var unitAvg = 0;
  var validUnits = unitScores.filter(function(x) { return x !== null; });
  if (validUnits.length) {
    unitAvg = Math.round(validUnits.reduce(function(a, b) { return a + b; }, 0) / validUnits.length);
  } else if (s.unitAvg) {
    var rawAvg = parseFloat(s.unitAvg);
    unitAvg = (rawAvg <= 1 && rawAvg > 0) ? Math.round(rawAvg * 100) : Math.round(rawAvg);
  }
  
  var gameAvg = null;
  var validGames = gameScores.filter(function(x) { return x !== null; });
  if (validGames.length) {
    gameAvg = Math.round(validGames.reduce(function(a, b) { return a + b; }, 0) / validGames.length);
  }
  
  var examTaken = s.examTakenAt || (s.examScore !== null && s.examScore !== '' && s.examScore !== undefined);
  var examPass = s.examPassed === 'PASSED';
  var examPct = null;
  var examRaw = null;
  
  if (examTaken) {
    var sc = parseFloat(s.examScore) || 0;
    var tot = parseFloat(s.examTotal) || 30;
    examRaw = { score: sc, total: tot };
    examPct = tot > 0 ? Math.round((sc / tot) * 100) : 0;
  }
  
  var completion = parseFloat(s.unitsCompleted) || 0;
  if (completion <= 1 && completion > 0) completion = Math.round(completion * 100);
  
  var rawFinal = null;
  if (unitAvg > 0 || examPct !== null || completion > 0) {
    var totalScore = 0;
    var totalWeight = 0;
    if (completion > 0) { totalScore += completion * 0.20; totalWeight += 0.20; }
    if (unitAvg > 0) { totalScore += unitAvg * 0.40; totalWeight += 0.40; }
    if (gameAvg !== null) { totalScore += gameAvg * 0.20; totalWeight += 0.20; }
    if (examPct !== null) { totalScore += examPct * 0.20; totalWeight += 0.20; }
    if (totalWeight > 0) rawFinal = Math.round(totalScore / totalWeight);
  }
  
  var transmuted = transmute(rawFinal);
  var remarks = getRemarks(transmuted);

  var html = '<tr>';
  html += '<td class="name-cell">' + studentName + '</td>';
  html += '<td class="no-cell">' + (s.studentNo || '—') + '</td>';
  html += '<td class="group-cell">' + (s.section || '—') + '</td>';
  html += '<td class="group-cell">' + (s.group || '—') + '</td>';
  html += '<td class="group-cell">' + (s.schoolYear || '—') + '</td>';
  html += '<td class="group-cell">' + (s.semester || '—') + '</td>';
  
  unitScores.forEach(function(v) { html += '<td class="num ' + scoreClass(v, w.masteryThreshold) + '">' + cell(v) + '</td>'; });
  html += '<td class="num final ' + scoreClass(unitAvg, w.masteryThreshold) + '">' + (unitAvg > 0 ? unitAvg : '—') + '</td>';
  
  gameScores.forEach(function(v) { html += '<td class="num ' + scoreClass(v, 90) + '">' + cell(v) + '</td>'; });
  html += '<td class="num final ' + scoreClass(gameAvg, 90) + '">' + (gameAvg !== null ? gameAvg : '—') + '</td>';
  
  if (examTaken && examRaw) {
    html += '<td class="num ' + scoreClass(examPct, 50) + '">' + examRaw.score + '/' + examRaw.total + '<br><small>' + examPct + '%</small></td>';
    html += '<td class="num ' + (examPass ? 'exam-pass' : 'exam-fail') + '">' + (examPass ? '✅ PASS' : '❌ FAIL') + '</td>';
  } else {
    html += '<td class="num score-empty">—</td><td class="num score-empty">Not taken</td>';
  }
  
  html += '<td class="num">' + (completion > 0 ? completion + '%' : '—') + '</td>';
  html += '<td class="num final">' + (rawFinal !== null ? rawFinal : '—') + '</td>';
  html += '<td class="num final ' + finalGradeClass(transmuted) + '">' + formatGrade(transmuted) + '</td>';
  html += '<td class="remarks ' + getRemarksClass(transmuted) + '">' + remarks + '</td>';
  html += '<td style="text-align:left;font-size:0.72rem;color:var(--success);">✅ OK</td>';
  html += '</tr>';
  return html;
}

function renderClassAverageRow(students) {
  var w = GB.state.settings;
  var n = students.length;
  if (!n) return '';
  var avg = function(vals) { var nums = vals.filter(function(v) { return v !== null && v !== undefined; }); if (!nums.length) return null; return Math.round(nums.reduce(function(a, b) { return a + b; }, 0) / nums.length); };
  var unitAvgs = UNIT_KEYS.map(function(u) { return avg(students.map(function(s) { return getUnitBestScore(s, u); })); });
  var gameAvgs = GAME_KEYS.map(function(g) { return avg(students.map(function(s) { return getGameBestScore(s, g); })); });
  var unitAvgOfAvgs = avg(unitAvgs);
  var gameAvgOfAvgs = avg(gameAvgs);
  var examAvg = avg(students.map(function(s) { return getExamScore(s); }));
  var completionAvg = avg(students.map(function(s) { return getCompletionPercent(s); }));
  var rawAvg = avg(students.map(function(s) { return computeWeightedFinal(s, w); }));
  var transmutedAvg = avg(students.map(function(s) { return transmute(computeWeightedFinal(s, w)); }));
  var examPassCount = students.filter(function(s) { return isExamPassed(s); }).length;
  var examTakenCount = students.filter(function(s) { return hasExam(s); }).length;

  var html = '<tr style="background:#E0F2F1;font-weight:800;border-top:2px solid var(--primary);">';
  html += '<td class="name-cell" colspan="6" style="text-align:right;padding-right:.75rem;font-size:.8rem;">CLASS AVERAGE →</td>';
  unitAvgs.forEach(function(v) { html += '<td class="num">' + (v !== null ? v : '—') + '</td>'; });
  html += '<td class="num final">' + (unitAvgOfAvgs !== null ? unitAvgOfAvgs : '—') + '</td>';
  gameAvgs.forEach(function(v) { html += '<td class="num">' + (v !== null ? v : '—') + '</td>'; });
  html += '<td class="num final">' + (gameAvgOfAvgs !== null ? gameAvgOfAvgs : '—') + '</td>';
  html += '<td class="num">' + (examAvg !== null ? examAvg + '%' : '—') + '<br><small>' + examPassCount + '/' + examTakenCount + '</small></td>';
  html += '<td class="num">' + (examTakenCount ? Math.round((examPassCount / examTakenCount) * 100) + '%' : '—') + '</td>';
  html += '<td class="num">' + (completionAvg !== null ? completionAvg + '%' : '—') + '</td>';
  html += '<td class="num final">' + (rawAvg !== null ? rawAvg : '—') + '</td>';
  html += '<td class="num final">' + (transmutedAvg !== null ? formatGrade(transmutedAvg) : '—') + '</td>';
  html += '<td class="remarks"></td><td></td>';
  html += '</tr>';
  return html;
}

function renderLegend() {
  var w = GB.state.settings;
  return '<div class="legend">' +
    '<div class="legend-item"><span class="legend-swatch swatch-pass"></span> ≥' + w.masteryThreshold + '% — Mastered</div>' +
    '<div class="legend-item"><span class="legend-swatch swatch-warn"></span> 75–' + (w.masteryThreshold - 1) + '% — Passing</div>' +
    '<div class="legend-item"><span class="legend-swatch swatch-fail"></span> &lt;75% — Failing</div>' +
    '<div class="legend-item"><span class="legend-swatch swatch-empty"></span> No data</div>' +
    '<div class="legend-item"><span class="legend-swatch swatch-exam"></span> Capstone Exam (15/30 passing)</div>' +
    '<div class="legend-item" style="margin-left:auto;"><strong>Transmutation:</strong> 97+ → 1.00 | 94 → 1.25 | 91 → 1.50 | 88 → 1.75 | 85 → 2.00 | 82 → 2.25 | 79 → 2.50 | 76 → 2.75 | 75 → 3.00 | &lt;75 → 5.00</div>' +
    '</div>';
}

function renderSignatureBlock() {
  var s = GB.state.settings;
  return '<div class="signature-block"><div><div class="signature-line"><strong>' + s.instructorName + '</strong><small>Instructor</small></div></div><div><div class="signature-line"><strong>_____________________________</strong><small>Program Chair / Dean</small></div></div></div>';
}

function renderStatsSummary(students) {
  var w = GB.state.settings;
  var n = students.length;
  var finals = students.map(function(s) { return transmute(computeWeightedFinal(s, w)); }).filter(function(x) { return x !== null; });
  var passed = finals.filter(function(g) { return g <= 3.00; }).length;
  var failed = finals.filter(function(g) { return g > 3.00; }).length;
  var mastered = students.filter(function(s) { var raw = computeWeightedFinal(s, w); return raw !== null && raw >= w.masteryThreshold; }).length;
  var avgFinal = finals.length ? (finals.reduce(function(a, b) { return a + b; }, 0) / finals.length) : null;
  var highest = finals.length ? Math.min.apply(null, finals) : null;
  var lowest = finals.length ? Math.max.apply(null, finals) : null;
  var passRate = finals.length ? Math.round((passed / finals.length) * 100) : 0;

  return '<div class="stats-row no-print">' +
    statPill('Students', n, '', 'Enrolled') +
    statPill('Passed', passed, 'success', passRate + '% pass rate') +
    statPill('Failed', failed, 'alert', (100 - passRate) + '% fail rate') +
    statPill('Mastered', mastered, 'purple', '≥' + w.masteryThreshold + '% final') +
    statPill('Class Avg', avgFinal !== null ? formatGrade(avgFinal) : '—', '', 'Transmuted') +
    statPill('Highest', highest !== null ? formatGrade(highest) : '—', 'success', 'Best grade') +
    statPill('Lowest', lowest !== null ? formatGrade(lowest) : '—', 'alert', 'Needs help') +
    '</div>';
}

function statPill(label, value, colorClass, sub) {
  return '<div class="stat-pill ' + (colorClass || '') + '"><div class="stat-label">' + label + '</div><div class="stat-value">' + value + '</div>' + (sub ? '<div class="stat-sub">' + sub + '</div>' : '') + '</div>';
}

function renderDeveloperFooter() {
  return '<div class="developer-footer no-print"><div class="dev-label">Class Record System Developed by</div><div class="dev-name">JEMUEL C. MARI, MAN, RN, LPT</div><div>Clinical Instructor | Teacher II — Department of Education</div><div><strong>Tarlac State University</strong> — College of Science — Nursing Department</div><div style="margin-top:.5rem;font-size:.7rem;">Version 4.0 — © ' + new Date().getFullYear() + '</div></div>';
}

function init() {
  var raw = localStorage.getItem(GB.localKey);
  if (raw) {
    try {
      var parsed = JSON.parse(raw);
      GB.state.students = parsed.students || [];
      GB.state.settings = Object.assign({}, GB.state.settings, parsed.settings || {});
      if (parsed.filters) GB.state.filters = parsed.filters;
      GB.state.lastSync = parsed.lastSync || null;
    } catch (e) { console.warn('Local load failed', e); }
  }
  
  if (!GB.state.students.length) {
    syncFromBackend();
  } else {
    render();
  }
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
