<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0D7377" />
  <meta name="description" content="Instructor Dashboard v1.6 — Respiratory Assessment Mastery. Developed by JEMUEL C. MARI, MAN, RN, LPT." />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Instructor Dashboard — Respiratory Mastery v1.6</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    :root {
      --primary: #0D7377; --primary-dark: #095456; --secondary: #1E88E5;
      --accent: #E53935; --success: #43A047; --warning: #FB8C00;
      --dark: #263238; --light: #ECEFF1; --white: #FFFFFF; --gray: #607D8B;
      --radius: 12px;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
      --font-head: 'Montserrat', -apple-system, sans-serif;
      --font-body: 'Open Sans', -apple-system, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background: var(--light); color: var(--dark); line-height: 1.6; }
    h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 700; line-height: 1.3; }
    h1 { font-size: 1.8rem; }
    h2 { font-size: 1.4rem; color: var(--primary); margin-bottom: 0.5rem; }
    h3 { font-size: 1.15rem; color: var(--secondary); margin: 1rem 0 0.5rem; }
    p { margin-bottom: 0.75rem; }
    a { color: var(--secondary); text-decoration: none; }
    .app-container { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px; background: var(--primary); color: var(--white);
      padding: 1.5rem 1rem; position: fixed; top: 0; left: 0; bottom: 0;
      overflow-y: auto; z-index: 100; transition: transform 0.3s;
      display: flex; flex-direction: column;
    }
    .sidebar-header {
      display: flex; align-items: center; gap: 0.75rem;
      padding-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.2);
      margin-bottom: 1rem;
    }
    .sidebar-header .logo { font-size: 2rem; }
    .sidebar-header h1 { font-size: 1rem; color: var(--white); }
    .sidebar-header small { display: block; font-size: 0.7rem; opacity: 0.8; font-weight: 400; }
    .nav-section { margin-bottom: 1.25rem; }
    .nav-section-title {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;
      opacity: 0.7; margin-bottom: 0.5rem; padding-left: 0.5rem;
    }
    .nav-item {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.6rem 0.75rem; border-radius: 8px;
      color: rgba(255,255,255,0.9); cursor: pointer;
      font-size: 0.9rem; transition: background 0.2s;
      border: none; background: none; width: 100%; text-align: left;
      font-family: var(--font-body);
    }
    .nav-item:hover { background: rgba(255,255,255,0.1); }
    .nav-item.active { background: rgba(255,255,255,0.2); font-weight: 600; }
    .nav-item .icon { font-size: 1.1rem; width: 1.5rem; text-align: center; }
    .sidebar-footer {
      margin-top: auto; padding: 1rem 0.5rem;
      border-top: 1px solid rgba(255,255,255,0.2);
      font-size: 0.72rem; line-height: 1.5; color: rgba(255,255,255,0.9);
    }
    .sidebar-footer .dev-label {
      font-size: 0.62rem; text-transform: uppercase; letter-spacing: 1px;
      opacity: 0.7; margin-bottom: 0.3rem;
    }
    .sidebar-footer .dev-name { font-weight: 700; color: #FFFFFF; font-size: 0.78rem; }
    .sidebar-footer .app-version {
      margin-top: 0.5rem; padding-top: 0.5rem;
      border-top: 1px dashed rgba(255,255,255,0.2);
      font-size: 0.68rem; opacity: 0.8;
    }
    .main-content { margin-left: 260px; flex: 1; padding: 2rem; max-width: 1400px; }
    .menu-toggle {
      display: none; position: fixed; top: 1rem; left: 1rem; z-index: 200;
      background: var(--primary); color: var(--white);
      border: none; border-radius: 50%; width: 48px; height: 48px;
      font-size: 1.5rem; cursor: pointer; box-shadow: var(--shadow-lg);
    }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; padding: 1rem; padding-top: 4rem; }
      .menu-toggle { display: flex; align-items: center; justify-content: center; }
    }
    .card {
      background: var(--white); border-radius: var(--radius);
      padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1.5rem;
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.65rem 1.25rem; border-radius: 8px; border: none;
      cursor: pointer; font-family: var(--font-head); font-weight: 600;
      font-size: 0.9rem; transition: all 0.2s; text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: var(--white); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--secondary); color: var(--white); }
    .btn-accent { background: var(--accent); color: var(--white); }
    .btn-success { background: var(--success); color: var(--white); }
    .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
    .btn-outline:hover { background: var(--primary); color: var(--white); }
    .btn-danger { background: var(--accent); color: var(--white); }
    .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.8rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .dashboard-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem; margin: 1rem 0;
    }
    .stat-card {
      background: var(--white); border-radius: var(--radius);
      padding: 1.25rem; box-shadow: var(--shadow); text-align: center;
    }
    .stat-card .stat-value { font-size: 2rem; font-weight: 700; color: var(--primary); }
    .stat-card .stat-label { font-size: 0.8rem; color: var(--gray); }
    .stat-card.alert .stat-value { color: var(--accent); }
    .stat-card.success .stat-value { color: var(--success); }
    .stat-card.warning .stat-value { color: var(--warning); }
    .table-wrap { overflow-x: auto; margin: 1rem 0; }
    table {
      width: 100%; border-collapse: collapse; font-size: 0.88rem;
      background: var(--white); border-radius: 8px; overflow: hidden;
    }
    th {
      background: var(--primary); color: var(--white);
      padding: 0.75rem; text-align: left; font-family: var(--font-head);
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px;
    }
    td { padding: 0.65rem 0.75rem; border-bottom: 1px solid #E0E0E0; vertical-align: middle; }
    tr:nth-child(even) { background: #F5F7F8; }
    tr:hover { background: #E0F2F1; }
    tr.alert-row { background: #FFEBEE !important; }
    .pill {
      display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600; font-family: var(--font-head);
    }
    .pill-success { background: #E8F5E9; color: #2E7D32; }
    .pill-warning { background: #FFF3E0; color: #E65100; }
    .pill-danger { background: #FFEBEE; color: #C62828; }
    .pill-info { background: #E3F2FD; color: #1565C0; }
    .pill-gray { background: #ECEFF1; color: #455A64; }
    .pill-purple { background: #F3E5F5; color: #6A1B9A; }
    .progress-bar {
      height: 10px; background: #CFD8DC; border-radius: 5px;
      overflow: hidden; min-width: 80px;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--success), var(--primary));
      border-radius: 5px; transition: width 0.5s;
    }
    .progress-fill.warn { background: linear-gradient(90deg, var(--warning), var(--accent)); }
    .progress-fill.danger { background: var(--accent); }
    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block; font-weight: 600; margin-bottom: 0.35rem;
      font-size: 0.9rem; font-family: var(--font-head);
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 0.65rem 0.85rem; border: 2px solid #CFD8DC;
      border-radius: 8px; font-family: var(--font-body); font-size: 0.9rem;
      transition: border-color 0.2s; background: var(--white); color: var(--dark);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none; border-color: var(--secondary);
    }
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: none; align-items: center; justify-content: center;
      z-index: 1000; padding: 1rem;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--white); border-radius: var(--radius);
      max-width: 780px; width: 100%; max-height: 90vh; overflow-y: auto;
      padding: 1.5rem; box-shadow: var(--shadow-lg);
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid #E0E0E0;
    }
    .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--gray); line-height: 1; }
    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: var(--dark); color: var(--white);
      padding: 0.85rem 1.25rem; border-radius: 8px;
      box-shadow: var(--shadow-lg); z-index: 999;
      transform: translateY(200%); transition: transform 0.3s;
      max-width: 340px; font-size: 0.9rem;
    }
    .toast.show { transform: translateY(0); }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--accent); }
    .toast.warning { background: var(--warning); }
    .callout {
      padding: 1rem 1.25rem; border-radius: 8px; margin: 1rem 0;
      border-left: 4px solid;
    }
    .callout-warning { background: #FFF3E0; border-color: var(--warning); }
    .callout-danger { background: #FFEBEE; border-color: var(--accent); }
    .callout-success { background: #E8F5E9; border-color: var(--success); }
    .callout-info { background: #E3F2FD; border-color: var(--secondary); }
    .callout strong { font-family: var(--font-head); }
    .search-box { position: relative; margin-bottom: 1rem; }
    .search-box input { padding-left: 2.5rem; }
    .search-box::before {
      content: '🔍'; position: absolute; left: 0.85rem; top: 50%;
      transform: translateY(-50%); font-size: 1rem; opacity: 0.5;
    }
    .bar-chart { display: flex; align-items: flex-end; gap: 0.5rem; height: 180px; padding: 1rem 0; }
    .bar-chart .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .bar-chart .bar {
      width: 100%; max-width: 60px; background: linear-gradient(180deg, var(--primary), var(--secondary));
      border-radius: 6px 6px 0 0; transition: height 0.5s;
    }
    .bar-chart .bar-label { font-size: 0.7rem; margin-top: 0.4rem; text-align: center; color: var(--gray); }
    .bar-chart .bar-value { font-size: 0.75rem; font-weight: 700; color: var(--primary); margin-bottom: 0.25rem; }
    .developer-card {
      background: linear-gradient(135deg, #E0F2F1, #E3F2FD);
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: 1.5rem; text-align: center; margin-bottom: 1.5rem;
    }
    .developer-card .dev-label {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--gray); font-weight: 600; margin-bottom: 0.5rem;
    }
    .developer-card .dev-name {
      font-family: var(--font-head); font-weight: 700; font-size: 1.15rem;
      color: var(--primary); margin-bottom: 0.5rem;
    }
    .developer-card .dev-info { font-size: 0.85rem; color: var(--dark); line-height: 1.7; }
    .drop-zone {
      border: 3px dashed var(--primary);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      background: #F5F7F8;
      transition: all 0.2s;
      cursor: pointer;
      margin: 1rem 0;
    }
    .drop-zone:hover, .drop-zone.dragover { background: #E0F2F1; border-color: var(--secondary); }
    .drop-zone .drop-icon { font-size: 3rem; margin-bottom: 0.5rem; }
    .drop-zone .drop-title {
      font-family: var(--font-head); font-weight: 600;
      font-size: 1rem; color: var(--primary); margin-bottom: 0.25rem;
    }
    .drop-zone .drop-hint { font-size: 0.85rem; color: var(--gray); }
    .tabs {
      display: flex; gap: 0.25rem; margin-bottom: 1rem;
      border-bottom: 2px solid #E0E0E0; flex-wrap: wrap;
    }
    .tab {
      padding: 0.65rem 1.15rem; border: none; background: none;
      cursor: pointer; font-family: var(--font-head); font-weight: 600;
      font-size: 0.88rem; color: var(--gray);
      border-bottom: 3px solid transparent; margin-bottom: -2px;
      transition: all 0.2s;
    }
    .tab:hover { color: var(--primary); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .mb-1 { margin-bottom: 0.5rem; }
    .mb-2 { margin-bottom: 1rem; }
    .flex { display: flex; }
    .flex-wrap { flex-wrap: wrap; }
    .gap-1 { gap: 0.5rem; }
    .gap-2 { gap: 1rem; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    code { background: var(--light); padding: 0.15rem 0.4rem; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 0.85em; }
    .paste-area {
      width: 100%; min-height: 180px; padding: 0.85rem;
      border: 2px solid #CFD8DC; border-radius: 8px;
      font-family: 'Courier New', monospace; font-size: 0.72rem;
      resize: vertical;
    }
    .paste-area:focus { outline: none; border-color: var(--secondary); }
    .preview-box {
      background: #E8F5E9; border: 2px solid var(--success);
      border-radius: 8px; padding: 1rem; margin-top: 1rem;
    }
    .preview-box .preview-title {
      font-family: var(--font-head); font-weight: 700;
      color: var(--success); margin-bottom: 0.5rem;
    }
    .preview-box table { background: transparent; }
    .preview-box td { border: none; padding: 0.25rem 0.5rem; }
    .qr-scanner-container {
      position: relative; width: 100%; max-width: 480px; margin: 1rem auto;
      background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 1;
    }
    #qrVideo { width: 100%; height: 100%; object-fit: cover; display: block; }
    .qr-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .qr-frame {
      width: 70%; height: 70%; max-width: 320px; max-height: 320px;
      border: 3px solid #FFFFFF; border-radius: 16px; position: relative;
      box-shadow: 0 0 0 4000px rgba(0,0,0,0.4);
    }
    .qr-frame::before, .qr-frame::after {
      content: ''; position: absolute;
      width: 30px; height: 30px;
      border-color: #43A047; border-style: solid;
    }
    .qr-frame::before { top: -3px; left: -3px; border-width: 4px 0 0 4px; border-radius: 16px 0 0 0; }
    .qr-frame::after { bottom: -3px; right: -3px; border-width: 0 4px 4px 0; border-radius: 0 0 16px 0; }
    .qr-scan-line {
      position: absolute; left: 0; right: 0; top: 50%; height: 3px;
      background: linear-gradient(90deg, transparent, #43A047, transparent);
      animation: scanline 2s linear infinite;
    }
    @keyframes scanline {
      0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; }
    }
    .qr-status {
      text-align: center; padding: 0.75rem;
      font-size: 0.9rem; color: var(--gray); min-height: 40px;
    }
    .qr-status.active { color: var(--success); font-weight: 600; }
    .qr-status.error { color: var(--accent); font-weight: 600; }
    .qr-upload-preview {
      max-width: 100%; max-height: 300px;
      border-radius: 8px; margin: 1rem auto;
      display: block; box-shadow: var(--shadow);
    }
    .qr-camera-select {
      margin-bottom: 0.75rem; padding: 0.5rem 0.75rem;
      border: 2px solid #CFD8DC; border-radius: 8px;
      font-family: var(--font-body); font-size: 0.85rem;
      width: 100%; max-width: 480px;
      display: block; margin-left: auto; margin-right: auto;
    }
    .integrity-flag {
      display: inline-block;
      background: #FFF3E0; color: #663C00;
      padding: 0.15rem 0.5rem; border-radius: 999px;
      font-size: 0.7rem; font-weight: 600; margin-left: 0.35rem;
    }
    .integrity-flag.ok { background: #E8F5E9; color: #1B5E20; }
    .integrity-flag.retake { background: #F3E5F5; color: #6A1B9A; }
    .retake-code-box {
      background: var(--white); padding: 0.85rem 1rem; border-radius: 8px;
      border: 3px dashed var(--primary); margin: 0.75rem 0;
      text-align: center;
    }
    .retake-code-box .code-label {
      font-size: 0.7rem; color: var(--gray); text-transform: uppercase;
      letter-spacing: 1.5px; margin-bottom: 0.3rem;
    }
    .retake-code-box .code-value {
      font-family: 'Courier New', monospace; font-size: 1.75rem;
      font-weight: 700; color: var(--primary); letter-spacing: 4px;
    }
    .feedback-card {
      background: #FFF8E1; border-left: 4px solid var(--warning);
      padding: 0.85rem 1rem; border-radius: 8px;
      margin-bottom: 0.75rem;
    }
    .feedback-card .feedback-meta { font-size: 0.78rem; color: var(--gray); }
    .feedback-card .feedback-body { margin-top: 0.4rem; font-size: 0.9rem; }
    .feedback-card .feedback-rating { font-size: 0.9rem; color: #FFC107; }
    @media print {
      .sidebar, .menu-toggle, .btn, .no-print { display: none !important; }
      .main-content { margin-left: 0; padding: 0; }
      .card { box-shadow: none; border: 1px solid #CCC; page-break-inside: avoid; }
      body { background: white; }
    }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }
  </style>
</head>
<body>

<button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">&#9776;</button>

<div class="app-container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="logo">&#128105;&#8205;&#127979;</span>
      <div>
        <h1>Instructor Dashboard</h1>
        <small>Respiratory Mastery</small>
      </div>
    </div>

    <nav id="navMenu">
      <div class="nav-section">
        <div class="nav-section-title">Overview</div>
        <button class="nav-item active" data-view="overview"><span class="icon">&#128202;</span> Overview</button>
        <button class="nav-item" data-view="alerts"><span class="icon">&#128680;</span> Alerts <span id="alertCount" class="pill pill-danger" style="margin-left:auto;display:none;">0</span></button>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Students</div>
        <button class="nav-item" data-view="import"><span class="icon">&#128229;</span> Import Data</button>
        <button class="nav-item" data-view="roster"><span class="icon">&#128101;</span> Roster</button>
        <button class="nav-item" data-view="add"><span class="icon">&#10133;</span> Add Student</button>
        <button class="nav-item" data-view="grades"><span class="icon">&#128221;</span> Grade Entry</button>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Exams</div>
        <button class="nav-item" data-view="exams"><span class="icon">&#128221;</span> Exam Results</button>
        <button class="nav-item" data-view="retakes"><span class="icon">&#128275;</span> Retake Grants</button>
        <button class="nav-item" data-view="feedback"><span class="icon">&#128172;</span> Student Feedback</button>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Analytics</div>
        <button class="nav-item" data-view="analytics"><span class="icon">&#128200;</span> Analytics</button>
        <button class="nav-item" data-view="units"><span class="icon">&#128218;</span> Unit Breakdown</button>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Reports</div>
        <button class="nav-item" data-view="reports"><span class="icon">&#128196;</span> Reports</button>
        <button class="nav-item" data-view="export"><span class="icon">&#128228;</span> Export Data</button>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Settings</div>
        <button class="nav-item" data-view="settings"><span class="icon">&#9881;</span> Settings</button>
        <button class="nav-item" data-view="help"><span class="icon">&#10067;</span> Help</button>
      </div>
      <div class="nav-section">
        <button class="nav-item" onclick="openStudentApp()"><span class="icon">&#129701;</span> Open Student App</button>
        <button class="nav-item" onclick="openGradebook()"><span class="icon">&#128202;</span> Open Gradebook</button>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="dev-label">Developed by</div>
      <div class="dev-name">JEMUEL C. MARI, MAN, RN, LPT</div>
      <div>Clinical Instructor</div>
      <div>Teacher II &mdash; DepEd</div>
      <div>Tarlac State University</div>
      <div>College of Science &mdash; Nursing Dept.</div>
      <div class="app-version">Version 1.6</div>
    </div>
  </aside>

  <main class="main-content" id="mainContent">
    <div style="padding:3rem;text-align:center;color:var(--gray);">Loading...</div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Modal</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   INSTRUCTOR DASHBOARD — v1.6 CORRECTED
   Complete version with Grant Retake feature
   ============================================================ */

var DB = {
  key: 'respMastery_instructor_v1',
  studentKeyPrefix: 'respMastery_v1',
  state: {
    students: [],
    settings: {
      passingScore: 90,
      atRiskThreshold: 75,
      inactiveDays: 7,
      examPassingScore: 15,
      courseName: 'NCM 101B Lab \u2014 Respiratory Assessment',
      instructorName: 'JEMUEL C. MARI, MAN, RN, LPT'
    },
    activityLog: []
  }
};

var QRScanner = {
  stream: null, videoEl: null, canvasEl: null, canvasCtx: null,
  rafId: null, active: false, lastScanAt: 0, cooldownMs: 1500
};

function loadDB() {
  try {
    var saved = localStorage.getItem(DB.key);
    if (saved) {
      var parsed = JSON.parse(saved);
      DB.state = Object.assign({}, DB.state, parsed);
      DB.state.settings = Object.assign({}, DB.state.settings, parsed.settings || {});
    }
  } catch (e) { console.warn('DB load failed', e); }
}
function saveDB() {
  try { localStorage.setItem(DB.key, JSON.stringify(DB.state)); } catch (e) {}
}
function readLocalStudentProgress() {
  try {
    var raw = localStorage.getItem(DB.studentKeyPrefix);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}
function uid() { return 'S' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function fmtDate(iso) {
  if (!iso) return '\u2014';
  return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}
function fmtDateTime(iso) {
  if (!iso) return '\u2014';
  return new Date(iso).toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function formatDuration(sec) {
  if (!sec && sec !== 0) return '\u2014';
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  return m + ' min ' + s + ' sec';
}
function daysBetween(a, b) { return Math.floor((new Date(b) - new Date(a)) / (1000 * 60 * 60 * 24)); }
function toast(msg, type) {
  type = type || '';
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.classList.remove('show'); }, 3000);
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}

function ensureStudentProgress(s) {
  if (!s.progress) s.progress = {};
  if (!s.quizAttempts) s.quizAttempts = {};
  if (!s.games) s.games = {};
  if (!s.badges) s.badges = {};
  if (s.exam === undefined) s.exam = null;
  if (!s.feedback) s.feedback = [];
  if (!s.retakeGrants) s.retakeGrants = [];
  if (s.retakeAllowed === undefined) s.retakeAllowed = false;
  if (s.retakeCode === undefined) s.retakeCode = null;
  if (s.retakeUsed === undefined) s.retakeUsed = false;
  if (!s.examHistory) s.examHistory = [];
  return s;
}
function getStudentPercent(s) {
  var units = ['unit1','unit2','unit3','unit4','unit5','unit6','unit7'];
  var done = units.filter(function(u) { return s.progress && s.progress[u] && s.progress[u].completed; }).length;
  return Math.round((done / units.length) * 100);
}
function getStudentAverage(s) {
  var unitScores = [];
  Object.values(s.quizAttempts || {}).forEach(function(arr) {
    arr.forEach(function(x) { if (typeof x === 'number') unitScores.push(x); });
  });
  var examScore = s.exam && s.exam.percentage;
  var all = (examScore !== undefined && examScore !== null) ? unitScores.concat([examScore]) : unitScores;
  if (!all.length) return 0;
  return Math.round(all.reduce(function(a, b) { return a + b; }, 0) / all.length);
}
function getUnitAverageOnly(s) {
  var all = [];
  Object.values(s.quizAttempts || {}).forEach(function(arr) {
    arr.forEach(function(x) { if (typeof x === 'number') all.push(x); });
  });
  if (!all.length) return 0;
  return Math.round(all.reduce(function(a, b) { return a + b; }, 0) / all.length);
}
function getStudentStatus(s) {
  var pct = getStudentPercent(s);
  var avg = getStudentAverage(s);
  var examPassed = s.exam && s.exam.passed === true;
  if (pct === 100 && avg >= DB.state.settings.passingScore && examPassed) return { label: 'Mastered', cls: 'pill-success' };
  if (pct === 100 && s.exam && s.exam.submitted && !examPassed && !hasActiveRetake(s)) return { label: 'Exam Failed', cls: 'pill-danger' };
  if (hasActiveRetake(s)) return { label: 'Retake Pending', cls: 'pill-purple' };
  if (pct >= 50) return { label: 'In Progress', cls: 'pill-info' };
  if (pct > 0) return { label: 'At Risk', cls: 'pill-warning' };
  return { label: 'Not Started', cls: 'pill-gray' };
}
function isAtRisk(s) {
  var pct = getStudentPercent(s);
  var avg = getStudentAverage(s);
  var last = s.lastActive;
  if (pct > 0 && pct < DB.state.settings.atRiskThreshold) return true;
  if (avg > 0 && avg < DB.state.settings.atRiskThreshold) return true;
  if (s.exam && s.exam.submitted && !s.exam.passed && !hasActiveRetake(s)) return true;
  if (last && daysBetween(last, new Date().toISOString()) > DB.state.settings.inactiveDays && pct < 100) return true;
  return false;
}
function getIntegrityFlagCount(s) {
  if (!s.exam || !s.exam.integrity) return 0;
  var i = s.exam.integrity;
  return ((i.focusLosses && i.focusLosses.length) || 0) + (i.copyAttempts || 0) + (i.rightClicks || 0) + (i.printAttempts || 0);
}

function generateRetakeCode() {
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code = '';
  for (var i = 0; i < 8; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}
function canGrantRetake(s) {
  if (!s.exam || !s.exam.submitted) return false;
  if (s.retakeAllowed && !s.retakeUsed) return false;
  return true;
}
function grantRetake(s, reason, grantedBy) {
  s.retakeAllowed = true;
  s.retakeCode = generateRetakeCode();
  s.retakeUsed = false;
  s.retakeGrants = s.retakeGrants || [];
  s.retakeGrants.push({
    code: s.retakeCode,
    reason: reason,
    grantedBy: grantedBy,
    grantedAt: new Date().toISOString(),
    used: false
  });
  if (s.exam) {
    s.examHistory = s.examHistory || [];
    var archived = Object.assign({}, s.exam);
    archived.archivedAt = new Date().toISOString();
    s.examHistory.push(archived);
  }
  return s.retakeCode;
}
function revokeRetake(s, code) {
  var grant = (s.retakeGrants || []).find(function(g) { return g.code === code && !g.used; });
  if (!grant) return false;
  grant.revoked = true;
  grant.revokedAt = new Date().toISOString();
  if (s.retakeCode === code) {
    s.retakeCode = null;
    s.retakeAllowed = false;
  }
  return true;
}
function hasActiveRetake(s) {
  return s.retakeAllowed && !s.retakeUsed && s.retakeCode;
}

function getAlertList() {
  var alerts = [];
  DB.state.students.forEach(function(s) {
    var pct = getStudentPercent(s);
    var avg = getStudentAverage(s);
    if (pct > 0 && pct < DB.state.settings.atRiskThreshold) {
      alerts.push({ student: s, type: 'Low Progress', detail: 'Only ' + pct + '% of units completed.', severity: 'warning' });
    }
    if (avg > 0 && avg < DB.state.settings.atRiskThreshold) {
      alerts.push({ student: s, type: 'Low Quiz Average', detail: 'Average score ' + avg + '% \u2014 below threshold.', severity: 'warning' });
    }
    if (avg > 0 && avg < 60) {
      alerts.push({ student: s, type: 'Critical Score', detail: 'Average score ' + avg + '% \u2014 urgent remediation needed.', severity: 'danger' });
    }
    if (s.lastActive && daysBetween(s.lastActive, new Date().toISOString()) > DB.state.settings.inactiveDays && pct < 100) {
      alerts.push({ student: s, type: 'Inactive', detail: 'No activity for ' + daysBetween(s.lastActive, new Date().toISOString()) + ' days.', severity: 'info' });
    }
    Object.keys(s.quizAttempts || {}).forEach(function(unit) {
      var attempts = s.quizAttempts[unit] || [];
      var fails = attempts.filter(function(a) { return a < DB.state.settings.passingScore; }).length;
      if (fails >= 3) {
        alerts.push({ student: s, type: 'Multiple Failures', detail: unit.toUpperCase() + ': ' + fails + ' failed attempts.', severity: 'danger' });
      }
    });
    if (s.exam && s.exam.submitted && !s.exam.passed && !hasActiveRetake(s)) {
      alerts.push({ student: s, type: 'Capstone Exam Failed', detail: 'Score: ' + s.exam.score + '/' + s.exam.total + ' (' + s.exam.percentage + '%) \u2014 no active retake.', severity: 'danger' });
    }
    if (getIntegrityFlagCount(s) >= 3) {
      alerts.push({ student: s, type: 'Exam Integrity Flags', detail: getIntegrityFlagCount(s) + ' integrity events logged \u2014 manual review recommended.', severity: 'warning' });
    }
    if (hasActiveRetake(s)) {
      alerts.push({ student: s, type: 'Retake Granted', detail: 'Retake code ' + s.retakeCode + ' is active but not yet used.', severity: 'info' });
    }
  });
  return alerts;
}

function navigate(view) {
  if (view !== 'import') stopQRScanner();
  document.querySelectorAll('.nav-item').forEach(function(n) {
    n.classList.toggle('active', n.dataset.view === view);
  });
  renderView(view);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  document.getElementById('sidebar').classList.remove('open');
}

function renderView(view) {
  var main = document.getElementById('mainContent');
  main.innerHTML = '<div style="padding:3rem;text-align:center;color:var(--gray);">Loading...</div>';
  setTimeout(function() {
    switch (view) {
      case 'overview': return renderOverview(main);
      case 'alerts': return renderAlerts(main);
      case 'import': return renderImport(main);
      case 'roster': return renderRoster(main);
      case 'add': return renderAddStudent(main);
      case 'grades': return renderGradeEntry(main);
      case 'exams': return renderExams(main);
      case 'retakes': return renderRetakes(main);
      case 'feedback': return renderFeedbackInbox(main);
      case 'analytics': return renderAnalytics(main);
      case 'units': return renderUnitBreakdown(main);
      case 'reports': return renderReports(main);
      case 'export': return renderExport(main);
      case 'settings': return renderSettings(main);
      case 'help': return renderHelp(main);
      default: return renderOverview(main);
    }
  }, 80);
}

function renderOverview(main) {
  var students = DB.state.students;
  var total = students.length;
  var mastered = students.filter(function(s) { return getStudentStatus(s).label === 'Mastered'; }).length;
  var inProgress = students.filter(function(s) { return getStudentStatus(s).label === 'In Progress'; }).length;
  var atRisk = students.filter(function(s) { return isAtRisk(s); }).length;
  var examsTaken = students.filter(function(s) { return s.exam && s.exam.submitted; }).length;
  var examsPassed = students.filter(function(s) { return s.exam && s.exam.passed; }).length;
  var retakesPending = students.filter(function(s) { return hasActiveRetake(s); }).length;
  var alerts = getAlertList();
  var localProgress = readLocalStudentProgress();

  var html = '';
  html += '<div class="card">';
  html += '<div class="card-header"><div><h1>&#128202; Instructor Overview</h1>';
  html += '<p style="color:var(--gray);margin:0;">' + escapeHtml(DB.state.settings.courseName) + ' \u2014 v1.6</p></div>';
  html += '<div class="flex gap-1"><button class="btn btn-outline btn-sm" onclick="navigate(\'import\')">&#128229; Import Data</button>';
  html += '<button class="btn btn-primary btn-sm" onclick="navigate(\'add\')">&#10133; Add Student</button></div></div></div>';

  if (localProgress && localProgress.student && localProgress.student.fullName) {
    html += '<div class="callout callout-info"><strong>&#128229; Local student detected:</strong> ' + escapeHtml(localProgress.student.fullName) + ' (' + escapeHtml(localProgress.student.studentNo || 'no number') + ')';
    html += '<button class="btn btn-sm btn-primary" style="margin-left:0.5rem;" onclick="importLocalProgress()">Import Now</button></div>';
  } else if (localProgress) {
    html += '<div class="callout callout-info"><strong>&#8505; Local student progress detected.</strong>';
    html += '<button class="btn btn-sm btn-primary" style="margin-left:0.5rem;" onclick="importLocalProgress()">Import Now</button></div>';
  }

  html += '<div class="dashboard-grid">';
  html += '<div class="stat-card"><div class="stat-value">' + total + '</div><div class="stat-label">Total Students</div></div>';
  html += '<div class="stat-card success"><div class="stat-value">' + mastered + '</div><div class="stat-label">Mastered</div></div>';
  html += '<div class="stat-card"><div class="stat-value">' + inProgress + '</div><div class="stat-label">In Progress</div></div>';
  html += '<div class="stat-card warning"><div class="stat-value">' + atRisk + '</div><div class="stat-label">At Risk</div></div>';
  html += '<div class="stat-card alert"><div class="stat-value">' + alerts.length + '</div><div class="stat-label">Active Alerts</div></div>';
  html += '</div>';

  html += '<div class="card"><h2>&#128221; Capstone Exam Summary</h2><div class="dashboard-grid">';
  html += '<div class="stat-card"><div class="stat-value">' + examsTaken + '</div><div class="stat-label">Exams Taken</div></div>';
  html += '<div class="stat-card success"><div class="stat-value">' + examsPassed + '</div><div class="stat-label">Exams Passed</div></div>';
  html += '<div class="stat-card alert"><div class="stat-value">' + (examsTaken - examsPassed) + '</div><div class="stat-label">Exams Failed</div></div>';
  html += '<div class="stat-card warning"><div class="stat-value">' + retakesPending + '</div><div class="stat-label">Retakes Pending</div></div>';
  html += '</div>';
  html += '<p style="font-size:0.85rem;color:var(--gray);margin-top:0.5rem;">Passing score: ' + DB.state.settings.examPassingScore + '/30 (50%) &bull; Single attempt by default &bull; Instructor may grant retake</p>';
  html += '</div>';

  html += '<div class="card"><h2>Class Progress Distribution</h2>' + renderDistributionChart(students) + '</div>';

  html += '<div class="card"><div class="card-header"><h2>Recent Activity</h2>';
  html += '<button class="btn btn-sm btn-outline" onclick="navigate(\'roster\')">View All &rarr;</button></div>';
  html += renderRecentActivity() + '</div>';

  html += '<div class="card"><h2>Quick Actions</h2><div class="flex flex-wrap gap-1">';
  html += '<button class="btn btn-primary" onclick="navigate(\'import\')">&#128229; Import Student Data</button>';
  html += '<button class="btn btn-secondary" onclick="navigate(\'roster\')">&#128101; Manage Roster</button>';
  html += '<button class="btn btn-accent" onclick="navigate(\'exams\')">&#128221; View Exam Results</button>';
  html += '<button class="btn btn-outline" onclick="navigate(\'retakes\')">&#128275; Manage Retakes</button>';
  html += '</div></div>';

  html += '<div class="developer-card">';
  html += '<div class="dev-label">Developed by</div>';
  html += '<div class="dev-name">JEMUEL C. MARI, MAN, RN, LPT</div>';
  html += '<div class="dev-info"><strong>Clinical Instructor</strong><br>Teacher II \u2014 Department of Education<br><strong>Tarlac State University</strong><br>College of Science \u2014 Nursing Department</div>';
  html += '<p style="margin-top:0.75rem;font-size:0.72rem;color:var(--gray);">Version 1.6 \u2014 &copy; ' + new Date().getFullYear() + ' \u2014 All Rights Reserved</p>';
  html += '</div>';

  main.innerHTML = html;
}

function renderDistributionChart(students) {
  var buckets = [
    { label: '0%', min: 0, max: 0 },
    { label: '1-25%', min: 1, max: 25 },
    { label: '26-50%', min: 26, max: 50 },
    { label: '51-75%', min: 51, max: 75 },
    { label: '76-99%', min: 76, max: 99 },
    { label: '100%', min: 100, max: 100 }
  ];
  var counts = buckets.map(function(b) {
    return students.filter(function(s) {
      var p = getStudentPercent(s);
      return p >= b.min && p <= b.max;
    }).length;
  });
  var max = Math.max.apply(null, counts.concat([1]));
  var html = '<div class="bar-chart">';
  buckets.forEach(function(b, i) {
    html += '<div class="bar-wrap">';
    html += '<div class="bar-value">' + counts[i] + '</div>';
    html += '<div class="bar" style="height:' + ((counts[i]/max)*100) + '%"></div>';
    html += '<div class="bar-label">' + b.label + '</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderRecentActivity() {
  var log = DB.state.activityLog.slice(-10).reverse();
  if (!log.length) return '<p style="color:var(--gray);">No activity yet.</p>';
  var html = '<div class="table-wrap"><table><thead><tr><th>Time</th><th>Student</th><th>Action</th><th>Detail</th></tr></thead><tbody>';
  log.forEach(function(l) {
    var s = DB.state.students.find(function(x) { return x.id === l.studentId; });
    html += '<tr><td>' + new Date(l.ts).toLocaleString() + '</td>';
    html += '<td>' + escapeHtml(s ? s.name : '\u2014') + '</td>';
    html += '<td>' + escapeHtml(l.action) + '</td>';
    html += '<td>' + escapeHtml(l.detail || '') + '</td></tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function renderAlerts(main) {
  var alerts = getAlertList();
  var html = '';
  html += '<div class="card"><div class="card-header"><h1>&#128680; Student Alerts</h1>';
  html += '<button class="btn btn-outline btn-sm" onclick="navigate(\'overview\')">&larr; Back</button></div>';
  html += '<p>Students flagged for low progress, low scores, inactivity, failed exams, or integrity concerns.</p></div>';

  if (alerts.length === 0) {
    html += '<div class="callout callout-success"><strong>&#9989; No alerts.</strong> All students are on track.</div>';
  } else {
    html += '<div class="card"><div class="table-wrap"><table><thead><tr><th>Student</th><th>Type</th><th>Detail</th><th>Severity</th><th>Action</th></tr></thead><tbody>';
    alerts.forEach(function(a) {
      html += '<tr class="' + (a.severity === 'danger' ? 'alert-row' : '') + '">';
      html += '<td><strong>' + escapeHtml(a.student.name) + '</strong><br><small style="color:var(--gray);">' + escapeHtml(a.student.studentNo || a.student.id) + '</small></td>';
      html += '<td>' + escapeHtml(a.type) + '</td>';
      html += '<td>' + escapeHtml(a.detail) + '</td>';
      html += '<td><span class="pill pill-' + (a.severity === 'danger' ? 'danger' : a.severity === 'warning' ? 'warning' : 'info') + '">' + a.severity.toUpperCase() + '</span></td>';
      html += '<td><button class="btn btn-sm btn-primary" onclick="viewStudent(\'' + a.student.id + '\')">View</button></td>';
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';
  }

  main.innerHTML = html;
  updateAlertBadge();
}

function updateAlertBadge() {
  var count = getAlertList().length;
  var badge = document.getElementById('alertCount');
  if (badge) {
    badge.textContent = count;
    badge.style.display = count > 0 ? 'inline-block' : 'none';
  }
}

function renderImport(main) {
  var html = '';
  html += '<div class="card"><h1>&#128229; Import Student Data</h1>';
  html += '<p style="color:var(--gray);">Receive student progress via 6 methods.</p></div>';

  html += '<div class="tabs" id="importTabs">';
  html += '<button class="tab active" data-tab="qr-camera">&#128247; QR Camera</button>';
  html += '<button class="tab" data-tab="qr-upload">&#128444; QR Image</button>';
  html += '<button class="tab" data-tab="paste">&#128203; Paste Code</button>';
  html += '<button class="tab" data-tab="upload">&#128193; Upload JSON</button>';
  html += '<button class="tab" data-tab="auto">&#128421; Auto (Same Device)</button>';
  html += '<button class="tab" data-tab="manual">&#9999; Manual</button>';
  html += '</div>';

  html += '<div id="importContent">' + renderImportTab('qr-camera') + '</div>';
  main.innerHTML = html;

  document.querySelectorAll('#importTabs .tab').forEach(function(t) {
    t.addEventListener('click', function() {
      stopQRScanner();
      document.querySelectorAll('#importTabs .tab').forEach(function(x) { x.classList.remove('active'); });
      t.classList.add('active');
      document.getElementById('importContent').innerHTML = renderImportTab(t.dataset.tab);
      attachImportHandlers(t.dataset.tab);
    });
  });
  attachImportHandlers('qr-camera');
}

function renderImportTab(tab) {
  if (tab === 'qr-camera') {
    return '<div class="card"><h2>&#128247; Scan Student QR Code (Camera)</h2>' +
      '<p>Point your camera at the student\'s QR code. It will auto-detect and decode.</p>' +
      '<div class="callout callout-info"><strong>&#128241; Best for:</strong> Scanning students\' phones in class. Works on any device with a camera.</div>' +
      '<select class="qr-camera-select" id="qrCameraSelect" style="display:none;"><option value="">Default camera</option></select>' +
      '<div class="qr-scanner-container" id="qrScannerContainer" style="display:none;">' +
      '<video id="qrVideo" playsinline muted autoplay></video>' +
      '<div class="qr-overlay"><div class="qr-frame"><div class="qr-scan-line"></div></div></div></div>' +
      '<div class="qr-status" id="qrStatus">Click "Start Camera" to begin scanning.</div>' +
      '<div class="flex gap-1 mt-2" style="justify-content:center;flex-wrap:wrap;">' +
      '<button class="btn btn-primary" id="qrStartBtn" onclick="startQRScanner()">&#128247; Start Camera</button>' +
      '<button class="btn btn-outline hidden" id="qrStopBtn" onclick="stopQRScanner()">&#9209; Stop Camera</button>' +
      '<button class="btn btn-outline" id="qrSwitchBtn" onclick="switchQRCamera()" style="display:none;">&#128260; Switch Camera</button>' +
      '</div><div id="qrResult"></div></div>';
  }

  if (tab === 'qr-upload') {
    return '<div class="card"><h2>&#128444; Upload QR Code Image</h2>' +
      '<p>If a student sent you a screenshot of their QR code, upload it here.</p>' +
      '<div class="drop-zone" id="qrImageDropZone">' +
      '<div class="drop-icon">&#128444;</div>' +
      '<div class="drop-title">Drop QR image here</div>' +
      '<div class="drop-hint">or click to browse \u2014 PNG, JPG, or WEBP</div>' +
      '<input type="file" id="qrImageInput" accept="image/*" style="display:none;" />' +
      '</div>' +
      '<div class="qr-status" id="qrImageStatus"></div>' +
      '<div id="qrImagePreview"></div>' +
      '<div id="qrImageResult"></div></div>';
  }

  if (tab === 'paste') {
    return '<div class="card"><h2>&#128203; Paste Student Code</h2>' +
      '<p>When a student uses their own device, they will generate a <strong>Base64 code</strong>. Ask them to send it to you via Messenger/email. Paste it here.</p>' +
      '<div class="form-group"><label>Paste the code here:</label>' +

function attachImportHandlers(tab) {
  if (tab === 'qr-camera') {
    if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
      navigator.mediaDevices.enumerateDevices().then(function(devices) {
        var cams = devices.filter(function(d) { return d.kind === 'videoinput'; });
        if (cams.length > 1) {
          var sel = document.getElementById('qrCameraSelect');
          if (sel) {
            sel.innerHTML = cams.map(function(c, i) {
              return '<option value="' + c.deviceId + '">' + (c.label || 'Camera ' + (i+1)) + '</option>';
            }).join('');
            sel.style.display = 'block';
            sel.addEventListener('change', function() {
              if (QRScanner.active) stopQRScanner().then(function() { startQRScanner(); });
            });
          }
        }
      }).catch(function() {});
    }
  }

  if (tab === 'qr-upload') {
    var dz = document.getElementById('qrImageDropZone');
    var fi = document.getElementById('qrImageInput');
    if (!dz || !fi) return;
    dz.addEventListener('click', function() { fi.click(); });
    dz.addEventListener('dragover', function(e) { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', function() { dz.classList.remove('dragover'); });
    dz.addEventListener('drop', function(e) {
      e.preventDefault();
      dz.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleQRImage(e.dataTransfer.files[0]);
    });
    fi.addEventListener('change', function(e) {
      if (e.target.files.length) handleQRImage(e.target.files[0]);
    });
  }

  if (tab === 'upload') {

    dz2.addEventListener('dragleave', function() { dz2.classList.remove('dragover'); });
    dz2.addEventListener('drop', function(e) {
      e.preventDefault();
      dz2.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleJSONFile(e.dataTransfer.files[0]);
    });
    fi2.addEventListener('change', function(e) {
      if (e.target.files.length) handleJSONFile(e.target.files[0]);
    });
  }
}

async function startQRScanner() {
  var container = document.getElementById('qrScannerContainer');
  var video = document.getElementById('qrVideo');
  var startBtn = document.getElementById('qrStartBtn');
  var stopBtn = document.getElementById('qrStopBtn');
  var switchBtn = document.getElementById('qrSwitchBtn');
  var statusEl = document.getElementById('qrStatus');
  var resultEl = document.getElementById('qrResult');

  if (!container || !video) return;
  if (resultEl) resultEl.innerHTML = '';

  try {
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      throw new Error('Camera requires HTTPS. GitHub Pages provides this automatically.');
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Camera not supported in this browser.');
    }

    var camSelect = document.getElementById('qrCameraSelect');
    var deviceId = camSelect && camSelect.value ? camSelect.value : undefined;

    var constraints = {
      video: deviceId
        ? { deviceId: { exact: deviceId } }
        : { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    };

    statusEl.className = 'qr-status active';
    statusEl.textContent = '\u23F3 Requesting camera access...';

    var stream = await navigator.mediaDevices.getUserMedia(constraints);

    QRScanner.stream = stream;
    QRScanner.videoEl = video;
    QRScanner.active = true;

    video.srcObject = stream;
    await video.play();

    container.style.display = 'block';
    if (startBtn) startBtn.classList.add('hidden');
    if (stopBtn) stopBtn.classList.remove('hidden');
    if (switchBtn) switchBtn.style.display = 'inline-flex';

    statusEl.className = 'qr-status active';
    statusEl.textContent = '\uD83D\uDCF7 Scanning... Point at a QR code';

    var canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    QRScanner.canvasEl = canvas;
    QRScanner.canvasCtx = ctx;

    scanFrame();

  } catch (err) {
    console.error('QR Scanner error:', err);
    statusEl.className = 'qr-status error';
    var msg = err.message || 'Could not start camera.';
    if (err.name === 'NotAllowedError') msg = '\u274C Camera permission denied.';
    else if (err.name === 'NotFoundError') msg = '\u274C No camera found. Try the "QR Image" tab.';
    else if (err.name === 'NotReadableError') msg = '\u274C Camera in use by another app.';
    statusEl.textContent = msg;
    toast(msg, 'error');
  }
}

function scanFrame() {
  if (!QRScanner.active) return;
  var video = QRScanner.videoEl;
  var canvas = QRScanner.canvasEl;
  var ctx = QRScanner.canvasCtx;
  if (!video || !canvas || !ctx) return;
  if (video.readyState !== video.HAVE_ENOUGH_DATA) {
    QRScanner.rafId = requestAnimationFrame(scanFrame);
    return;
  }
  if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  if (window.jsQR) {
    var code = window.jsQR(imageData.data, imageData.width, imageData.height, {
      inversionAttempts: 'dontInvert'
    });
    if (code && code.data) {
      var now = Date.now();
      if (now - QRScanner.lastScanAt > QRScanner.cooldownMs) {
        QRScanner.lastScanAt = now;
        handleQRDecoded(code.data, 'camera');
      }
    }
  }
  QRScanner.rafId = requestAnimationFrame(scanFrame);
}

function stopQRScanner() {
  QRScanner.active = false;
  if (QRScanner.rafId) { cancelAnimationFrame(QRScanner.rafId); QRScanner.rafId = null; }
  if (QRScanner.stream) {
    QRScanner.stream.getTracks().forEach(function(t) { t.stop(); });
    QRScanner.stream = null;
  }
  var video = document.getElementById('qrVideo');
  if (video) video.srcObject = null;
  var container = document.getElementById('qrScannerContainer');
  if (container) container.style.display = 'none';
  var startBtn = document.getElementById('qrStartBtn');
  var stopBtn = document.getElementById('qrStopBtn');
  var switchBtn = document.getElementById('qrSwitchBtn');
  var statusEl = document.getElementById('qrStatus');
  if (startBtn) startBtn.classList.remove('hidden');
  if (stopBtn) stopBtn.classList.add('hidden');
  if (switchBtn) switchBtn.style.display = 'none';
  if (statusEl) {
    statusEl.className = 'qr-status';
    statusEl.textContent = 'Click "Start Camera" to begin scanning.';
  }
  return Promise.resolve();
}

async function switchQRCamera() {
  var sel = document.getElementById('qrCameraSelect');
  if (!sel) return;
  var cams = Array.from(sel.options);
  if (cams.length < 2) return;
  sel.selectedIndex = (sel.selectedIndex + 1) % cams.length;
  await stopQRScanner();
  await startQRScanner();
}

function handleQRImage(file) {
  var statusEl = document.getElementById('qrImageStatus');
  var previewEl = document.getElementById('qrImagePreview');
  var resultEl = document.getElementById('qrImageResult');
  if (!file) return;
  statusEl.className = 'qr-status';
  statusEl.textContent = '\u23F3 Reading image...';
  previewEl.innerHTML = '';
  resultEl.innerHTML = '';
  if (!file.type.startsWith('image/')) {
    statusEl.className = 'qr-status error';
    statusEl.textContent = '\u274C Please upload an image file.';
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      previewEl.innerHTML = '<img src="' + e.target.result + '" class="qr-upload-preview" alt="Uploaded QR" />';
      var canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      var ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      if (!window.jsQR) {
        statusEl.className = 'qr-status error';
        statusEl.textContent = '\u274C QR library not loaded.';
        return;
      }
      var code = window.jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: 'attemptBoth'
      });
      if (!code) {
        var scale = Math.min(2, 1500 / Math.max(canvas.width, canvas.height));
        if (scale > 1) {
          var scaled = document.createElement('canvas');
          scaled.width = Math.round(canvas.width * scale);
          scaled.height = Math.round(canvas.height * scale);
          var sctx = scaled.getContext('2d', { willReadFrequently: true });
          sctx.imageSmoothingEnabled = false;
          sctx.drawImage(canvas, 0, 0, scaled.width, scaled.height);
          var sdata = sctx.getImageData(0, 0, scaled.width, scaled.height);
          code = window.jsQR(sdata.data, sdata.width, sdata.height, {
            inversionAttempts: 'attemptBoth'
          });
        }
      }
      if (code && code.data) {
        statusEl.className = 'qr-status active';
        statusEl.textContent = '\u2705 QR decoded successfully!';
        handleQRDecoded(code.data, 'image', resultEl);
      } else {
        statusEl.className = 'qr-status error';
        statusEl.textContent = '\u274C Could not read QR code. Try a clearer image.';
      }
    };
    img.onerror = function() {
      statusEl.className = 'qr-status error';
      statusEl.textContent = '\u274C Could not load image.';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function handleQRDecoded(qrData, source, targetEl) {
  var data = decodeStudentCode(qrData);
  if (!data || !data.student) {
    var html = '<div class="callout callout-danger"><strong>\u274C Could not recognize this QR code.</strong>';
    html += '<details style="margin-top:0.5rem;"><summary style="cursor:pointer;">Show raw data</summary>';
    html += '<pre style="background:var(--light);padding:0.75rem;border-radius:6px;font-size:0.75rem;overflow:auto;max-height:200px;margin-top:0.5rem;">' + escapeHtml(String(qrData).slice(0, 2000)) + '</pre></details></div>';
    if (targetEl) targetEl.innerHTML = html;
    else {
      var el = document.getElementById('qrResult');
      if (el) el.innerHTML = html;
    }
    toast('QR code not recognized.', 'error');
    return;
  }
  var container = targetEl || document.getElementById('qrResult');
  if (container) showImportPreview(data, container.id, source === 'camera');
  toast('\u2705 QR code decoded successfully!', 'success');
}

function decodeStudentCode(code) {
  if (!code) return null;
  var str = String(code).trim();
  try {
    var json = decodeURIComponent(escape(atob(str)));
    var parsed = JSON.parse(json);
    if (parsed && parsed.student) return parsed;
  } catch (e) {}
  try {
    var parsed2 = JSON.parse(str);
    if (parsed2 && parsed2.student) return parsed2;
  } catch (e) {}
  return null;
}

function processPastedCode() {
  var code = document.getElementById('pasteCode').value.trim();
  if (!code) return toast('Please paste the code first.', 'warning');
  var data = decodeStudentCode(code);
  if (!data) return toast('Invalid code. Please check and try again.', 'error');
  if (!data.student) return toast('Missing student data.', 'error');
  showImportPreview(data, 'pastePreview');
}

function handleJSONFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.student) throw new Error('Missing student data');
      showImportPreview(data, 'uploadPreview');
    } catch (err) {
      toast('Invalid JSON file.', 'error');
    }
  };
  reader.readAsText(file);
}

function clearQRResult() {
  var el = document.getElementById('qrResult');
  if (el) el.innerHTML = '';
  var statusEl = document.getElementById('qrStatus');
  if (statusEl) {
    statusEl.className = 'qr-status active';
    statusEl.textContent = '\uD83D\uDCF7 Scanning... Point at a QR code';
  }
  QRScanner.lastScanAt = 0;
}

function getPercentFromData(data) {
  var units = ['unit1','unit2','unit3','unit4','unit5','unit6','unit7'];
  var done = units.filter(function(u) { return data.progress && data.progress[u] && data.progress[u].completed; }).length;
  return Math.round((done / units.length) * 100);
}
function getAvgFromData(data) {
  var all = [];
  Object.values(data.quizAttempts || {}).forEach(function(arr) {
    arr.forEach(function(x) { if (typeof x === 'number') all.push(x); });
  });
  if (!all.length) return 0;
  return Math.round(all.reduce(function(a, b) { return a + b; }, 0) / all.length);
}

function confirmImport(dataStr, mode, existingId) {
  var data = JSON.parse(dataStr);
  var s = data.student;
  var existing = mode === 'update' ? DB.state.students.find(function(x) { return x.id === existingId; }) : null;

  var studentRecord = ensureStudentProgress({
    id: mode === 'update' ? existingId : uid(),
    name: s.fullName || ((s.firstName || '') + ' ' + (s.lastName || '')).trim(),
    firstName: s.firstName || '',
    lastName: s.lastName || '',
    studentNo: s.studentNo || '',
    section: s.section || '',
    group: s.group || '',
    email: s.email || '',
    enrolled: existing ? existing.enrolled : todayISO(),
    manual: false,
    notes: existing ? existing.notes : ('Imported ' + (mode === 'update' ? '(update)' : '(new)') + ' on ' + new Date().toLocaleString() + '.'),
    progress: data.progress || {},
    quizAttempts: data.quizAttempts || {},
    games: data.games || {},
    badges: data.badges || {},
    exam: data.exam || null,
    examHistory: existing ? (existing.examHistory || []) : [],
    feedback: data.feedback || (existing ? existing.feedback : []) || [],
    retakeGrants: existing ? (existing.retakeGrants || []) : [],
    retakeAllowed: existing ? (existing.retakeAllowed || false) : false,
    retakeCode: existing ? (existing.retakeCode || null) : null,
    retakeUsed: existing ? (existing.retakeUsed || false) : false,
    lastActive: s.lastActive || new Date().toISOString(),
    appVersion: data.appVersion || '1.6'
  });

  if (mode === 'update') {
    var idx = DB.state.students.findIndex(function(x) { return x.id === existingId; });
    if (idx >= 0) DB.state.students[idx] = studentRecord;
    logActivity(existingId, 'Updated via import', studentRecord.name);
    toast('\u2705 Student record updated.', 'success');
  } else {
    DB.state.students.push(studentRecord);
    logActivity(studentRecord.id, 'Imported (new)', studentRecord.name);
    toast('\u2705 Student added to roster.', 'success');
  }

  saveDB();
  updateAlertBadge();
  stopQRScanner();
  navigate('roster');
}

function importLocalProgress() {
  var raw = localStorage.getItem(DB.studentKeyPrefix);
  if (!raw) return toast('No local student progress found.', 'warning');
  var data;
  try { data = JSON.parse(raw); } catch (e) { return toast('Could not parse local data.', 'error'); }

  if (!data.student || !data.student.fullName) {
    var name = prompt('This student did not register. Enter their name:');
    if (!name) return;
    data.student = { fullName: name, studentNo: '', section: '', group: '', email: '' };
  }

  var existing = DB.state.students.find(function(x) {
    return (data.student.studentNo && x.studentNo === data.student.studentNo) || (data.student.email && x.email === data.student.email);
  });

  if (existing) {
    if (!confirm(data.student.fullName + ' already exists in the roster. Update their record?')) return;
    confirmImport(JSON.stringify(data), 'update', existing.id);
  } else {
    confirmImport(JSON.stringify(data), 'new', null);
  }
}

  html += '<th>Student</th><th>Section</th><th>Group</th><th>Progress</th><th>Unit Avg</th><th>Exam</th><th>Retake</th><th>Status</th><th>Last Active</th><th>Actions</th>';
  html += '</tr></thead><tbody id="rosterBody">';

  if (students.length === 0) {
    html += '<tr><td colspan="10" style="text-align:center;color:var(--gray);padding:2rem;">No students yet. Click "Add" or "Import" to begin.</td></tr>';
  } else {
    students.forEach(function(s) { html += renderStudentRow(s); });
  }

  html += '</tbody></table></div></div>';
  main.innerHTML = html;
}

function renderStudentRow(s) {
  var pct = getStudentPercent(s);
  var unitAvg = getUnitAverageOnly(s);
  var status = getStudentStatus(s);
  var atRisk = isAtRisk(s);
  var progressClass = pct >= 75 ? '' : pct >= 50 ? 'warn' : 'danger';
  var exam = s.exam;
  var flags = getIntegrityFlagCount(s);

  var retakeCell = '<span class="pill pill-gray">\u2014</span>';
  if (hasActiveRetake(s)) retakeCell = '<span class="pill pill-purple" title="Code: ' + escapeHtml(s.retakeCode) + '">&#128275; Active</span>';
  else if (s.retakeUsed) retakeCell = '<span class="pill pill-info">&#8635; Used</span>';

  var html = '<tr class="' + (atRisk ? 'alert-row' : '') + '">';
  html += '<td><strong>' + escapeHtml(s.name) + '</strong><br><small style="color:var(--gray);">' + escapeHtml(s.studentNo || s.id) + '</small></td>';
  html += '<td>' + escapeHtml(s.section || '\u2014') + '</td>';
  html += '<td>' + escapeHtml(s.group || '\u2014') + '</td>';
  html += '<td><div class="progress-bar"><div class="progress-fill ' + progressClass + '" style="width:' + pct + '%"></div></div><small>' + pct + '%</small></td>';
  html += '<td><strong>' + unitAvg + '%</strong></td>';
  html += '<td>';
  if (exam && exam.submitted) {
    html += '<span class="pill ' + (exam.passed ? 'pill-success' : 'pill-danger') + '">' + exam.score + '/' + exam.total + '</span>';
    if (flags > 0) html += '<span class="integrity-flag" title="' + flags + ' integrity events">\u26A0 ' + flags + '</span>';
  } else {
    html += '<span class="pill pill-gray">Not taken</span>';
  }
  html += '</td>';
  html += '<td>' + retakeCell + '</td>';
  html += '<td><span class="pill ' + status.cls + '">' + status.label + '</span></td>';
  html += '<td><small>' + fmtDate(s.lastActive) + '</small></td>';
  html += '<td>';
  html += '<button class="btn btn-sm btn-primary" onclick="viewStudent(\'' + s.id + '\')">View</button>';
  html += '<button class="btn btn-sm btn-outline" onclick="editStudent(\'' + s.id + '\')">Edit</button>';
  html += '<button class="btn btn-sm btn-danger" onclick="deleteStudent(\'' + s.id + '\')">Delete</button>';
  html += '</td></tr>';
  return html;
}

function filterRoster() {
  var q = document.getElementById('rosterSearch').value.toLowerCase();
  document.querySelectorAll('#rosterBody tr').forEach(function(tr, i) {
    var s = DB.state.students[i];
    if (!s) return;
    var match = (s.name + ' ' + (s.studentNo || '') + ' ' + (s.section || '') + ' ' + (s.group || '') + ' ' + (s.email || '')).toLowerCase().indexOf(q) >= 0;
    tr.style.display = match ? '' : 'none';
  });
}

function saveStudent(event, editId) {
  event.preventDefault();
  var data = {
    name: document.getElementById('f_name').value.trim(),
    studentNo: document.getElementById('f_studentNo').value.trim(),
    section: document.getElementById('f_section').value.trim(),
    group: document.getElementById('f_group').value.trim(),
    email: document.getElementById('f_email').value.trim(),
    enrolled: document.getElementById('f_enrolled').value,
    notes: document.getElementById('f_notes').value.trim()
  };
  if (!data.name) return toast('Name is required.', 'error');

  if (editId) {
    var s = DB.state.students.find(function(x) { return x.id === editId; });
    Object.assign(s, data);
    logActivity(editId, 'Updated profile', data.name);
    toast('Student updated.', 'success');
  } else {
    var newStudent = ensureStudentProgress(Object.assign({
      id: uid(),
      progress: {}, quizAttempts: {}, games: {}, badges: {},
      exam: null, feedback: [], lastActive: null
    }, data));
    DB.state.students.push(newStudent);
    logActivity(newStudent.id, 'Added to roster', newStudent.name);
    toast('Student added.', 'success');
  }
  saveDB();
  navigate('roster');
}

function viewStudent(id) {
  var s = DB.state.students.find(function(x) { return x.id === id; });

  var unitAvg = getUnitAverageOnly(s);

  var unitNames = {
    unit1: 'Normal Baseline', unit2: 'Inspection', unit3: 'Palpation',

  document.getElementById('modalTitle').textContent = s.name;

  html += '<span class="pill ' + status.cls + '">' + status.label + '</span>';
  html += '<span class="pill pill-info">' + pct + '% Complete</span>';
  html += '<span class="pill pill-' + (unitAvg >= 90 ? 'success' : unitAvg >= 75 ? 'warning' : 'danger') + '">Unit Avg ' + unitAvg + '%</span>';
  html += exam && exam.submitted
    ? '<span class="pill ' + (exam.passed ? 'pill-success' : 'pill-danger') + '">Exam ' + exam.score + '/' + exam.total + '</span>'
    : '<span class="pill pill-gray">No Exam</span>';
  if (hasActiveRetake(s)) html += '<span class="pill pill-purple">&#128275; Retake Pending</span>';
  html += '</div>';

  html += '<p><strong>Student No:</strong> ' + escapeHtml(s.studentNo || '\u2014') + '</p>';
  html += '<p><strong>Section:</strong> ' + escapeHtml(s.section || '\u2014') + '</p>';
  html += '<p><strong>Group Number:</strong> ' + escapeHtml(s.group || '\u2014') + '</p>';

  units.forEach(function(u) {
    var p = s.progress && s.progress[u];
    var attempts = (s.quizAttempts && s.quizAttempts[u]) || [];
    var best = attempts.length ? Math.max.apply(null, attempts) : null;
    html += '<tr><td>' + unitNames[u] + '</td>';
    html += '<td>' + (p && p.completed ? '<span class="pill pill-success">&#9989; Done</span>' : '<span class="pill pill-gray">Pending</span>') + '</td>';
    html += '<td>' + (best !== null ? best + '%' : '\u2014') + '</td>';
    html += '<td>' + (attempts.length ? attempts.join(', ') + '%' : '\u2014') + '</td></tr>';
  });
  html += '</tbody></table></div>';

  html += '<h3>&#127918; Mastery Games</h3>';
  html += '<div class="table-wrap"><table><thead><tr><th>Game</th><th>Best Score</th><th>Attempts</th></tr></thead><tbody>';
  ['blitz','tree','sound','redflag','matrix'].forEach(function(g) {
    var attempts = (s.games && s.games[g]) || [];
    var best = attempts.length ? Math.max.apply(null, attempts) : null;
    html += '<tr><td>' + (g.charAt(0).toUpperCase() + g.slice(1)) + '</td>';
    html += '<td>' + (best !== null ? best + '%' : '\u2014') + '</td>';
    html += '<td>' + (attempts.length ? attempts.join(', ') + '%' : '\u2014') + '</td></tr>';
  });
  html += '</tbody></table></div>';

  if (exam && exam.submitted) {
    html += '<h3>&#128221; Capstone Exam Result</h3>';

    html += '<tr><td><strong>Score</strong></td><td><strong>' + exam.score + '/' + exam.total + ' (' + exam.percentage + '%)</strong></td></tr>';
    html += '<tr><td><strong>Result</strong></td><td>' + (exam.passed ? '<span class="pill pill-success">&#9989; PASSED</span>' : '<span class="pill pill-danger">&#10060; NOT PASSED</span>') + '</td></tr>';
    html += '<tr><td><strong>Passing Score</strong></td><td>' + (exam.passingScore || 15) + '/30 (50%)</td></tr>';
    html += '<tr><td><strong>Date Taken</strong></td><td>' + fmtDateTime(exam.takenAt) + '</td></tr>';
    html += '<tr><td><strong>Duration</strong></td><td>' + formatDuration(exam.durationSec) + '</td></tr>';
    html += '</tbody></table></div>';

    html += '<h3>&#128202; Bloom\'s Taxonomy Breakdown</h3>';
    html += '<div class="table-wrap"><table><thead><tr><th>Level</th><th>Score</th><th>%</th></tr></thead><tbody>';
    Object.keys(exam.bloomBreakdown || {}).forEach(function(lvl) {
      var arr = exam.bloomBreakdown[lvl];
      var got = arr[0], total = arr[1];
      var pct2 = total ? Math.round(got / total * 100) : 0;
      html += '<tr><td>' + (lvl.charAt(0).toUpperCase() + lvl.slice(1)) + '</td><td>' + got + '/' + total + '</td><td>' + pct2 + '%</td></tr>';
    });
    html += '</tbody></table></div>';

    html += '<h3>&#128274; Exam Integrity Report</h3>';
    html += '<div class="table-wrap"><table><tbody>';
    html += '<tr><td>Focus loss events (tab switch / blur)</td><td><strong>' + ((exam.integrity && exam.integrity.focusLosses && exam.integrity.focusLosses.length) || 0) + '</strong></td></tr>';
    html += '<tr><td>Copy / paste attempts</td><td><strong>' + ((exam.integrity && exam.integrity.copyAttempts) || 0) + '</strong></td></tr>';
    html += '<tr><td>Right-click attempts</td><td><strong>' + ((exam.integrity && exam.integrity.rightClicks) || 0) + '</strong></td></tr>';
    html += '<tr><td>Print / screenshot attempts</td><td><strong>' + ((exam.integrity && exam.integrity.printAttempts) || 0) + '</strong></td></tr>';
    html += '</tbody></table></div>';
    if (flags === 0) {
      html += '<div class="callout callout-success"><strong>&#9989; No integrity concerns detected.</strong></div>';
    } else {
      html += '<div class="callout callout-warning"><strong>&#9888; ' + flags + ' integrity flag(s) logged \u2014 manual review recommended.</strong></div>';
    }

    html += '<h3>&#128275; Exam Retake Management</h3>';
    if (hasActiveRetake(s)) {
      var grant = (s.retakeGrants || []).find(function(g) { return g.code === s.retakeCode; });

      html += '<strong>&#9888; Active Retake Granted</strong><br>';

      html += '</div>';
      html += '<div style="font-size:0.8rem;color:var(--gray);margin-top:0.75rem;">';
      html += '<strong>Granted by:</strong> ' + escapeHtml(grant ? grant.grantedBy : '\u2014') + '<br>';
      html += '<strong>Reason:</strong> ' + escapeHtml(grant ? grant.reason : '\u2014') + '<br>';
      html += '<strong>Granted at:</strong> ' + fmtDateTime(grant ? grant.grantedAt : null);

      html += '<div class="flex gap-1 mt-2" style="flex-wrap:wrap;">';
      html += '<button class="btn btn-outline btn-sm" onclick="revokeRetakeFromModal(\'' + s.id + '\', \'' + escapeHtml(s.retakeCode) + '\')">&#128683; Revoke Retake</button>';
      html += '</div></div>';
    } else if (s.retakeUsed) {
      html += '<div class="callout callout-info">';
      html += '<strong>&#8505; Retake Already Used</strong><br>';
      html += 'This student already used their granted retake. Their current score reflects the latest attempt.';
      html += '<div style="font-size:0.8rem;color:var(--gray);margin-top:0.5rem;">';
      html += '<strong>Total retakes granted:</strong> ' + (s.retakeGrants || []).length + '<br>';
      html += '<strong>Total exam attempts:</strong> ' + (1 + (s.examHistory || []).length);
      html += '</div>';
      html += '<button class="btn btn-primary btn-sm mt-2" onclick="promptGrantRetake(\'' + s.id + '\')">&#128275; Grant Another Retake</button>';
      html += '</div>';
    } else {
      html += '<div class="callout callout-info">';
      html += '<strong>&#8505; No Retake Granted</strong><br>';
      html += 'By default, the Capstone Exam is single-attempt. If the student presents a valid reason (medical, technical, or other extenuating circumstances), you may grant a retake.';
      html += '<br><br>';
      html += '<button class="btn btn-primary btn-sm" onclick="promptGrantRetake(\'' + s.id + '\')">&#128275; Grant Exam Retake</button>';
      html += '</div>';
    }

    if (s.examHistory && s.examHistory.length > 0) {
      html += '<h3>&#128218; Previous Exam Attempts</h3>';
      html += '<div class="table-wrap"><table><thead><tr><th>Attempt</th><th>Score</th><th>Result</th><th>Date</th><th>Duration</th></tr></thead><tbody>';
      s.examHistory.forEach(function(h, i) {
        html += '<tr><td>Attempt ' + (i+1) + ' (archived)</td>';
        html += '<td>' + h.score + '/' + h.total + ' (' + h.percentage + '%)</td>';
        html += '<td>' + (h.passed ? '<span class="pill pill-success">&#9989; PASS</span>' : '<span class="pill pill-danger">&#10060; FAIL</span>') + '</td>';

        html += '<td>' + formatDuration(h.durationSec) + '</td></tr>';

      html += '<div class="table-wrap"><table><thead><tr><th>Code</th><th>Reason</th><th>Granted By</th><th>Granted At</th><th>Status</th></tr></thead><tbody>';

        html += '<tr><td><code>' + escapeHtml(g.code) + '</code></td>';
        html += '<td>' + escapeHtml(g.reason) + '</td>';

      });

  } else {
    html += '<div class="callout callout-info"><strong>&#128221; Capstone Exam not yet taken by this student.</strong></div>';
  }

  if (s.feedback && s.feedback.length) {
    html += '<h3>&#128172; Student Feedback (' + s.feedback.length + ')</h3>';
    s.feedback.forEach(function(f) {
      html += '<div class="feedback-card">';
      html += '<div class="feedback-meta">' + fmtDateTime(f.submittedAt) + ' &bull; ' + escapeHtml(f.category || 'general');
      if (f.anonymous) html += ' &bull; Anonymous';
      html += '</div>';
      html += '<div class="feedback-rating">' + (f.rating ? '\u2B50'.repeat(f.rating) : 'No rating') + '</div>';
      html += '<div class="feedback-body">' + escapeHtml(f.message) + '</div>';
      html += '</div>';
    });
  }

  html += '<h3>Manual Grade Override</h3>';
  html += '<p style="font-size:0.85rem;color:var(--gray);">Use this if the student completed the module on a different device.</p>';

  html += '</div>';

  html += '<div class="flex gap-1">';
  html += '<button class="btn btn-primary" onclick="saveManualGrade(\'' + s.id + '\')">&#128190; Save Grade</button>';
  html += '<button class="btn btn-outline" onclick="closeModal()">Close</button>';
  html += '</div>';

  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}

function saveManualGrade(id) {
  var s = DB.state.students.find(function(x) { return x.id === id; });
  if (!s) return;
  var score = parseInt(document.getElementById('m_score').value, 10) || 0;
  var units = parseInt(document.getElementById('m_units').value, 10) || 0;
  s.manual = true;
  s.notes = document.getElementById('m_notes').value.trim();
  var unitKeys = ['unit1','unit2','unit3','unit4','unit5','unit6','unit7'];
  s.progress = {};
  s.quizAttempts = {};
  unitKeys.slice(0, units).forEach(function(u) {
    s.progress[u] = { completed: true, score: score, date: new Date().toISOString() };
    s.quizAttempts[u] = [score];
  });
  s.lastActive = new Date().toISOString();
  logActivity(id, 'Manual grade saved', 'Score ' + score + '%, Units ' + units + '/7');
  saveDB();
  toast('Grade saved.', 'success');
  closeModal();
  renderView('roster');
}

function editStudent(id) { renderAddStudent(document.getElementById('mainContent'), id); }

function deleteStudent(id) {
  var s = DB.state.students.find(function(x) { return x.id === id; });
  if (!s) return;
  if (!confirm('Delete ' + s.name + '? This cannot be undone.')) return;
  DB.state.students = DB.state.students.filter(function(x) { return x.id !== id; });
  saveDB();
  toast('Student deleted.', 'warning');
  renderView('roster');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }

  html += '<option value="Family emergency / bereavement">Family emergency / bereavement</option>';

function toggleCustomReason() {
  var sel = document.getElementById('retakeReasonSelect');
  var grp = document.getElementById('customReasonGroup');
  if (sel.value === 'Other (specify below)') grp.classList.remove('hidden');
  else grp.classList.add('hidden');
}

function confirmGrantRetake(studentId) {
  var s = DB.state.students.find(function(x) { return x.id === studentId; });
  if (!s) return toast('Student not found.', 'error');

  var sel = document.getElementById('retakeReasonSelect');
  var reason = sel.value;
  if (reason === 'Other (specify below)') {
    reason = document.getElementById('retakeCustomReason').value.trim();
    if (!reason) return toast('Please specify the custom reason.', 'warning');
  }
  if (!reason) return toast('Please select or specify a reason.', 'warning');

  var grantedBy = document.getElementById('retakeGrantedBy').value.trim();
  if (!grantedBy) return toast('Please enter who is granting the retake.', 'warning');

  var notes = document.getElementById('retakeNotes').value.trim();
  if (notes) reason += ' \u2014 Notes: ' + notes;

  var code = grantRetake(s, reason, grantedBy);
  logActivity(studentId, 'Exam retake granted', 'Code: ' + code + ' \u2014 Reason: ' + reason);
  saveDB();

  toast('\u2705 Retake granted. Code: ' + code, 'success');
  setTimeout(function() { viewStudent(studentId); }, 300);
}

function copyRetakeCode(code) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(code).then(function() {
      toast('\u2705 Retake code copied to clipboard!', 'success');
    }).catch(function() { fallbackCopy(code); });
  } else {
    fallbackCopy(code);
  }
}
function fallbackCopy(code) {
  var ta = document.createElement('textarea');
  ta.value = code;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('\u2705 Retake code copied!', 'success'); }
  catch (e) { toast('Please copy manually: ' + code, 'warning'); }
  document.body.removeChild(ta);
}

function revokeRetakeFromModal(studentId, code) {
  var s = DB.state.students.find(function(x) { return x.id === studentId; });
  if (!s) return;
  if (!confirm('\u26A0 Revoke retake code ' + code + '?\n\nThe student will not be able to use this code.')) return;

  if (revokeRetake(s, code)) {
    logActivity(studentId, 'Exam retake revoked', 'Code: ' + code);
    saveDB();
    toast('\uD83D\uDEAB Retake revoked.', 'warning');
    setTimeout(function() { viewStudent(studentId); }, 300);
  } else {
    toast('Could not revoke \u2014 code may already be used.', 'error');
  }
}

function saveBulkGrades() {
  var scores = document.querySelectorAll('[data-score]');
  var units = document.querySelectorAll('[data-units]');
  var notes = document.querySelectorAll('[data-notes]');
  var count = 0;
  scores.forEach(function(el, i) {
    var id = el.dataset.score;
    var s = DB.state.students.find(function(x) { return x.id === id; });
    if (!s) return;
    var score = parseInt(el.value, 10) || 0;
    var unitCount = parseInt(units[i].value, 10) || 0;
    s.notes = notes[i].value.trim();
    s.manual = true;
    var unitKeys = ['unit1','unit2','unit3','unit4','unit5','unit6','unit7'];
    s.progress = {};
    s.quizAttempts = {};
    unitKeys.slice(0, unitCount).forEach(function(u) {
      s.progress[u] = { completed: true, score: score, date: new Date().toISOString() };
      s.quizAttempts[u] = [score];
    });
    s.lastActive = new Date().toISOString();
    logActivity(id, 'Bulk grade update', score + '%, ' + unitCount + '/7 units');
    count++;
  });
  saveDB();
  toast('Saved ' + count + ' grades.', 'success');
  renderView('roster');
}

      rows.push([
