<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0D7377" />
  <meta name="description" content="Instructor Dashboard v2.0 — Respiratory Assessment Mastery. Developed by JEMUEL C. MARI, MAN, RN, LPT." />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Instructor Dashboard — Respiratory Mastery v2.0</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    :root {
      --primary: #0D7377; --primary-dark: #095456; --primary-light: #E0F2F1;
      --secondary: #1E88E5; --secondary-light: #E3F2FD;
      --accent: #E53935; --accent-light: #FFEBEE;
      --success: #43A047; --success-light: #E8F5E9;
      --warning: #FB8C00; --warning-light: #FFF3E0;
      --purple: #8E24AA; --purple-light: #F3E5F5;
      --dark: #1A2027; --dark-2: #2D3748;
      --light: #F7F9FB; --white: #FFFFFF; --gray: #718096; --gray-light: #E2E8F0;
      --radius: 14px; --radius-sm: 8px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow: 0 4px 16px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.12);
      --font-head: 'Inter', 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --sidebar-w: 260px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body); background: var(--light); color: var(--dark);
      line-height: 1.6; -webkit-font-smoothing: antialiased; font-size: 14px;
    }
    h1, h2, h3, h4, h5 { font-family: var(--font-head); font-weight: 700; line-height: 1.25; letter-spacing: -0.02em; }
    h1 { font-size: 1.75rem; font-weight: 800; }
    h2 { font-size: 1.35rem; }
    h3 { font-size: 1.1rem; }
    p { margin-bottom: 0.5rem; }
    button { font-family: inherit; }
    input, select, textarea { font-family: inherit; }

    /* Layout */
    .app-container { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-w); background: var(--dark); color: var(--white);
      padding: 1.25rem 0.85rem; position: fixed; top: 0; left: 0; bottom: 0;
      overflow-y: auto; z-index: 100; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column;
    }
    .sidebar::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 200px;
      background: linear-gradient(180deg, rgba(13,115,119,0.4), transparent);
      pointer-events: none;
    }
    .sidebar-header {
      display: flex; align-items: center; gap: 0.7rem; padding: 0.5rem 0.5rem 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 1rem;
      position: relative; z-index: 1;
    }
    .sidebar-header .logo {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; flex-shrink: 0;
    }
    .sidebar-header h1 { font-size: 0.95rem; color: var(--white); line-height: 1.2; }
    .sidebar-header small { display: block; font-size: 0.68rem; color: rgba(255,255,255,0.55); font-weight: 400; margin-top: 0.15rem; }
    .nav-section { margin-bottom: 1rem; position: relative; z-index: 1; }
    .nav-section-title {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.2px;
      color: rgba(255,255,255,0.4); margin-bottom: 0.4rem; padding: 0 0.6rem;
      font-weight: 600;
    }
    .nav-item {
      display: flex; align-items: center; gap: 0.65rem;
      padding: 0.55rem 0.7rem; border-radius: var(--radius-sm);
      color: rgba(255,255,255,0.75); cursor: pointer;
      font-size: 0.85rem; transition: all 0.15s;
      border: none; background: none; width: 100%; text-align: left;
      font-family: var(--font-body); font-weight: 500;
      position: relative;
    }
    .nav-item:hover { background: rgba(255,255,255,0.06); color: var(--white); }
    .nav-item.active {
      background: rgba(13,115,119,0.35); color: var(--white); font-weight: 600;
      box-shadow: inset 3px 0 0 var(--primary);
    }
    .nav-item .icon { font-size: 1rem; width: 1.4rem; text-align: center; flex-shrink: 0; }
    .nav-item .nav-badge {
      margin-left: auto; background: var(--accent); color: var(--white);
      font-size: 0.65rem; font-weight: 700; padding: 0.1rem 0.4rem;
      border-radius: 999px; min-width: 20px; text-align: center;
    }
    .nav-item .nav-badge.hidden { display: none; }
    .sidebar-footer {
      margin-top: auto; padding: 1rem 0.5rem 0.5rem;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 0.7rem; line-height: 1.55; color: rgba(255,255,255,0.55);
      position: relative; z-index: 1;
    }
    .sidebar-footer .dev-label {
      font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px;
      opacity: 0.6; margin-bottom: 0.25rem;
    }
    .sidebar-footer .dev-name { font-weight: 700; color: var(--white); font-size: 0.72rem; }
    .sidebar-footer .app-version {
      margin-top: 0.5rem; padding-top: 0.5rem;
      border-top: 1px dashed rgba(255,255,255,0.1);
      font-size: 0.65rem; display: flex; align-items: center; gap: 0.3rem;
    }
    .status-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--gray); margin-right: 0.25rem;
    }
    .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .status-dot.offline { background: var(--accent); }

    .main-content {
      margin-left: var(--sidebar-w); flex: 1; padding: 1.5rem 2rem 3rem;
      max-width: 1500px;
    }
    .menu-toggle {
      display: none; position: fixed; top: 1rem; left: 1rem; z-index: 200;
      background: var(--dark); color: var(--white);
      border: none; border-radius: 10px; width: 42px; height: 42px;
      font-size: 1.3rem; cursor: pointer; box-shadow: var(--shadow);
    }
    @media (max-width: 900px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
      .main-content { margin-left: 0; padding: 1rem; padding-top: 4.5rem; }
      .menu-toggle { display: flex; align-items: center; justify-content: center; }
    }

    /* Topbar */
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;
    }
    .topbar-left h1 { font-size: 1.5rem; color: var(--dark); }
    .topbar-left p { font-size: 0.85rem; color: var(--gray); margin: 0; }
    .topbar-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      padding: 0.55rem 1rem; border-radius: var(--radius-sm); border: none;
      cursor: pointer; font-family: var(--font-head); font-weight: 600;
      font-size: 0.82rem; transition: all 0.15s; text-decoration: none;
      white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: var(--white); box-shadow: 0 2px 6px rgba(13,115,119,0.3); }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(13,115,119,0.4); }
    .btn-secondary { background: var(--secondary); color: var(--white); }
    .btn-secondary:hover { background: #1565C0; }
    .btn-accent { background: var(--accent); color: var(--white); }
    .btn-success { background: var(--success); color: var(--white); }
    .btn-outline { background: var(--white); color: var(--dark); border: 1.5px solid var(--gray-light); }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
    .btn-ghost { background: transparent; color: var(--gray); }
    .btn-ghost:hover { background: var(--gray-light); color: var(--dark); }
    .btn-danger { background: var(--accent); color: var(--white); }
    .btn-sm { padding: 0.4rem 0.75rem; font-size: 0.78rem; }
    .btn-lg { padding: 0.75rem 1.5rem; font-size: 0.9rem; }
    .btn-block { width: 100%; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-icon { width: 34px; height: 34px; padding: 0; border-radius: 8px; }

    /* Cards */
    .card {
      background: var(--white); border-radius: var(--radius);
      padding: 1.35rem; box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-light); margin-bottom: 1.25rem;
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;
    }
    .card-title { font-size: 1.05rem; font-weight: 700; color: var(--dark); margin: 0; }
    .card-subtitle { font-size: 0.8rem; color: var(--gray); margin: 0.15rem 0 0; }

    /* Stat cards */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 1rem; margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--white); border-radius: var(--radius);
      padding: 1.15rem; border: 1px solid var(--gray-light);
      box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
      transition: all 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
      background: var(--primary);
    }
    .stat-card.success::before { background: var(--success); }
    .stat-card.warning::before { background: var(--warning); }
    .stat-card.alert::before { background: var(--accent); }
    .stat-card.purple::before { background: var(--purple); }
    .stat-card .stat-icon {
      position: absolute; top: 1rem; right: 1rem;
      font-size: 1.5rem; opacity: 0.15;
    }
    .stat-card .stat-label {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--gray); font-weight: 600; margin-bottom: 0.35rem;
    }
    .stat-card .stat-value {
      font-size: 2rem; font-weight: 800; color: var(--dark);
      font-family: var(--font-head); line-height: 1; letter-spacing: -0.03em;
    }
    .stat-card .stat-sub {
      font-size: 0.75rem; color: var(--gray); margin-top: 0.35rem;
      display: flex; align-items: center; gap: 0.3rem;
    }
    .stat-card .stat-sub .trend-up { color: var(--success); font-weight: 700; }
    .stat-card .stat-sub .trend-down { color: var(--accent); font-weight: 700; }

    /* Tables */
    .table-wrap {
      overflow-x: auto; margin: 0 -1.35rem; padding: 0 1.35rem;
      border-radius: var(--radius-sm);
    }
    table {
      width: 100%; border-collapse: collapse; font-size: 0.85rem;
    }
    th {
      background: var(--light); color: var(--gray);
      padding: 0.7rem 0.75rem; text-align: left;
      font-family: var(--font-head); font-size: 0.7rem;
      text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700;
      border-bottom: 2px solid var(--gray-light);
      position: sticky; top: 0; z-index: 2;
    }
    td { padding: 0.7rem 0.75rem; border-bottom: 1px solid var(--gray-light); vertical-align: middle; }
    tr:hover td { background: var(--primary-light); }
    tr.alert-row td { background: var(--accent-light); }
    tr.alert-row:hover td { background: #FFCDD2; }

    /* Pills */
    .pill {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.2rem 0.6rem; border-radius: 999px;
      font-size: 0.72rem; font-weight: 600; font-family: var(--font-head);
      white-space: nowrap;
    }
    .pill-success { background: var(--success-light); color: #2E7D32; }
    .pill-warning { background: var(--warning-light); color: #E65100; }
    .pill-danger { background: var(--accent-light); color: #C62828; }
    .pill-info { background: var(--secondary-light); color: #1565C0; }
    .pill-gray { background: var(--gray-light); color: #455A64; }
    .pill-purple { background: var(--purple-light); color: #6A1B9A; }
    .pill-primary { background: var(--primary-light); color: var(--primary-dark); }

    /* Progress bar */
    .progress-bar {
      height: 6px; background: var(--gray-light); border-radius: 999px;
      overflow: hidden; min-width: 80px;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--success), var(--primary));
      border-radius: 999px; transition: width 0.4s ease;
    }
    .progress-fill.warn { background: linear-gradient(90deg, var(--warning), var(--accent)); }
    .progress-fill.danger { background: var(--accent); }

    /* Callouts */
    .callout {
      padding: 0.85rem 1.1rem; border-radius: var(--radius-sm); margin: 0.75rem 0;
      border-left: 4px solid; font-size: 0.85rem;
    }
    .callout-info { background: var(--secondary-light); border-color: var(--secondary); }
    .callout-success { background: var(--success-light); border-color: var(--success); }
    .callout-warning { background: var(--warning-light); border-color: var(--warning); }
    .callout-danger { background: var(--accent-light); border-color: var(--accent); }
    .callout strong { font-family: var(--font-head); font-weight: 700; }

    /* Code entry */
    .code-input-hero {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: var(--radius); padding: 2.5rem 2rem; text-align: center;
      color: var(--white); margin-bottom: 1.5rem; position: relative; overflow: hidden;
    }
    .code-input-hero::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.06) 0%, transparent 40%);
    }
    .code-input-hero > * { position: relative; z-index: 1; }
    .code-input-hero h2 { color: var(--white); font-size: 1.5rem; margin-bottom: 0.5rem; }
    .code-input-hero p { color: rgba(255,255,255,0.85); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .code-input-box {
      display: flex; gap: 0.5rem; max-width: 520px; margin: 0 auto;
      background: var(--white); border-radius: 12px; padding: 0.35rem;
      box-shadow: var(--shadow-lg);
    }
    .code-input-box input {
      flex: 1; border: none; padding: 0.75rem 1rem; font-size: 1.1rem;
      font-family: 'Courier New', monospace; font-weight: 700;
      text-transform: uppercase; letter-spacing: 3px;
      background: transparent; color: var(--dark);
    }
    .code-input-box input:focus { outline: none; }
    .code-input-box .btn { padding: 0.75rem 1.5rem; }
    .code-hint {
      margin-top: 1rem; font-size: 0.8rem; color: rgba(255,255,255,0.7);
    }
    .code-hint code {
      background: rgba(255,255,255,0.15); padding: 0.15rem 0.5rem;
      border-radius: 4px; font-family: 'Courier New', monospace;
      letter-spacing: 1px; font-weight: 700; color: var(--white);
    }

    /* Forms */
    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block; font-weight: 600; margin-bottom: 0.35rem;
      font-size: 0.8rem; font-family: var(--font-head); color: var(--dark-2);
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 0.6rem 0.85rem; border: 1.5px solid var(--gray-light);
      border-radius: var(--radius-sm); font-size: 0.88rem;
      transition: all 0.15s; background: var(--white); color: var(--dark);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13,115,119,0.1);
    }
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(26,32,39,0.6);
      display: none; align-items: center; justify-content: center;
      z-index: 1000; padding: 1rem; backdrop-filter: blur(4px);
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--white); border-radius: var(--radius);
      max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto;
      padding: 0; box-shadow: var(--shadow-lg);
      animation: slideUp 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--gray-light);
      position: sticky; top: 0; background: var(--white); z-index: 3;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .modal-header h2 { font-size: 1.15rem; color: var(--dark); }
    .modal-close {
      background: var(--light); border: none; font-size: 1.2rem;
      cursor: pointer; color: var(--gray); line-height: 1;
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .modal-close:hover { background: var(--accent-light); color: var(--accent); }
    .modal-body { padding: 1.5rem; }

    /* Toast */
    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: var(--dark); color: var(--white);
      padding: 0.85rem 1.25rem; border-radius: 10px;
      box-shadow: var(--shadow-lg); z-index: 999;
      transform: translateY(200%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      max-width: 380px; font-size: 0.85rem; font-weight: 500;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .toast.show { transform: translateY(0); }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--accent); }
    .toast.warning { background: var(--warning); }

    /* Tab navigation */
    .tabs {
      display: flex; gap: 0.25rem; margin-bottom: 1.25rem;
      border-bottom: 2px solid var(--gray-light); flex-wrap: wrap;
    }
    .tab {
      padding: 0.65rem 1.1rem; border: none; background: none;
      cursor: pointer; font-family: var(--font-head); font-weight: 600;
      font-size: 0.82rem; color: var(--gray);
      border-bottom: 2.5px solid transparent; margin-bottom: -2px;
      transition: all 0.15s; display: flex; align-items: center; gap: 0.4rem;
    }
    .tab:hover { color: var(--primary); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* Search */
    .search-box { position: relative; }
    .search-box input {
      width: 100%; padding: 0.6rem 0.9rem 0.6rem 2.4rem;
      border: 1.5px solid var(--gray-light); border-radius: var(--radius-sm);
      font-size: 0.85rem; transition: all 0.15s;
    }
    .search-box input:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13,115,119,0.1);
    }
    .search-box::before {
      content: '🔍'; position: absolute; left: 0.85rem; top: 50%;
      transform: translateY(-50%); font-size: 0.9rem; opacity: 0.5;
    }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 3rem 1.5rem; color: var(--gray);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 0.75rem; opacity: 0.4; }
    .empty-state h3 { color: var(--dark); font-size: 1rem; margin-bottom: 0.25rem; }
    .empty-state p { font-size: 0.85rem; }

    /* Code chip */
    .code-chip {
      font-family: 'Courier New', monospace; font-weight: 700;
      background: var(--primary-light); color: var(--primary-dark);
      padding: 0.3rem 0.7rem; border-radius: 6px;
      letter-spacing: 1px; font-size: 0.85rem;
      display: inline-flex; align-items: center; gap: 0.35rem;
      border: 1.5px dashed var(--primary);
      cursor: pointer; transition: all 0.15s;
    }
    .code-chip:hover { background: var(--primary); color: var(--white); }

    /* Student row */
    .student-name { font-weight: 700; color: var(--dark); font-size: 0.88rem; }
    .student-meta { font-size: 0.72rem; color: var(--gray); }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: var(--white); display: inline-flex;
      align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.78rem; flex-shrink: 0;
    }
    .avatar-lg { width: 56px; height: 56px; font-size: 1.2rem; }

    /* Charts */
    .bar-chart {
      display: flex; align-items: flex-end; gap: 0.6rem; height: 180px;
      padding: 1rem 0; border-bottom: 1px solid var(--gray-light);
    }
    .bar-chart .bar-wrap {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: flex-end; height: 100%;
    }
    .bar-chart .bar {
      width: 100%; max-width: 60px;
      background: linear-gradient(180deg, var(--primary), var(--secondary));
      border-radius: 6px 6px 0 0; transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 2px;
    }
    .bar-chart .bar-label {
      font-size: 0.68rem; margin-top: 0.5rem; text-align: center;
      color: var(--gray); font-weight: 600;
    }
    .bar-chart .bar-value {
      font-size: 0.78rem; font-weight: 800; color: var(--dark);
      margin-bottom: 0.35rem; font-family: var(--font-head);
    }

    /* Utilities */
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .mt-3 { margin-top: 1.5rem; }
    .mb-1 { margin-bottom: 0.5rem; }
    .mb-2 { margin-bottom: 1rem; }
    .flex { display: flex; }
    .flex-wrap { flex-wrap: wrap; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .items-start { align-items: flex-start; }
    .justify-between { justify-content: space-between; }
    .gap-1 { gap: 0.5rem; }
    .gap-2 { gap: 1rem; }
    .gap-3 { gap: 1.5rem; }
    .font-mono { font-family: 'Courier New', monospace; }
    .opacity-60 { opacity: 0.6; }
    .text-sm { font-size: 0.82rem; }
    .text-xs { font-size: 0.72rem; }
    .text-gray { color: var(--gray); }
    .font-bold { font-weight: 700; }
    code {
      background: var(--light); padding: 0.15rem 0.4rem;
      border-radius: 4px; font-family: 'Courier New', monospace;
      font-size: 0.85em; color: var(--primary-dark); font-weight: 600;
    }

    /* QR */
    .qr-scanner-container {
      position: relative; width: 100%; max-width: 400px; margin: 1rem auto;
      background: #000; border-radius: var(--radius); overflow: hidden;
      aspect-ratio: 1; box-shadow: var(--shadow-lg);
    }
    #qrVideo { width: 100%; height: 100%; object-fit: cover; display: block; }
    .qr-overlay {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center; pointer-events: none;
    }
    .qr-frame {
      width: 70%; height: 70%; max-width: 280px; max-height: 280px;
      border: 3px solid #FFFFFF; border-radius: 16px; position: relative;
      box-shadow: 0 0 0 4000px rgba(0,0,0,0.4);
    }
    .qr-frame::before, .qr-frame::after {
      content: ''; position: absolute; width: 28px; height: 28px;
      border-color: var(--success); border-style: solid;
    }
    .qr-frame::before { top: -3px; left: -3px; border-width: 4px 0 0 4px; border-radius: 16px 0 0 0; }
    .qr-frame::after { bottom: -3px; right: -3px; border-width: 0 4px 4px 0; border-radius: 0 0 16px 0; }
    .qr-scan-line {
      position: absolute; left: 0; right: 0; top: 50%; height: 3px;
      background: linear-gradient(90deg, transparent, var(--success), transparent);
      animation: scanline 2s linear infinite;
    }
    @keyframes scanline { 0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; } }
    .qr-status {
      text-align: center; padding: 0.75rem; font-size: 0.85rem;
      color: var(--gray); min-height: 40px;
    }
    .qr-status.active { color: var(--success); font-weight: 600; }
    .qr-status.error { color: var(--accent); font-weight: 600; }
    .qr-upload-preview {
      max-width: 100%; max-height: 280px; border-radius: var(--radius-sm);
      margin: 1rem auto; display: block; box-shadow: var(--shadow);
    }

    /* Feedback */
    .feedback-card {
      background: linear-gradient(135deg, var(--warning-light), #FFFDE7);
      border-left: 4px solid var(--warning);
      padding: 1rem 1.15rem; border-radius: var(--radius-sm);
      margin-bottom: 0.85rem;
    }
    .feedback-card .feedback-meta { font-size: 0.75rem; color: var(--gray); }
    .feedback-card .feedback-body { margin-top: 0.5rem; font-size: 0.88rem; }
    .feedback-card .feedback-rating { font-size: 0.9rem; color: #FFC107; }

    /* Retake code display */
    .retake-code-box {
      background: var(--white); padding: 1.25rem;
      border-radius: var(--radius-sm); border: 3px dashed var(--purple);
      margin: 1rem 0; text-align: center;
    }
    .retake-code-box .code-label {
      font-size: 0.7rem; color: var(--gray); text-transform: uppercase;
      letter-spacing: 1.5px; margin-bottom: 0.35rem; font-weight: 700;
    }
    .retake-code-box .code-value {
      font-family: 'Courier New', monospace; font-size: 2rem;
      font-weight: 700; color: var(--purple); letter-spacing: 5px;
      margin-bottom: 0.75rem;
    }

    /* Import method cards */
    .method-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem; margin-bottom: 1.5rem;
    }
    .method-card {
      background: var(--white); border: 2px solid var(--gray-light);
      border-radius: var(--radius); padding: 1.25rem; text-align: center;
      cursor: pointer; transition: all 0.2s; position: relative;
    }
    .method-card:hover {
      border-color: var(--primary); transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .method-card.active {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .method-card .method-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .method-card .method-title {
      font-family: var(--font-head); font-weight: 700;
      font-size: 0.9rem; color: var(--dark); margin-bottom: 0.25rem;
    }
    .method-card .method-desc {
      font-size: 0.75rem; color: var(--gray); line-height: 1.4;
    }

    /* Preview box */
    .preview-box {
      background: var(--success-light); border: 2px solid var(--success);
      border-radius: var(--radius); padding: 1.25rem; margin-top: 1.25rem;
    }
    .preview-box .preview-title {
      font-family: var(--font-head); font-weight: 700;
      color: var(--success); margin-bottom: 0.85rem;
      font-size: 0.95rem; display: flex; align-items: center; gap: 0.4rem;
    }
    .preview-box table { background: transparent; margin-bottom: 0.75rem; }
    .preview-box td { border: none; padding: 0.35rem 0.5rem; font-size: 0.85rem; }
    .preview-box tr:hover td { background: transparent; }
    .preview-box td:first-child { width: 180px; color: var(--gray); font-weight: 600; }

    /* Sync indicator */
    .sync-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--white); padding: 0.65rem 1rem;
      border-radius: var(--radius-sm); border: 1px solid var(--gray-light);
      margin-bottom: 1rem; font-size: 0.78rem; color: var(--gray);
    }
    .sync-bar .sync-status { display: flex; align-items: center; gap: 0.4rem; }
    .sync-bar .sync-time { font-style: italic; }

    @media print {
      .sidebar, .menu-toggle, .btn, .no-print, .tabs { display: none !important; }
      .main-content { margin-left: 0; padding: 0; }
      .card { box-shadow: none; border: 1px solid #CCC; page-break-inside: avoid; }
      body { background: white; }
    }
  </style>
</head>

<script>
/* ============================================================
   INSTRUCTOR DASHBOARD — v2.0
   Now with Google Sheets backend integration
   ============================================================ */

// ⚠️ REPLACE WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyDsm4y4UltoqUd-qtbS2gCD7AF7LAD_9NiJpsoLJUUBO-5japcORH1YRgGZagqhXAO/exec';

var DB = {
  localKey: 'respMastery_instructor_v2',
  state: {
    students: [],
    settings: {
      passingScore: 90,
      atRiskThreshold: 75,
      examPassingScore: 15,
      inactiveDays: 7,
      courseName: 'NCM 101B Lab — Respiratory Assessment',
      instructorName: 'JEMUEL C. MARI, MAN, RN, LPT'
    },
    activityLog: [],
    lastSync: null
  }
};

var PENDING_IMPORTS = {};
var QRScanner = {
  stream: null, videoEl: null, canvasEl: null, canvasCtx: null,
  rafId: null, active: false, lastScanAt: 0, cooldownMs: 1500
};
var currentImportMethod = 'code';

/* ---------- PERSISTENCE ---------- */
function loadLocal() {
  try {
    var raw = localStorage.getItem(DB.localKey);
    if (raw) {
      var parsed = JSON.parse(raw);
      DB.state = Object.assign({}, DB.state, parsed);
      DB.state.settings = Object.assign({}, DB.state.settings, parsed.settings || {});
    }
  } catch (e) { console.warn('Local load failed', e); }
}
function saveLocal() {
  try { localStorage.setItem(DB.localKey, JSON.stringify(DB.state)); } catch (e) {}
}

/* ---------- UTILITIES ---------- */
function uid() { return 'S' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}
function fmtDateTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function timeAgo(iso) {
  if (!iso) return '—';
  var sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (sec < 60) return 'just now';
  if (sec < 3600) return Math.floor(sec/60) + 'm ago';
  if (sec < 86400) return Math.floor(sec/3600) + 'h ago';
  return Math.floor(sec/86400) + 'd ago';
}
function toast(msg, type) {
  type = type || '';
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.classList.remove('show'); }, 3000);
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}
function initialsOf(name) {
  if (!name) return '?';
  var parts = String(name).trim().split(/\s+/);
  var first = (parts[0] || '')[0] || '';
  var last = (parts[parts.length-1] || '')[0] || '';
  return (first + last).toUpperCase() || '?';
}

/* ---------- BACKEND COMMUNICATION ---------- */
async function checkBackend() {
  var dot = document.getElementById('backendStatus');
  var text = document.getElementById('backendStatusText');
  try {
    var res = await fetch(BACKEND_URL + '?action=ping', { method: 'GET' });
    var data = await res.json();
    if (data.success) {
      dot.className = 'status-dot online';
      text.textContent = 'Online';
      return true;
    }
  } catch (e) { console.warn('Backend ping failed', e); }
  dot.className = 'status-dot offline';
  text.textContent = 'Offline';
  return false;
}

async function backendGet(params) {
  var qs = new URLSearchParams(params).toString();
  var res = await fetch(BACKEND_URL + '?' + qs, { method: 'GET' });
  return await res.json();
}

async function backendPost(params) {
  var body = new URLSearchParams(params);
  var res = await fetch(BACKEND_URL, { method: 'POST', body: body });
  return await res.json();
}

async function fetchByCode(code) {
  return backendGet({ action: 'getByCode', code: code });
}

async function fetchAllSubmissions() {
  return backendGet({ action: 'listAll' });
}

async function fetchFeedback() {
  return backendGet({ action: 'listFeedback' });
}

async function saveToRoster(record) {
  return backendPost({
    action: 'saveToRoster',
    record: JSON.stringify(record)
  });
}

async function grantRetakeBackend(studentId, studentName, reason, grantedBy) {
  return backendPost({
    action: 'grantRetake',
    studentId: studentId,
    studentName: studentName,
    reason: reason,
    grantedBy: grantedBy
  });
}

async function revokeRetakeBackend(code) {
  return backendPost({ action: 'revokeRetake', retakeCode: code });
}

/* ---------- STUDENT MODEL ---------- */
function getStudentPercent(s) {
  if (typeof s.unitsCompleted === 'number') return s.unitsCompleted;
  var units = ['unit1','unit2','unit3','unit4','unit5','unit6','unit7'];
  var done = units.filter(function(u) { return s.progress && s.progress[u] && s.progress[u].completed; }).length;
  return Math.round((done / units.length) * 100);
}
function getUnitAverageOnly(s) {
  if (typeof s.unitAvg === 'number') return s.unitAvg;
  if (typeof s.unitAvg === 'string') return parseInt(s.unitAvg, 10) || 0;
  var all = [];
  Object.values(s.quizAttempts || {}).forEach(function(arr) {
    arr.forEach(function(x) { if (typeof x === 'number') all.push(x); });
  });
  if (!all.length) return 0;
  return Math.round(all.reduce(function(a, b) { return a + b; }, 0) / all.length);
}
function getStudentAverage(s) {
  var unitAvg = getUnitAverageOnly(s);
  var examPct = s.examPercentage || (s.exam && s.exam.percentage);
  if (examPct) return Math.round((unitAvg + examPct) / 2);
  return unitAvg;
}
function getExamScore(s) { return s.examScore || (s.exam && s.exam.score) || null; }
function getExamTotal(s) { return s.examTotal || (s.exam && s.exam.total) || 30; }
function getExamPercent(s) { return s.examPercentage || (s.exam && s.exam.percentage) || null; }
function isExamPassed(s) {
  var p = s.examPassed || (s.exam && s.exam.passed);
  return p === true || p === 'PASSED' || p === 'TRUE';
}
function getIntegrityFlagCount(s) {
  if (typeof s.integrityFlags === 'number') return s.integrityFlags;
  if (typeof s.integrityFlags === 'string') return parseInt(s.integrityFlags, 10) || 0;
  var i = s.exam && s.exam.integrity;
  if (!i) return 0;
  return ((i.focusLosses && i.focusLosses.length) || 0) + (i.copyAttempts || 0) + (i.rightClicks || 0) + (i.printAttempts || 0);
}
function hasActiveRetake(s) {
  return (s.retakeActive === 'YES' || s.retakeActive === true || s.retakeAllowed) &&
         !s.retakeUsed &&
         (s.retakeCode || s.retake_code);
}
function getRetakeCode(s) { return s.retakeCode || s.retake_code || null; }

function getStudentStatus(s) {
  var pct = getStudentPercent(s);
  var avg = getStudentAverage(s);
  var examPassed = isExamPassed(s);
  var examTaken = s.examTakenAt || (s.exam && s.exam.submitted);
  if (pct === 100 && avg >= DB.state.settings.passingScore && examPassed) return { label: 'Mastered', cls: 'pill-success' };
  if (pct === 100 && examTaken && !examPassed && !hasActiveRetake(s)) return { label: 'Exam Failed', cls: 'pill-danger' };
  if (hasActiveRetake(s)) return { label: 'Retake Pending', cls: 'pill-purple' };
  if (pct >= 50) return { label: 'In Progress', cls: 'pill-info' };
  if (pct > 0) return { label: 'At Risk', cls: 'pill-warning' };
  return { label: 'Not Started', cls: 'pill-gray' };
}
function isAtRisk(s) {
  var pct = getStudentPercent(s);
  var avg = getStudentAverage(s);
  if (pct > 0 && pct < DB.state.settings.atRiskThreshold) return true;
  if (avg > 0 && avg < DB.state.settings.atRiskThreshold) return true;
  if (s.examTakenAt && !isExamPassed(s) && !hasActiveRetake(s)) return true;
  return false;
}
function findExistingStudent(studentNo, email) {
  if (!studentNo && !email) return null;
  return DB.state.students.find(function(x) {
    var matchNo = studentNo && x.studentNo && String(x.studentNo).trim() === String(studentNo).trim();
    var matchEmail = email && x.email && String(x.email).trim().toLowerCase() === String(email).trim().toLowerCase();
    return matchNo || matchEmail;
  });
}

function getAlertList() {
  var alerts = [];
  DB.state.students.forEach(function(s) {
    var pct = getStudentPercent(s);
    var avg = getStudentAverage(s);
    if (pct > 0 && pct < DB.state.settings.atRiskThreshold) {
      alerts.push({ student: s, type: 'Low Progress', detail: 'Only ' + pct + '% of units completed.', severity: 'warning' });
    }
    if (avg > 0 && avg < DB.state.settings.atRiskThreshold) {
      alerts.push({ student: s, type: 'Low Average', detail: 'Average score ' + avg + '% — below threshold.', severity: 'warning' });
    }
    if (avg > 0 && avg < 60) {
      alerts.push({ student: s, type: 'Critical Score', detail: 'Average score ' + avg + '% — urgent remediation needed.', severity: 'danger' });
    }
    if (s.examTakenAt && !isExamPassed(s) && !hasActiveRetake(s)) {
      alerts.push({ student: s, type: 'Exam Failed', detail: 'Score: ' + getExamScore(s) + '/' + getExamTotal(s) + ' — no active retake.', severity: 'danger' });
    }
    if (getIntegrityFlagCount(s) >= 3) {
      alerts.push({ student: s, type: 'Integrity Flags', detail: getIntegrityFlagCount(s) + ' integrity events logged during exam.', severity: 'warning' });
    }
    if (hasActiveRetake(s)) {
      alerts.push({ student: s, type: 'Retake Granted', detail: 'Retake code ' + getRetakeCode(s) + ' is active.', severity: 'info' });
    }
  });
  return alerts;
}

/* ---------- NAVIGATION ---------- */
function navigate(view) {
  if (view !== 'import') stopQRScanner();
  document.querySelectorAll('.nav-item').forEach(function(n) {
    n.classList.toggle('active', n.dataset.view === view);
  });
  renderView(view);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  document.getElementById('sidebar').classList.remove('open');
}

function renderView(view) {
  var main = document.getElementById('mainContent');
  main.innerHTML = '<div style="padding:3rem;text-align:center;color:var(--gray);">Loading...</div>';
  setTimeout(function() {
    switch (view) {
      case 'overview': return renderOverview(main);
      case 'alerts': return renderAlerts(main);
      case 'import': return renderImport(main);
      case 'roster': return renderRoster(main);
      case 'exams': return renderExams(main);
      case 'retakes': return renderRetakes(main);
      case 'feedback': return renderFeedbackInbox(main);
      case 'analytics': return renderAnalytics(main);
      case 'units': return renderUnitBreakdown(main);
      case 'reports': return renderReports(main);
      case 'export': return renderExport(main);
      case 'settings': return renderSettings(main);
      case 'help': return renderHelp(main);
      default: return renderOverview(main);
    }
  }, 80);
}

/* ============================================================
   OVERVIEW
   ============================================================ */
function renderOverview(main) {
  var students = DB.state.students;
  var total = students.length;
  var mastered = students.filter(function(s) { return getStudentStatus(s).label === 'Mastered'; }).length;
  var inProgress = students.filter(function(s) { return getStudentStatus(s).label === 'In Progress'; }).length;
  var atRisk = students.filter(function(s) { return isAtRisk(s); }).length;
  var examsTaken = students.filter(function(s) { return s.examTakenAt; }).length;
  var examsPassed = students.filter(function(s) { return isExamPassed(s); }).length;
  var retakesPending = students.filter(function(s) { return hasActiveRetake(s); }).length;
  var alerts = getAlertList();
  var lastSync = DB.state.lastSync;

  var html = '';
  html += '<div class="topbar">';
  html += '<div class="topbar-left"><h1>📊 Overview</h1>';
  html += '<p>Real-time snapshot of your class performance</p></div>';
  html += '<div class="topbar-actions">';
  html += '<button class="btn btn-outline btn-sm" onclick="syncFromBackend()">🔄 Sync from Sheet</button>';
  html += '<button class="btn btn-primary btn-sm" onclick="navigate(\'import\')">📥 Import Student</button>';
  html += '</div></div>';

  // Sync bar
  html += '<div class="sync-bar"><div class="sync-status"><span class="status-dot online"></span><span>Connected to Google Sheets backend</span></div>';
  html += '<div class="sync-time">Last synced: ' + (lastSync ? timeAgo(lastSync) : 'never') + '</div></div>';

  // Stat cards
  html += '<div class="stats-grid">';
  html += statCard('Total Students', total, '👥', '');
  html += statCard('Mastered', mastered, '🏆', 'success');
  html += statCard('In Progress', inProgress, '📚', '');
  html += statCard('At Risk', atRisk, '⚠️', 'warning');
  html += statCard('Active Alerts', alerts.length, '🚨', 'alert');
  html += '</div>';

  // Exam stats
  html += '<div class="card"><div class="card-header"><div>';

function statCard(label, value, icon, colorClass) {
  return '<div class="stat-card ' + (colorClass || '') + '">' +
    '<div class="stat-icon">' + icon + '</div>' +
    '<div class="stat-label">' + label + '</div>' +
    '<div class="stat-value">' + value + '</div>' +
    '</div>';
}

function renderDistributionChart(students) {
  var buckets = [
    { label: '0%', min: 0, max: 0 },
    { label: '1-25%', min: 1, max: 25 },
    { label: '26-50%', min: 26, max: 50 },
    { label: '51-75%', min: 51, max: 75 },
    { label: '76-99%', min: 76, max: 99 },
    { label: '100%', min: 100, max: 100 }
  ];
  var counts = buckets.map(function(b) {
    return students.filter(function(s) {
      var p = getStudentPercent(s);
      return p >= b.min && p <= b.max;
    }).length;
  });
  var max = Math.max.apply(null, counts.concat([1]));
  var html = '<div class="bar-chart">';
  buckets.forEach(function(b, i) {
    var pct = Math.round((counts[i] / max) * 100);
    var bg = i >= 4 ? 'linear-gradient(180deg,var(--success),#2E7D32)' : (i >= 2 ? 'linear-gradient(180deg,var(--primary),var(--secondary))' : 'linear-gradient(180deg,var(--warning),var(--accent))');
    html += '<div class="bar-wrap">';
    html += '<div class="bar-value">' + counts[i] + '</div>';
    html += '<div class="bar" style="height:' + pct + '%;background:' + bg + ';"></div>';
    html += '<div class="bar-label">' + b.label + '</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderRecentActivity() {
  var log = DB.state.activityLog.slice(-8).reverse();
  if (!log.length) return '<p class="text-gray text-sm">No activity yet.</p>';
  var html = '<div class="table-wrap"><table><thead><tr><th>Time</th><th>Student</th><th>Action</th></tr></thead><tbody>';
  log.forEach(function(l) {
    var s = DB.state.students.find(function(x) { return x.id === l.studentId; });
    html += '<tr><td class="text-xs">' + timeAgo(l.ts) + '</td>';
    html += '<td><strong>' + escapeHtml(s ? s.name : '—') + '</strong></td>';
    html += '<td class="text-xs">' + escapeHtml(l.action) + '</td></tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function attachImportMethodHandlers(method) {
  if (method === 'code') {
    var input = document.getElementById('manualCodeInput');
    if (input) {
      input.addEventListener('input', function() { input.value = input.value.toUpperCase(); });
      input.addEventListener('keydown', function(e) { if (e.key === 'Enter') submitManualCode(); });
    }
  }
  if (method === 'qr-camera') {
    if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
      navigator.mediaDevices.enumerateDevices().then(function(devices) {
        var cams = devices.filter(function(d) { return d.kind === 'videoinput'; });
        if (cams.length > 1) {
          var sel = document.getElementById('qrCameraSelect');
          if (sel) {
            sel.innerHTML = cams.map(function(c, i) {
              return '<option value="' + c.deviceId + '">' + (c.label || 'Camera ' + (i+1)) + '</option>';
            }).join('');
            sel.style.display = 'block';
            sel.addEventListener('change', function() {
              if (QRScanner.active) stopQRScanner().then(function() { startQRScanner(); });
            });
          }
        }
      }).catch(function() {});
    }
  }
  if (method === 'qr-upload') {
    var dz = document.getElementById('qrImageDropZone');
    var fi = document.getElementById('qrImageInput');
    if (!dz || !fi) return;
    dz.addEventListener('click', function() { fi.click(); });
    dz.addEventListener('dragover', function(e) { e.preventDefault(); dz.style.background = 'var(--secondary-light)'; });
    dz.addEventListener('dragleave', function() { dz.style.background = 'var(--primary-light)'; });
    dz.addEventListener('drop', function(e) {
      e.preventDefault();
      dz.style.background = 'var(--primary-light)';
      if (e.dataTransfer.files.length) handleQRImage(e.dataTransfer.files[0]);
    });
    fi.addEventListener('change', function(e) {
      if (e.target.files.length) handleQRImage(e.target.files[0]);
    });
  }
}

async function fetchAndPreview(code, targetEl) {
  if (targetEl) targetEl.innerHTML = '<div class="callout callout-info">⏳ Fetching...</div>';
  try {
    var result = await fetchByCode(code);
    if (!result.success) {
      var errHtml = '<div class="callout callout-danger"><strong>❌ ' + escapeHtml(result.error || 'Code not found') + '</strong><br>Check the code and try again.</div>';
      if (targetEl) targetEl.innerHTML = errHtml;
      else toast('Code not found.', 'error');
      return;
    }
    // Show preview
    if (targetEl) {
      targetEl.innerHTML = '';
      renderImportPreview(result.record, targetEl);
    } else {
      showImportPreviewModal(result.record);
    }
  } catch (err) {
    var errHtml = '<div class="callout callout-danger"><strong>❌ Connection error</strong><br>' + escapeHtml(err.message) + '</div>';
    if (targetEl) targetEl.innerHTML = errHtml;
    else toast('Connection error.', 'error');
  }
}

async function confirmImportFromRecord(code, mode, existingId) {
  // Fetch the full record again to make sure we have the latest
  var result = await fetchByCode(code);
  if (!result.success) return toast('Could not re-fetch record.', 'error');
  var record = result.record;
  var payload = record.payload || {};
  var s = payload.student || {
    fullName: record.fullName,
    studentNo: record.studentNo,
    section: record.section,
    group: record.group,
    email: record.email
  };

  if (mode === 'new') {
    var dup = findExistingStudent(s.studentNo, s.email);
    if (dup) {
      if (!confirm('A student with same Student No/Email already exists:\n' + dup.name + '\n\nUpdate existing record?')) return;
      mode = 'update';
      existingId = dup.id;
    }
  }

  var existing = (mode === 'update' && existingId) ? DB.state.students.find(function(x) { return x.id === existingId; }) : null;

  var studentRecord = {
    id: existing ? existing.id : uid(),
    name: s.fullName,
    studentNo: s.studentNo || '',
    section: s.section || '',
    group: s.group || '',
    email: s.email || '',
    enrolled: existing ? existing.enrolled : todayISO(),
    unitsCompleted: record.unitsCompleted || '0%',
    unitAvg: record.unitAvg || '0%',
    examScore: record.examScore || null,
    examTotal: record.examTotal || null,
    examPercentage: record.examPercentage || null,
    examPassed: record.examPassed || '',
    examTakenAt: record.timestamp || null,
    integrityFlags: record.integrityFlags || 0,
    retakeActive: existing ? existing.retakeActive : 'NO',
    retakeCode: existing ? existing.retakeCode : null,
    retakeUsed: existing ? existing.retakeUsed : false,
    appVersion: record.appVersion || '2.0',
    lastActive: record.timestamp,
    submissionCode: record.code,
    notes: existing ? existing.notes : 'Imported via code ' + record.code
  };

  if (mode === 'update' && existingId) {
    var idx = DB.state.students.findIndex(function(x) { return x.id === existingId; });
    if (idx >= 0) {
      DB.state.students[idx] = studentRecord;
      logActivity(existingId, 'Updated via code ' + code, studentRecord.name);
      toast('✅ Student updated.', 'success');
    }
  } else {
    DB.state.students.push(studentRecord);
    logActivity(studentRecord.id, 'Imported via code ' + code, studentRecord.name);
    toast('✅ Student added to roster.', 'success');
  }

  saveLocal();
  updateAlertBadge();
  closeModal();
  navigate('roster');
}

async function syncFromBackend() {
  var target = document.getElementById('syncResult');
  if (target) target.innerHTML = '<div class="callout callout-info">⏳ Syncing from Google Sheets...</div>';
  toast('⏳ Syncing...', 'info');

  try {
    var result = await fetchAllSubmissions();
    if (!result.success) {
      if (target) target.innerHTML = '<div class="callout callout-danger">❌ ' + escapeHtml(result.error) + '</div>';
      return;
    }

    var added = 0, updated = 0;
    result.records.forEach(function(rec) {
      var payload = null;
      try { payload = JSON.parse(rec.dataJson); } catch (e) {}
      var s = (payload && payload.student) || {
        fullName: rec.fullName, studentNo: rec.studentNo, section: rec.section,
        group: rec.group, email: rec.email
      };

      var existing = findExistingStudent(s.studentNo, s.email);
      var studentRecord = {
        id: existing ? existing.id : uid(),
        name: s.fullName,
        studentNo: s.studentNo || '',
        section: s.section || '',
        group: s.group || '',
        email: s.email || '',
        enrolled: existing ? existing.enrolled : todayISO(),
        unitsCompleted: rec.unitsCompleted || '0%',
        unitAvg: rec.unitAvg || '0%',
        examScore: rec.examScore || null,
        examTotal: rec.examTotal || null,
        examPercentage: rec.examPercentage || null,
        examPassed: rec.examPassed || '',
        examTakenAt: rec.timestamp || null,
        integrityFlags: rec.integrityFlags || 0,
        retakeActive: existing ? existing.retakeActive : 'NO',
        retakeCode: existing ? existing.retakeCode : null,
        retakeUsed: existing ? existing.retakeUsed : false,
        appVersion: rec.appVersion || '2.0',
        lastActive: rec.timestamp,
        submissionCode: rec.code,
        notes: existing ? existing.notes : 'Synced from Sheet'
      };

      if (existing) {
        var idx = DB.state.students.findIndex(function(x) { return x.id === existing.id; });
        if (idx >= 0) { DB.state.students[idx] = studentRecord; updated++; }
      } else {
        DB.state.students.push(studentRecord);
        logActivity(studentRecord.id, 'Synced from Sheet', studentRecord.name);
        added++;
      }
    });

    DB.state.lastSync = new Date().toISOString();
    saveLocal();
    updateAlertBadge();

    var msg = '✅ Sync complete! Added: ' + added + ', Updated: ' + updated;
    if (target) target.innerHTML = '<div class="callout callout-success">' + msg + '</div>';
    toast(msg, 'success');

    if (!target) navigate('roster');
  } catch (err) {
    if (target) target.innerHTML = '<div class="callout callout-danger">❌ ' + escapeHtml(err.message) + '</div>';
    toast('Sync failed.', 'error');
  }
}

/* ---------- QR SCANNER ---------- */
async function startQRScanner() {
  var container = document.getElementById('qrScannerContainer');
  var video = document.getElementById('qrVideo');
  var startBtn = document.getElementById('qrStartBtn');
  var stopBtn = document.getElementById('qrStopBtn');
  var switchBtn = document.getElementById('qrSwitchBtn');
  var statusEl = document.getElementById('qrStatus');
  var resultEl = document.getElementById('qrResult');
  if (!container || !video) return;
  if (resultEl) resultEl.innerHTML = '';

  try {
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      throw new Error('Camera requires HTTPS');
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Camera not supported');
    }
    var camSelect = document.getElementById('qrCameraSelect');
    var deviceId = camSelect && camSelect.value ? camSelect.value : undefined;
    var constraints = {
      video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    };
    statusEl.className = 'qr-status active';
    statusEl.textContent = '⏳ Requesting camera access...';
    var stream = await navigator.mediaDevices.getUserMedia(constraints);
    QRScanner.stream = stream;
    QRScanner.videoEl = video;
    QRScanner.active = true;
    video.srcObject = stream;
    await video.play();
    container.style.display = 'block';
    if (startBtn) startBtn.classList.add('hidden');
    if (stopBtn) stopBtn.classList.remove('hidden');
    if (switchBtn) switchBtn.style.display = 'inline-flex';
    statusEl.className = 'qr-status active';
    statusEl.textContent = '📷 Scanning... Point at a QR code';
    var canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    QRScanner.canvasEl = canvas;
    QRScanner.canvasCtx = canvas.getContext('2d', { willReadFrequently: true });
    scanFrame();
  } catch (err) {
    console.error('QR error:', err);
    statusEl.className = 'qr-status error';
    statusEl.textContent = '❌ ' + (err.message || 'Could not start camera');
    toast('Camera error.', 'error');
  }
}

function scanFrame() {
  if (!QRScanner.active) return;
  var video = QRScanner.videoEl;
  var canvas = QRScanner.canvasEl;
  var ctx = QRScanner.canvasCtx;
  if (!video || !canvas || !ctx) return;
  if (video.readyState !== video.HAVE_ENOUGH_DATA) {
    QRScanner.rafId = requestAnimationFrame(scanFrame);
    return;
  }
  if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  if (window.jsQR) {
    var code = window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
    if (code && code.data) {
      var now = Date.now();
      if (now - QRScanner.lastScanAt > QRScanner.cooldownMs) {
        QRScanner.lastScanAt = now;
        handleQRDecoded(code.data);
      }
    }
  }
  QRScanner.rafId = requestAnimationFrame(scanFrame);
}

function stopQRScanner() {
  QRScanner.active = false;
  if (QRScanner.rafId) { cancelAnimationFrame(QRScanner.rafId); QRScanner.rafId = null; }
  if (QRScanner.stream) {
    QRScanner.stream.getTracks().forEach(function(t) { t.stop(); });
    QRScanner.stream = null;
  }
  var video = document.getElementById('qrVideo');
  if (video) video.srcObject = null;
  var container = document.getElementById('qrScannerContainer');
  if (container) container.style.display = 'none';
  var startBtn = document.getElementById('qrStartBtn');
  var stopBtn = document.getElementById('qrStopBtn');
  var switchBtn = document.getElementById('qrSwitchBtn');
  var statusEl = document.getElementById('qrStatus');
  if (startBtn) startBtn.classList.remove('hidden');
  if (stopBtn) stopBtn.classList.add('hidden');
  if (switchBtn) switchBtn.style.display = 'none';
  if (statusEl) { statusEl.className = 'qr-status'; statusEl.textContent = 'Click "Start Camera" to begin scanning'; }
  return Promise.resolve();
}

async function switchQRCamera() {
  var sel = document.getElementById('qrCameraSelect');
  if (!sel) return;
  var cams = Array.from(sel.options);
  if (cams.length < 2) return;
  sel.selectedIndex = (sel.selectedIndex + 1) % cams.length;
  await stopQRScanner();
  await startQRScanner();
}

async function handleQRDecoded(qrData) {
  // QR may contain a code directly (RA-XXXX-XXXX) or Base64 JSON
  var str = String(qrData).trim();
  var resultEl = document.getElementById('qrResult');

  // Try direct code first
  var codeMatch = str.match(/RA-\d{4}-\d{4}/i);
  if (codeMatch) {
    var code = codeMatch[0].toUpperCase();
    if (resultEl) resultEl.innerHTML = '<div class="callout callout-info">⏳ Found code: ' + code + ' — fetching...</div>';
    await fetchAndPreview(code, resultEl);
    return;
  }

  // Try Base64 JSON → extract submission code
  try {
    var json = decodeURIComponent(escape(atob(str)));
    var parsed = JSON.parse(json);
    if (parsed.submissionCode) {
      if (resultEl) resultEl.innerHTML = '<div class="callout callout-info">⏳ Found code: ' + parsed.submissionCode + ' — fetching...</div>';
      await fetchAndPreview(parsed.submissionCode, resultEl);
      return;
    }
  } catch (e) {}

  if (resultEl) resultEl.innerHTML = '<div class="callout callout-danger">❌ QR does not contain a valid submission code</div>';
  toast('Invalid QR code.', 'error');
}

function handleQRImage(file) {
  var statusEl = document.getElementById('qrImageStatus');
  var previewEl = document.getElementById('qrImagePreview');
  var resultEl = document.getElementById('qrImageResult');
  if (!file) return;
  statusEl.className = 'qr-status';
  statusEl.textContent = '⏳ Reading image...';
  previewEl.innerHTML = '';
  resultEl.innerHTML = '';
  if (!file.type.startsWith('image/')) {
    statusEl.className = 'qr-status error';
    statusEl.textContent = '❌ Please upload an image file';
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      previewEl.innerHTML = '<img src="' + e.target.result + '" class="qr-upload-preview" alt="Uploaded QR" />';
      var canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      var ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      if (!window.jsQR) {
        statusEl.className = 'qr-status error';
        statusEl.textContent = '❌ QR library not loaded';
        return;
      }
      var code = window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'attemptBoth' });
      if (!code) {
        var scale = Math.min(2, 1500 / Math.max(canvas.width, canvas.height));
        if (scale > 1) {
          var scaled = document.createElement('canvas');
          scaled.width = Math.round(canvas.width * scale);
          scaled.height = Math.round(canvas.height * scale);
          var sctx = scaled.getContext('2d', { willReadFrequently: true });
          sctx.imageSmoothingEnabled = false;
          sctx.drawImage(canvas, 0, 0, scaled.width, scaled.height);
          var sdata = sctx.getImageData(0, 0, scaled.width, scaled.height);
          code = window.jsQR(sdata.data, sdata.width, sdata.height, { inversionAttempts: 'attemptBoth' });
        }
      }
      if (code && code.data) {
        statusEl.className = 'qr-status active';
        statusEl.textContent = '✅ QR decoded';
        handleQRDecoded(code.data);
      } else {
        statusEl.className = 'qr-status error';
        statusEl.textContent = '❌ Could not read QR code. Try a clearer image.';
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

}

function copyText(txt) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(function() { toast('✅ Copied!', 'success'); })
      .catch(function() { fallbackCopy(txt); });
  } else {
    fallbackCopy(txt);
  }
}
function fallbackCopy(txt) {
  var ta = document.createElement('textarea');
  ta.value = txt;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('✅ Copied!', 'success'); }
  catch (e) { toast('Copy: ' + txt, 'warning'); }
  document.body.removeChild(ta);
}

async function confirmGrantRetake(studentId) {
  var s = DB.state.students.find(function(x) { return x.id === studentId; });
  if (!s) return;
  var reason = document.getElementById('retakeReason').value;
  if (!reason) return toast('Please select a reason.', 'warning');
  var grantedBy = document.getElementById('retakeGrantedBy').value.trim();
  if (!grantedBy) return toast('Please enter who is granting.', 'warning');
  var notes = document.getElementById('retakeNotes').value.trim();
  if (notes) reason += ' — ' + notes;

  var btn = event && event.target ? event.target : null;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Granting...'; }

  try {
    var result = await grantRetakeBackend(studentId, s.name, reason, grantedBy);
    if (!result.success) throw new Error(result.error || 'Failed');

    s.retakeActive = 'YES';
    s.retakeCode = result.retakeCode;
    s.retakeUsed = false;
    logActivity(studentId, 'Retake granted', 'Code: ' + result.retakeCode + ' — Reason: ' + reason);
    saveLocal();
    toast('✅ Retake granted! Code: ' + result.retakeCode, 'success');
    viewStudent(studentId);
  } catch (err) {
    toast('Failed: ' + err.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = '✅ Confirm'; }
  }
}

async function revokeRetake(studentId, code) {
  if (!confirm('Revoke retake code ' + code + '?')) return;
  try {
    await revokeRetakeBackend(code);
    var s = DB.state.students.find(function(x) { return x.id === studentId; });
    if (s) {
      s.retakeActive = 'NO';
      s.retakeCode = null;
      logActivity(studentId, 'Retake revoked', code);
      saveLocal();
    }
    toast('🚫 Retake revoked.', 'warning');
    viewStudent(studentId);
  } catch (err) {
    toast('Failed to revoke.', 'error');
  }
}

function renderAnalytics(main) {
  var students = DB.state.students;
  var total = students.length;
  var avgScores = students.map(getStudentAverage).filter(function(x) { return x > 0; });
  var classAvg = avgScores.length ? Math.round(avgScores.reduce(function(a,b) { return a+b; }, 0) / avgScores.length) : 0;
  var classProgress = total ? Math.round(students.reduce(function(a,s) { return a + getStudentPercent(s); }, 0) / total) : 0;
  var takers = students.filter(function(s) { return s.examTakenAt; });
  var passRate = takers.length ? Math.round(takers.filter(function(s) { return isExamPassed(s); }).length / takers.length * 100) : 0;

  var html = '';
  html += '<div class="topbar"><div class="topbar-left"><h1>📈 Class Analytics</h1>';
  html += '<p>Aggregate performance metrics</p></div></div>';

  html += '<div class="stats-grid">';
  html += statCard('Class Average', classAvg + '%', '📊', '');
  html += statCard('Avg Progress', classProgress + '%', '📈', '');
  html += statCard('Exam Pass Rate', passRate + '%', '✅', passRate >= 75 ? 'success' : 'warning');
  html += statCard('Total Students', total, '👥', '');
  html += '</div>';

  html += '<div class="card"><div class="card-header"><h2 class="card-title">Score Distribution (Unit Average)</h2></div>';
  html += renderScoreDistribution(students);
  html += '</div>';

  main.innerHTML = html;
}

function renderScoreDistribution(students) {
  var buckets = [
    { label: '<60%', min: 0, max: 59 },
    { label: '60-69%', min: 60, max: 69 },
    { label: '70-79%', min: 70, max: 79 },
    { label: '80-89%', min: 80, max: 89 },
    { label: '90-100%', min: 90, max: 100 }
  ];
  var counts = buckets.map(function(b) {
    return students.filter(function(s) {
      var a = getUnitAverageOnly(s);
      return a > 0 && a >= b.min && a <= b.max;
    }).length;
  });
  var max = Math.max.apply(null, counts.concat([1]));
  var html = '<div class="bar-chart">';
  buckets.forEach(function(b, i) {
    var pct = Math.round((counts[i] / max) * 100);
    var bg = b.max < 75 ? 'linear-gradient(180deg,var(--accent),var(--warning))' : 'linear-gradient(180deg,var(--primary),var(--success))';
    html += '<div class="bar-wrap">';
    html += '<div class="bar-value">' + counts[i] + '</div>';
    html += '<div class="bar" style="height:' + pct + '%;background:' + bg + ';"></div>';
    html += '<div class="bar-label">' + b.label + '</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function exportCSV() {
  var students = DB.state.students;
  if (!students.length) return toast('No data to export.', 'warning');
  var headers = ['Name','StudentNo','Section','Group','Email','UnitsCompleted','UnitAvg','ExamScore','ExamTotal','ExamPercent','ExamResult','RetakeActive','RetakeCode','SubmissionCode','LastActive','Notes'];
  var rows = students.map(function(s) {
    return [
      s.name, s.studentNo || '', s.section || '', s.group || '', s.email || '',
      getStudentPercent(s) + '%', getUnitAverageOnly(s) + '%',
      getExamScore(s) || '', getExamTotal(s) || '', getExamPercent(s) || '', isExamPassed(s) ? 'PASSED' : (s.examTakenAt ? 'FAILED' : 'NOT TAKEN'),
      s.retakeActive || 'NO', s.retakeCode || '', s.submissionCode || '',
      s.lastActive || '', (s.notes || '').replace(/\n/g, ' ')
    ];
  });
  var csv = [headers].concat(rows).map(function(r) {
    return r.map(function(c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  downloadFile(csv, 'respiratory-mastery-roster-' + todayISO() + '.csv', 'text/csv');
  toast('✅ CSV exported.', 'success');
}

function exportJSON() {
  var data = Object.assign({ exported: new Date().toISOString(), appVersion: '2.0' }, DB.state);
  downloadFile(JSON.stringify(data, null, 2), 'respiratory-mastery-backup-' + todayISO() + '.json', 'application/json');
  toast('✅ Backup exported.', 'success');
}

function restoreBackup(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.students) throw new Error('Invalid backup');
      if (!confirm('Restore ' + data.students.length + ' students? This replaces your current roster.')) return;
      DB.state = Object.assign({}, DB.state, data);
      saveLocal();
      toast('✅ Restored.', 'success');
      navigate('roster');
    } catch (err) { toast('Invalid file.', 'error'); }
  };
  reader.readAsText(file);
}

function downloadFile(content, filename, mime) {
  var blob = new Blob([content], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function clearAllData() {
  if (!confirm('⚠️ Delete ALL local roster data?\n\n(Google Sheet data is preserved)')) return;
  if (!confirm('This cannot be undone. Continue?')) return;
  DB.state.students = [];
  DB.state.activityLog = [];
  saveLocal();
  toast('All local data cleared.', 'warning');
  navigate('overview');
}

    courseName: document.getElementById('s_course').value.trim(),
    instructorName: document.getElementById('s_instructor').value.trim(),
    passingScore: parseInt(document.getElementById('s_pass').value, 10) || 90,
    atRiskThreshold: parseInt(document.getElementById('s_risk').value, 10) || 75,
    examPassingScore: parseInt(document.getElementById('s_exam_pass').value, 10) || 15,
    inactiveDays: 7
  };
  saveLocal();
  toast('✅ Settings saved.', 'success');
}

function renderHelp(main) {
  main.innerHTML = '<div class="topbar"><div class="topbar-left"><h1>❓ Help</h1></div></div>' +
    '<div class="card"><h3>🎯 How to import students</h3>' +
    '<ol style="margin-left:1.5rem;line-height:1.8;"><li>Ask the student for their submission code (e.g. <code>RA-1234-5678</code>)</li>' +
    '<li>Click <strong>Import Students</strong> in the sidebar</li>' +
    '<li>Enter the code and click <strong>Fetch</strong></li>' +
    '<li>Review the preview and click <strong>Add to Roster</strong></li></ol>' +
    '<p class="text-sm text-gray mt-2">You can also scan QR codes or bulk-sync from Google Sheets.</p></div>' +
    '<div class="card"><h3>🔓 Granting retakes</h3>' +
    '<p>From any student\'s profile, click <strong>Grant Retake</strong>, select a reason, and confirm. The student will receive a unique code to enter in their app.</p></div>';
}

function logActivity(studentId, action, detail) {
  DB.state.activityLog.push({
    ts: new Date().toISOString(),
    studentId: studentId,
    action: action,
    detail: detail
  });
  if (DB.state.activityLog.length > 500) DB.state.activityLog = DB.state.activityLog.slice(-500);
  saveLocal();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

/* ---------- INIT ---------- */
function init() {
  loadLocal();
  document.querySelectorAll('.nav-item[data-view]').forEach(function(n) {
    n.addEventListener('click', function() { navigate(n.dataset.view); });
  });
  document.getElementById('menuToggle').addEventListener('click', function() {
    document.getElementById('sidebar').classList.toggle('open');
  });
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target.id === 'modalOverlay') closeModal();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });
  navigate('overview');
  updateAlertBadge();
  checkBackend();
}
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('beforeunload', function() { stopQRScanner(); });
</script>
</body>
</html>
