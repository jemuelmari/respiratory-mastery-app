        f.anonymous ? '' : (s.studentNo || ''),
        f.anonymous ? '' : (s.section || ''),
        f.anonymous ? '' : (s.group || ''),
        f.anonymous ? 'YES' : 'NO',
        f.rating || '',
        f.category || '',
        (f.message || '').replace(/\n/g, ' '),
        f.submittedAt || ''
      ]);

  var csv = rows.map(function(r) {
    return r.map(function(c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  downloadFile(csv, 'feedback-' + todayISO() + '.csv', 'text/csv');

}

function renderAnalytics(main) {
  var students = DB.state.students;
  var total = students.length;
  var avgScores = students.map(getStudentAverage).filter(function(x) { return x > 0; });
  var classAvg = avgScores.length ? Math.round(avgScores.reduce(function(a, b) { return a + b; }, 0) / avgScores.length) : 0;
  var classProgress = total ? Math.round(students.reduce(function(a, s) { return a + getStudentPercent(s); }, 0) / total) : 0;
  var completionRate = total ? Math.round(students.filter(function(s) { return getStudentPercent(s) === 100; }).length / total * 100) : 0;
  var examTakers = students.filter(function(s) { return s.exam && s.exam.submitted; });
  var examPassRate = examTakers.length ? Math.round(examTakers.filter(function(s) { return s.exam.passed; }).length / examTakers.length * 100) : 0;

  var html = '';
  html += '<div class="card"><h1>&#128200; Class Analytics</h1>';
  html += '<p style="color:var(--gray);">Aggregate performance across all students.</p></div>';

  html += '<div class="dashboard-grid">';
  html += '<div class="stat-card"><div class="stat-value">' + classAvg + '%</div><div class="stat-label">Class Average</div></div>';
  html += '<div class="stat-card"><div class="stat-value">' + classProgress + '%</div><div class="stat-label">Avg Progress</div></div>';
  html += '<div class="stat-card success"><div class="stat-value">' + completionRate + '%</div><div class="stat-label">Units Completion</div></div>';
  html += '<div class="stat-card ' + (examPassRate >= 75 ? 'success' : 'warning') + '"><div class="stat-value">' + examPassRate + '%</div><div class="stat-label">Exam Pass Rate</div></div>';
  html += '<div class="stat-card"><div class="stat-value">' + total + '</div><div class="stat-label">Total Students</div></div>';
  html += '</div>';

  html += '<div class="card"><h2>Score Distribution</h2>' + renderScoreDistribution(students) + '</div>';
  html += '<div class="card"><h2>Section Comparison</h2>' + renderSectionComparison(students) + '</div>';

  html += '<div class="card"><h2>&#128221; Exam Participation</h2>';
  html += '<div class="table-wrap"><table><thead><tr><th>Section</th><th>Took Exam</th><th>Passed</th><th>Pass Rate</th></tr></thead><tbody>';

  var sections = {};
  students.forEach(function(s) {
    var sec = s.section || 'Unassigned';
    if (!sections[sec]) sections[sec] = { taken: 0, passed: 0, total: 0 };
    sections[sec].total++;
    if (s.exam && s.exam.submitted) {
      sections[sec].taken++;
      if (s.exam.passed) sections[sec].passed++;
    }
  });
  Object.keys(sections).forEach(function(sec) {
    var d = sections[sec];
    html += '<tr><td><strong>' + escapeHtml(sec) + '</strong></td>';
    html += '<td>' + d.taken + '/' + d.total + '</td>';
    html += '<td>' + d.passed + '</td>';
    html += '<td>' + (d.taken ? Math.round(d.passed / d.taken * 100) : 0) + '%</td></tr>';
  });
  html += '</tbody></table></div></div>';

  main.innerHTML = html;
}

function renderScoreDistribution(students) {
  var buckets = [
    { label: '<60%', min: 0, max: 59 },
    { label: '60-69%', min: 60, max: 69 },
    { label: '70-79%', min: 70, max: 79 },
    { label: '80-89%', min: 80, max: 89 },
    { label: '90-100%', min: 90, max: 100 }
  ];
  var counts = buckets.map(function(b) {
    return students.filter(function(s) {
      var a = getUnitAverageOnly(s);
      return a > 0 && a >= b.min && a <= b.max;
    }).length;
  });
  var max = Math.max.apply(null, counts.concat([1]));
  var html = '<div class="bar-chart">';
  buckets.forEach(function(b, i) {
    var bg = b.max < 75 ? 'linear-gradient(180deg,var(--accent),var(--warning))' : 'linear-gradient(180deg,var(--primary),var(--success))';
    html += '<div class="bar-wrap">';
    html += '<div class="bar-value">' + counts[i] + '</div>';
    html += '<div class="bar" style="height:' + ((counts[i]/max)*100) + '%;background:' + bg + ';"></div>';
    html += '<div class="bar-label">' + b.label + '</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderSectionComparison(students) {
  var sections = {};
  students.forEach(function(s) {
    var sec = s.section || 'Unassigned';
    if (!sections[sec]) sections[sec] = { count: 0, scores: [] };
    sections[sec].count++;
    var a = getUnitAverageOnly(s);
    if (a > 0) sections[sec].scores.push(a);
  });
  var rows = Object.keys(sections).map(function(sec) {
    var d = sections[sec];
    var avg = d.scores.length ? Math.round(d.scores.reduce(function(a, b) { return a + b; }, 0) / d.scores.length) : 0;
    return { sec: sec, count: d.count, avg: avg };
  });
  var html = '<div class="table-wrap"><table><thead><tr><th>Section</th><th>Students</th><th>Average Score</th></tr></thead><tbody>';
  if (rows.length === 0) {
    html += '<tr><td colspan="3" style="text-align:center;color:var(--gray);">No data yet.</td></tr>';
  } else {
    rows.forEach(function(r) {
      html += '<tr><td><strong>' + escapeHtml(r.sec) + '</strong></td>';
      html += '<td>' + r.count + '</td>';
      html += '<td>' + r.avg + '%</td></tr>';
    });
  }
  html += '</tbody></table></div>';
  return html;
}

function exportCSV() {
  var students = DB.state.students;
  if (!students.length) return toast('No data to export.', 'warning');

  var headers = [
    'Name','StudentNo','Section','Group','Email','Enrolled','UnitsProgress%','UnitAvg%','OverallAvg%','Status',
    'Unit1','Unit2','Unit3','Unit4','Unit5','Unit6','Unit7',
    'ExamID','ExamScore','ExamTotal','ExamPercentage','ExamResult','ExamDate','ExamDuration',
    'IntegrityFocusLoss','IntegrityCopy','IntegrityRightClick','IntegrityPrint','IntegrityTotal',
    'RetakeActive','RetakeCode','RetakeUsed','RetakeReason','RetakeGrantedBy','RetakeGrantedAt','ExamAttempts',
    'Notes'
  ];

  var rows = students.map(function(s) {
    var units = ['unit1','unit2','unit3','unit4','unit5','unit6','unit7'];
    var unitScores = units.map(function(u) {
      var arr = s.quizAttempts && s.quizAttempts[u];
      return arr && arr.length ? Math.max.apply(null, arr) : '';
    });
    var exam = s.exam;
    var i = (exam && exam.integrity) || {};
    var intTotal = ((i.focusLosses && i.focusLosses.length) || 0) + (i.copyAttempts || 0) + (i.rightClicks || 0) + (i.printAttempts || 0);
    var lastGrant = (s.retakeGrants || []).slice(-1)[0] || {};

    return [
      s.name, s.studentNo || '', s.section || '', s.group || '', s.email || '', s.enrolled || '',
      getStudentPercent(s), getUnitAverageOnly(s), getStudentAverage(s), getStudentStatus(s).label
    ].concat(unitScores).concat([
      exam ? (exam.examId || '') : '',
      exam ? (exam.score || '') : '',
      exam ? (exam.total || '') : '',
      exam ? (exam.percentage || '') : '',
      exam && exam.submitted ? (exam.passed ? 'PASSED' : 'FAILED') : 'NOT TAKEN',
      exam ? (exam.takenAt || '') : '',
      exam ? (exam.durationSec || '') : '',
      (i.focusLosses && i.focusLosses.length) || 0,
      i.copyAttempts || 0,
      i.rightClicks || 0,
      i.printAttempts || 0,
      intTotal,
      hasActiveRetake(s) ? 'YES' : 'NO',
      s.retakeCode || '',
      s.retakeUsed ? 'YES' : 'NO',
      lastGrant.reason || '',
      lastGrant.grantedBy || '',
      lastGrant.grantedAt || '',
      1 + (s.examHistory || []).length,
      (s.notes || '').replace(/\n/g, ' ')
    ]);
  });

  var csv = [headers].concat(rows).map(function(r) {
    return r.map(function(c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  downloadFile(csv, 'respiratory-mastery-roster-' + todayISO() + '.csv', 'text/csv');
  toast('CSV exported.', 'success');
}

function exportJSON() {
  var data = Object.assign({ exported: new Date().toISOString(), appVersion: '1.6' }, DB.state);
  downloadFile(JSON.stringify(data, null, 2), 'respiratory-mastery-backup-' + todayISO() + '.json', 'application/json');
  toast('JSON backup exported.', 'success');
}

function restoreBackup(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.students) throw new Error('Invalid backup file');
      if (!confirm('Restore ' + data.students.length + ' students? This will REPLACE your current roster.')) return;
      DB.state = Object.assign({}, DB.state, data);
      saveDB();
      toast('Backup restored successfully.', 'success');
      renderView('roster');
    } catch (err) {
      toast('Invalid backup file.', 'error');
    }
  };
  reader.readAsText(file);
}

function downloadFile(content, filename, mime) {
  var blob = new Blob([content], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  html += '<p style="font-size:0.85rem;color:var(--gray);margin-top:0.5rem;">App Version: 1.6</p></div>';

  main.innerHTML = html;
}

function logActivity(studentId, action, detail) {
  DB.state.activityLog.push({
    ts: new Date().toISOString(),
    studentId: studentId,
    action: action,
    detail: detail
  });
  if (DB.state.activityLog.length > 500) DB.state.activityLog = DB.state.activityLog.slice(-500);
  saveDB();
}

function openStudentApp() { window.open('index.html', '_blank'); }
function openGradebook() { window.open('gradebook.html', '_blank'); }

function init() {
  loadDB();
  document.querySelectorAll('.nav-item[data-view]').forEach(function(n) {
    n.addEventListener('click', function() { navigate(n.dataset.view); });
  });
  document.getElementById('menuToggle').addEventListener('click', function() {
    document.getElementById('sidebar').classList.toggle('open');
  });
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target.id === 'modalOverlay') closeModal();
  });
  navigate('overview');
  updateAlertBadge();
}
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('beforeunload', function() { stopQRScanner(); });
</script>
</body>
